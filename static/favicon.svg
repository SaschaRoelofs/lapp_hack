<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Orange rounded background -->
  <rect width="64" height="64" rx="14" fill="#e95e0f"/>
  <!-- Cable cross-section: outer ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="white" stroke-width="4"/>
  <!-- Inner conductors arranged in circle -->
  <circle cx="32" cy="18" r="4" fill="white"/>
  <circle cx="43.7" cy="25" r="4" fill="white"/>
  <circle cx="43.7" cy="39" r="4" fill="white"/>
  <circle cx="32" cy="46" r="4" fill="white"/>
  <circle cx="20.3" cy="39" r="4" fill="white"/>
  <circle cx="20.3" cy="25" r="4" fill="white"/>
  <!-- Center conductor -->
  <circle cx="32" cy="32" r="5" fill="white"/>
</svg>
