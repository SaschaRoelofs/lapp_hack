    <div class="h-px" style="background:linear-gradient(90deg,transparent 5%,rgba(233,94,15,0.2) 30%,rgba(249,115,22,0.3) 50%,rgba(233,94,15,0.2) 70%,transparent 95%)"></div>
  </header>
  <script>
    (function () {
      var path = window.location.pathname.replace(/\/$/, '') || '/';
      // Desktop nav active state
      document.querySelectorAll('#main-nav .nav-link').forEach(function (a) {
        var p = a.dataset.path.replace(/\/$/, '') || '/';
        if (p === path) {
          a.classList.remove('font-medium', 'text-slate-400', 'hover:bg-white/[0.07]', 'hover:text-slate-200', 'hover:-translate-y-px');
          a.classList.add('font-semibold', 'text-orange-400', 'bg-orange-500/10');
        }
      });
      // Mobile nav active state
      document.querySelectorAll('#mobile-menu .mob-link').forEach(function (a) {
        var p = a.dataset.path.replace(/\/$/, '') || '/';
        if (p === path) {
          a.classList.remove('text-slate-300');
          a.classList.add('font-semibold', 'text-orange-400', 'bg-orange-500/10');
        }
      });
      // Hamburger toggle
      var btn = document.getElementById('mobile-menu-btn');
      var menu = document.getElementById('mobile-menu');
      var h1 = document.getElementById('ham-1');
      var h2 = document.getElementById('ham-2');
      var h3 = document.getElementById('ham-3');
      btn.addEventListener('click', function () {
        var open = menu.classList.toggle('flex');
        menu.classList.toggle('hidden', !open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) {
          h1.style.transform = 'translateY(7px) rotate(45deg)';
          h2.style.opacity = '0';
          h3.style.transform = 'translateY(-7px) rotate(-45deg)';
        } else {
          h1.style.transform = ''; h2.style.opacity = ''; h3.style.transform = '';
        }
      });
    })();
  </script>
