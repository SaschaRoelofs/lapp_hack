<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schaltplan-Analyse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lapp: { 600: '#e95e0f', 700: '#c94e0a' },
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen" x-data="analyzer()" x-cloak>

  <!-- Header -->
  <header class="bg-gray-900 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-5 flex items-center gap-4">
      <div class="bg-lapp-600 rounded-lg p-2">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Schaltplan-Analyse</h1>
        <p class="text-gray-400 text-sm">Kabellisten aus PDF-Schaltplänen extrahieren</p>
      </div>
      <nav class="ml-auto flex items-center gap-1">
        <a href="/" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/10 hover:text-white transition-colors">Optimierer</a>
        <a href="/search" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/10 hover:text-white transition-colors">Suche</a>
        <a href="/analyze" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-white/10 text-white">Analyse</a>
        <a href="/settings" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/10 hover:text-white transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">

    <!-- Upload Section -->
    <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="bg-gray-50 border-b border-gray-200 px-6 py-4">
        <h2 class="text-lg font-semibold text-gray-700">PDF-Schaltplan hochladen</h2>
      </div>
      <div class="p-6">
        <div class="flex flex-col items-center justify-center border-2 border-dashed rounded-xl p-10 transition-colors"
             :class="dragOver ? 'border-lapp-600 bg-orange-50' : 'border-gray-300 bg-gray-50'"
             @dragover.prevent="dragOver = true"
             @dragleave.prevent="dragOver = false"
             @drop.prevent="handleDrop($event)">

          <svg class="w-12 h-12 text-gray-400 mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
          </svg>

          <p class="text-gray-600 mb-2">PDF-Datei hierher ziehen oder</p>
          <label class="cursor-pointer px-4 py-2 bg-lapp-600 text-white rounded-lg hover:bg-lapp-700 transition-colors font-medium text-sm">
            Datei auswählen
            <input type="file" accept=".pdf" class="hidden" @change="handleFileSelect($event)">
          </label>
          <p class="text-xs text-gray-400 mt-2">Nur PDF-Dateien, max. 50 MB</p>
        </div>

        <!-- Selected file info -->
        <template x-if="selectedFile">
          <div class="mt-4 flex items-center gap-3 p-3 bg-gray-50 rounded-lg border border-gray-200">
            <svg class="w-8 h-8 text-red-500 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/>
            </svg>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-gray-800 truncate" x-text="selectedFile.name"></p>
              <p class="text-xs text-gray-500" x-text="formatFileSize(selectedFile.size)"></p>
            </div>
            <button @click="selectedFile = null" class="text-gray-400 hover:text-gray-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
        </template>

        <!-- Options -->
        <div class="mt-4 flex flex-wrap items-center gap-6">
          <label class="flex items-center gap-2 text-sm text-gray-600">
            <input type="checkbox" x-model="useVision" class="rounded border-gray-300 text-lapp-600 focus:ring-lapp-600">
            Vision-KI für grafische Analyse nutzen
          </label>
        </div>

        <!-- Analyze button -->
        <div class="mt-6">
          <button @click="analyze()"
                  :disabled="!selectedFile || loading"
                  class="px-6 py-2.5 bg-lapp-600 text-white rounded-lg hover:bg-lapp-700 transition-colors font-medium disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
            <template x-if="loading">
              <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
              </svg>
            </template>
            <span x-text="loading ? 'Analyse läuft...' : 'Schaltplan analysieren'"></span>
          </button>
        </div>

        <!-- Error message -->
        <template x-if="error">
          <div class="mt-4 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm" x-text="error"></div>
        </template>
      </div>
    </section>

    <!-- Results Section -->
    <template x-if="result">
      <section class="space-y-6">

        <!-- Summary cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Kabel gefunden</p>
            <p class="text-3xl font-bold text-gray-800 mt-1" x-text="result.cables.length"></p>
          </div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Seiten analysiert</p>
            <p class="text-3xl font-bold text-gray-800 mt-1" x-text="result.pages_analyzed"></p>
          </div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Text-Extraktion</p>
            <p class="text-3xl font-bold text-gray-800 mt-1" x-text="result.pages_text"></p>
            <p class="text-xs text-gray-400">Seiten</p>
          </div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Vision-KI</p>
            <p class="text-3xl font-bold text-gray-800 mt-1" x-text="result.pages_vision"></p>
            <p class="text-xs text-gray-400">Seiten</p>
          </div>
        </div>

        <!-- Warnings -->
        <template x-if="result.warnings.length > 0">
          <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-4">
            <h3 class="text-sm font-semibold text-yellow-800 mb-2">Hinweise</h3>
            <ul class="text-sm text-yellow-700 space-y-1">
              <template x-for="(w, i) in result.warnings" :key="i">
                <li class="flex gap-2">
                  <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.168 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
                  </svg>
                  <span x-text="w"></span>
                </li>
              </template>
            </ul>
          </div>
        </template>

        <!-- Cable table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <div class="bg-gray-50 border-b border-gray-200 px-6 py-4 flex items-center justify-between">
            <h2 class="text-lg font-semibold text-gray-700">Extrahierte Kabelliste</h2>
            <button @click="exportCSV()"
                    class="px-3 py-1.5 text-sm font-medium bg-gray-800 text-white rounded-lg hover:bg-gray-700 transition-colors flex items-center gap-1.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
              </svg>
              CSV Export
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="bg-gray-50 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">
                  <th class="px-4 py-3">#</th>
                  <th class="px-4 py-3">Bezeichnung</th>
                  <th class="px-4 py-3">Kabeltyp</th>
                  <th class="px-4 py-3 text-right">Querschnitt</th>
                  <th class="px-4 py-3 text-right">Adern</th>
                  <th class="px-4 py-3">Aderfarben</th>
                  <th class="px-4 py-3 text-right">Länge</th>
                  <th class="px-4 py-3">Von → Nach</th>
                  <th class="px-4 py-3">Stecker/Klemmen</th>
                  <th class="px-4 py-3 text-right">Seite</th>
                  <th class="px-4 py-3 text-right">Konfidenz</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100">
                <template x-for="(cable, idx) in result.cables" :key="idx">
                  <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3 text-gray-400" x-text="idx + 1"></td>
                    <td class="px-4 py-3 font-medium" x-text="cable.designation || '–'"></td>
                    <td class="px-4 py-3" x-text="cable.cable_type || '–'"></td>
                    <td class="px-4 py-3 text-right" x-text="cable.cross_section_mm2 != null ? cable.cross_section_mm2 + ' mm²' : '–'"></td>
                    <td class="px-4 py-3 text-right" x-text="cable.num_cores ?? '–'"></td>
                    <td class="px-4 py-3">
                      <div class="flex flex-wrap gap-1">
                        <template x-for="(color, ci) in (cable.core_colors || [])" :key="ci">
                          <span class="px-1.5 py-0.5 bg-gray-100 text-gray-600 rounded text-xs" x-text="color"></span>
                        </template>
                        <span x-show="!cable.core_colors || cable.core_colors.length === 0" class="text-gray-400">–</span>
                      </div>
                    </td>
                    <td class="px-4 py-3 text-right" x-text="cable.length_m != null ? cable.length_m + ' m' : '–'"></td>
                    <td class="px-4 py-3 text-xs">
                      <template x-for="(conn, ci) in (cable.connections || [])" :key="ci">
                        <div>
                          <span class="text-gray-700" x-text="formatTerminal(conn.from_terminal)"></span>
                          <span class="text-gray-400"> → </span>
                          <span class="text-gray-700" x-text="formatTerminal(conn.to_terminal)"></span>
                        </div>
                      </template>
                      <span x-show="!cable.connections || cable.connections.length === 0" class="text-gray-400">–</span>
                    </td>
                    <td class="px-4 py-3 text-xs">
                      <template x-for="(c, ci) in (cable.connectors || [])" :key="ci">
                        <span class="px-1.5 py-0.5 bg-blue-50 text-blue-700 rounded mr-1" x-text="c"></span>
                      </template>
                      <span x-show="!cable.connectors || cable.connectors.length === 0" class="text-gray-400">–</span>
                    </td>
                    <td class="px-4 py-3 text-right text-gray-500" x-text="cable.source_page != null ? cable.source_page + 1 : '–'"></td>
                    <td class="px-4 py-3 text-right">
                      <span class="px-1.5 py-0.5 rounded text-xs font-medium"
                            :class="cable.confidence >= 0.8 ? 'bg-green-100 text-green-700' : cable.confidence >= 0.6 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'"
                            x-text="Math.round(cable.confidence * 100) + '%'"></span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>

            <template x-if="result.cables.length === 0">
              <div class="px-6 py-12 text-center text-gray-400">
                <p>Keine Kabel im Schaltplan gefunden.</p>
              </div>
            </template>
          </div>
        </div>

      </section>
    </template>

  </main>

  <script>
    function analyzer() {
      return {
        selectedFile: null,
        dragOver: false,
        loading: false,
        error: null,
        result: null,
        useVision: true,

        handleFileSelect(e) {
          const file = e.target.files[0];
          if (file && file.type === 'application/pdf') {
            this.selectedFile = file;
            this.error = null;
            this.result = null;
          }
        },

        handleDrop(e) {
          this.dragOver = false;
          const file = e.dataTransfer.files[0];
          if (file && file.type === 'application/pdf') {
            this.selectedFile = file;
            this.error = null;
            this.result = null;
          }
        },

        formatFileSize(bytes) {
          if (bytes < 1024) return bytes + ' B';
          if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
          return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        },

        formatTerminal(t) {
          if (!t) return '';
          const parts = [t.device, t.terminal, t.pin].filter(Boolean);
          return parts.join(':') || '';
        },

        async analyze() {
          if (!this.selectedFile) return;
          this.loading = true;
          this.error = null;
          this.result = null;

          const formData = new FormData();
          formData.append('file', this.selectedFile);

          const params = new URLSearchParams();
          params.append('use_vision', this.useVision);

          try {
            const resp = await fetch(`/api/analyze?${params}`, {
              method: 'POST',
              body: formData,
            });

            if (!resp.ok) {
              const err = await resp.json().catch(() => ({}));
              throw new Error(err.detail || `Fehler ${resp.status}`);
            }

            this.result = await resp.json();
          } catch (e) {
            this.error = e.message || 'Unbekannter Fehler bei der Analyse.';
          } finally {
            this.loading = false;
          }
        },

        exportCSV() {
          if (!this.result || !this.result.cables.length) return;

          const headers = ['Nr', 'Bezeichnung', 'Kabeltyp', 'Querschnitt (mm²)', 'Adern', 'Aderfarben', 'Länge (m)', 'Von', 'Nach', 'Stecker/Klemmen', 'Seite', 'Konfidenz'];
          const rows = this.result.cables.map((c, i) => {
            const from = (c.connections || []).map(cn => this.formatTerminal(cn.from_terminal)).join('; ');
            const to = (c.connections || []).map(cn => this.formatTerminal(cn.to_terminal)).join('; ');
            return [
              i + 1,
              c.designation || '',
              c.cable_type || '',
              c.cross_section_mm2 ?? '',
              c.num_cores ?? '',
              (c.core_colors || []).join(', '),
              c.length_m ?? '',
              from,
              to,
              (c.connectors || []).join(', '),
              c.source_page != null ? c.source_page + 1 : '',
              Math.round((c.confidence || 0) * 100) + '%',
            ];
          });

          const csvContent = [headers, ...rows]
            .map(row => row.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(';'))
            .join('\n');

          const BOM = '\uFEFF';
          const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'kabelliste.csv';
          a.click();
          URL.revokeObjectURL(url);
        }
      };
    }
  </script>

</body>
</html>
