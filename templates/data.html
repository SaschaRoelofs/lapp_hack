<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAPP Kabeldaten</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lapp: { 600: '#e95e0f', 700: '#c94e0a' },
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen" x-data="dataViewer()" x-init="init()">

  <!-- Header -->
  <header class="bg-gray-900 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-5 flex items-center gap-4">
      <div class="bg-lapp-600 rounded-lg p-2">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7M4 7l4-4h8l4 4M9 11h6M9 15h4"/>
        </svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight">LAPP Kabeldaten</h1>
        <p class="text-gray-400 text-sm">Produktkatalog &amp; Kabelspezifikationen</p>
      </div>
      <nav class="ml-auto flex items-center gap-1">
        <a href="/" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/10 hover:text-white transition-colors">Optimierer</a>
        <a href="/data" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-white/10 text-white">Kabeldaten</a>
        <a href="/shop" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/10 hover:text-white transition-colors">Shop</a>
        <a href="/analyze" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-white/10 hover:text-white transition-colors">Analyse</a>
      </nav>
    </div>
  </header>

  <div class="flex h-[calc(100vh-76px)]">

    <!-- Left Panel: Product List -->
    <aside class="w-80 flex-shrink-0 bg-white border-r border-gray-200 flex flex-col">
      <!-- Search -->
      <div class="p-3 border-b border-gray-200">
        <input type="text" x-model="productSearch" placeholder="Produkt suchen..."
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-lapp-600 focus:border-lapp-600 outline-none">
      </div>
      <!-- Product List -->
      <div class="flex-1 overflow-y-auto">
        <template x-for="p in filteredProducts" :key="p.id">
          <button @click="selectProduct(p.id)"
            class="w-full text-left px-4 py-3 border-b border-gray-100 transition-colors"
            :class="selectedProductId == p.id ? 'bg-lapp-600/10 border-l-4 border-l-lapp-600' : 'hover:bg-gray-50'">
            <div class="text-sm font-medium text-gray-800" x-text="p.name"></div>
            <div class="text-xs text-gray-400 mt-0.5 truncate" x-text="p.description"></div>
          </button>
        </template>
        <div x-show="filteredProducts.length === 0" class="px-4 py-8 text-center text-gray-400 text-sm">
          Keine Produkte gefunden
        </div>
      </div>
      <div class="p-3 border-t border-gray-200 text-xs text-gray-400 text-center">
        <span x-text="filteredProducts.length"></span> / <span x-text="products.length"></span> Produkte
      </div>
    </aside>

    <!-- Right Panel: Detail View -->
    <main class="flex-1 overflow-y-auto">

      <!-- Empty State -->
      <div x-show="!selectedProductId" class="flex items-center justify-center h-full text-gray-400">
        <div class="text-center">
          <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 15.75l-2.489-2.489m0 0a3.375 3.375 0 10-4.773-4.773 3.375 3.375 0 004.773 4.773zM21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p class="text-lg font-medium">Produkt auswählen</p>
          <p class="text-sm mt-1">Wähle ein Produkt aus der Liste links</p>
        </div>
      </div>

      <!-- Product Detail + Cables -->
      <div x-show="selectedProductId" x-cloak class="p-6 space-y-6">

        <!-- Product Info Card -->
        <template x-if="productDetail">
          <section>
            <div class="flex items-start gap-4 mb-4">
              <div class="bg-lapp-600 rounded-lg p-2.5 flex-shrink-0">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7M4 7l4-4h8l4 4M9 11h6M9 15h4"/>
                </svg>
              </div>
              <div>
                <h2 class="text-xl font-bold text-gray-800" x-text="productDetail.name"></h2>
                <p class="text-sm text-gray-500 mt-0.5" x-text="productDetail.description"></p>
              </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
              <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Technische Daten</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-x-6 gap-y-3 text-sm">
                <template x-for="field in productFields" :key="field.key">
                  <div x-show="productDetail[field.key]" class="flex flex-col">
                    <dt class="text-xs font-medium text-gray-400" x-text="field.label"></dt>
                    <dd class="text-gray-700 mt-0.5" x-text="productDetail[field.key]"></dd>
                  </div>
                </template>
              </div>
            </div>
          </section>
        </template>

        <!-- Cable Search -->
        <div class="flex items-center gap-4">
          <h3 class="text-sm font-semibold text-gray-600">
            Kabel <span class="font-normal text-gray-400">(<span x-text="cables.length"></span> Einträge)</span>
          </h3>
          <input type="text" x-model="search" @input.debounce.300ms="loadCables()"
            placeholder="Artikelnr. suchen..."
            class="ml-auto w-64 border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-lapp-600 focus:border-lapp-600 outline-none">
        </div>

        <!-- Cables Table -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wide sticky top-0">
                <tr>
                  <th class="px-4 py-3 text-left">Variante</th>
                  <th class="px-4 py-3 text-left cursor-pointer hover:text-lapp-600" @click="sortBy('article_number')">
                    Artikelnr. <span x-show="sortCol==='article_number'" x-text="sortDir==='asc'?'▲':'▼'"></span>
                  </th>
                  <th class="px-4 py-3 text-center">Adern</th>
                  <th class="px-4 py-3 text-center">Typ</th>
                  <th class="px-4 py-3 text-right cursor-pointer hover:text-lapp-600" @click="sortBy('cross_section_mm2')">
                    mm² <span x-show="sortCol==='cross_section_mm2'" x-text="sortDir==='asc'?'▲':'▼'"></span>
                  </th>
                  <th class="px-4 py-3 text-right">AWG</th>
                  <th class="px-4 py-3 text-right">⌀ [mm]</th>
                  <th class="px-4 py-3 text-center">Farbe</th>
                  <th class="px-4 py-3 text-right cursor-pointer hover:text-lapp-600" @click="sortBy('copper_index_kg_km')">
                    Cu [kg/km] <span x-show="sortCol==='copper_index_kg_km'" x-text="sortDir==='asc'?'▲':'▼'"></span>
                  </th>
                  <th class="px-4 py-3 text-right cursor-pointer hover:text-lapp-600" @click="sortBy('weight_kg_km')">
                    Gew. [kg/km] <span x-show="sortCol==='weight_kg_km'" x-text="sortDir==='asc'?'▲':'▼'"></span>
                  </th>
                </tr>
              </thead>
              <tbody>
                <template x-for="cable in sortedCables" :key="cable.id">
                  <tr class="border-t border-gray-100 hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-2 text-gray-500 text-xs" x-text="cable.product_variant"></td>
                    <td class="px-4 py-2 font-mono text-xs" x-text="cable.article_number"></td>
                    <td class="px-4 py-2 text-center" x-text="cable.num_cores ?? '-'"></td>
                    <td class="px-4 py-2 text-center">
                      <span x-show="cable.conductor_type"
                        class="inline-block px-1.5 py-0.5 rounded text-xs font-semibold"
                        :class="cable.conductor_type === 'G' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'"
                        x-text="cable.conductor_type"></span>
                    </td>
                    <td class="px-4 py-2 text-right" x-text="cable.cross_section_mm2 ?? '-'"></td>
                    <td class="px-4 py-2 text-right text-gray-500" x-text="cable.awg ?? '-'"></td>
                    <td class="px-4 py-2 text-right text-gray-500" x-text="cable.outer_diameter_mm ?? '-'"></td>
                    <td class="px-4 py-2 text-center">
                      <span x-show="cable.colour || cable.insulation_color"
                        class="inline-block px-2 py-0.5 rounded-full text-xs"
                        :class="{
                          'bg-gray-200 text-gray-700': (cable.colour || cable.insulation_color || '').toLowerCase().includes('grey') || (cable.colour || cable.insulation_color || '').toLowerCase().includes('transparent'),
                          'bg-gray-800 text-white': (cable.colour || cable.insulation_color || '').toLowerCase().includes('black'),
                        }"
                        x-text="cable.colour || cable.insulation_color"></span>
                    </td>
                    <td class="px-4 py-2 text-right" x-text="cable.copper_index_kg_km != null ? fmt(cable.copper_index_kg_km) : '-'"></td>
                    <td class="px-4 py-2 text-right" x-text="cable.weight_kg_km != null ? fmt(cable.weight_kg_km) : '-'"></td>
                  </tr>
                </template>
                <tr x-show="cables.length === 0">
                  <td colspan="10" class="px-4 py-8 text-center text-gray-400">Keine Kabel gefunden</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const numFmt = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

    function dataViewer() {
      return {
        products: [],
        cables: [],
        search: '',
        productSearch: '',
        selectedProductId: '',
        productDetail: null,
        sortCol: 'article_number',
        sortDir: 'asc',
        loading: false,

        productFields: [
          { key: 'rated_voltage', label: 'Nennspannung' },
          { key: 'test_voltage', label: 'Prüfspannung' },
          { key: 'temperature_range', label: 'Temperaturbereich' },
          { key: 'min_bending_radius', label: 'Min. Biegeradius' },
          { key: 'conductor_stranding', label: 'Leiteraufbau' },
          { key: 'core_identification', label: 'Aderkennzeichnung' },
          { key: 'protective_conductor', label: 'Schutzleiter' },
          { key: 'flame_retardant', label: 'Flammwidrig' },
          { key: 'oil_resistant', label: 'Ölbeständig' },
          { key: 'norm_references', label: 'Normen / Zulassungen' },
          { key: 'application_range', label: 'Einsatzbereich' },
          { key: 'product_makeup', label: 'Aufbau' },
        ],

        fmt(v) {
          return numFmt.format(v);
        },

        get filteredProducts() {
          if (!this.productSearch.trim()) return this.products;
          const q = this.productSearch.toLowerCase();
          return this.products.filter(p => p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q));
        },

        async init() {
          await this.loadProducts();
        },

        async loadProducts() {
          const resp = await fetch('/api/products');
          this.products = await resp.json();
        },

        async loadCables() {
          const params = new URLSearchParams();
          if (this.selectedProductId) params.set('product_id', this.selectedProductId);
          if (this.search.trim()) params.set('search', this.search.trim());
          const resp = await fetch('/api/cables?' + params.toString());
          this.cables = await resp.json();
        },

        async loadProductDetail() {
          if (!this.selectedProductId) {
            this.productDetail = null;
            return;
          }
          const resp = await fetch('/api/products/' + this.selectedProductId);
          const data = await resp.json();
          this.productDetail = data.product;
        },

        selectProduct(id) {
          this.selectedProductId = String(id);
          this.loadCables();
          this.loadProductDetail();
        },

        sortBy(col) {
          if (this.sortCol === col) {
            this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            this.sortCol = col;
            this.sortDir = 'asc';
          }
        },

        get sortedCables() {
          const col = this.sortCol;
          const dir = this.sortDir === 'asc' ? 1 : -1;
          return [...this.cables].sort((a, b) => {
            let va = a[col], vb = b[col];
            if (va == null) return 1;
            if (vb == null) return -1;
            if (typeof va === 'string') return va.localeCompare(vb) * dir;
            return (va - vb) * dir;
          });
        },
      };
    }
  </script>
</body>
</html>
