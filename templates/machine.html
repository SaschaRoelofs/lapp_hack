<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <title>Maschinenvisualisierung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lapp: { 600: '#e95e0f', 700: '#c94e0a' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }

    /* Graph styles */
    .graph-container { position: relative; overflow: hidden; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; touch-action: none; }
    .graph-svg { cursor: grab; }
    .graph-svg:active { cursor: grabbing; }
    .graph-svg .node rect { cursor: pointer; transition: filter 0.15s; }
    .graph-svg .node rect:hover { filter: brightness(0.92); }
    .graph-svg .node text { pointer-events: none; }
    .graph-svg .edgePath path { fill: none; stroke-width: 2; }
    .graph-svg .edgeLabel text { font-size: 12px; fill: #64748b; }

    .subsystem-box { rx: 12; ry: 12; stroke-dasharray: 6 3; }

    /* Component type colors */
    .comp-motor     { fill: #dbeafe; stroke: #3b82f6; }
    .comp-sensor    { fill: #dcfce7; stroke: #22c55e; }
    .comp-protection{ fill: #fef3c7; stroke: #f59e0b; }
    .comp-controller{ fill: #ede9fe; stroke: #8b5cf6; }
    .comp-switch    { fill: #fce7f3; stroke: #ec4899; }
    .comp-transformer{ fill: #e0e7ff; stroke: #6366f1; }
    .comp-heater    { fill: #fee2e2; stroke: #ef4444; }
    .comp-assembly  { fill: #f0fdf4; stroke: #16a34a; }
    .comp-cable     { fill: #f1f5f9; stroke: #94a3b8; }

    /* Detail panel */
    .detail-panel {
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      border-radius: 1rem;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    @media (max-width: 767px) {
      .detail-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 70vh;
        border-radius: 1.25rem 1.25rem 0 0;
        z-index: 50;
        box-shadow: 0 -8px 32px rgba(15,23,42,0.18);
      }
      .detail-panel-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15,23,42,0.35);
        z-index: 49;
      }
    }

    .detail-panel-header {
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
      border-bottom: 1px solid #e2e8f0;
    }

    .detail-panel-body {
      padding: 1rem;
      display: grid;
      gap: 0.9rem;
    }

    .detail-block {
      border: 1px solid #e2e8f0;
      background: #ffffff;
      border-radius: 0.9rem;
      padding: 0.8rem 0.85rem;
    }

    .detail-grid {
      border: 1px solid #e2e8f0;
      background: #ffffff;
      border-radius: 0.9rem;
      overflow: hidden;
    }

    .detail-grid-item {
      padding: 0.7rem 0.85rem;
    }

    .detail-grid-item + .detail-grid-item {
      border-top: 1px solid #e2e8f0;
    }

    .detail-label {
      font-size: 0.675rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 0.35rem;
    }

    .detail-value {
      color: #0f172a;
      font-size: 0.9rem;
      line-height: 1.35rem;
      word-break: break-word;
    }

    .detail-muted {
      color: #64748b;
      font-size: 0.8rem;
      line-height: 1.15rem;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 5.5rem minmax(0, 1fr);
      gap: 0.5rem;
      align-items: start;
    }

    .meta-label {
      color: #6b7280;
      font-size: 0.875rem;
      line-height: 1.25rem;
    }

    .meta-value {
      min-width: 0;
      color: #111827;
      font-size: 0.875rem;
      line-height: 1.25rem;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .meta-value--nowrap {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border-radius: 999px;
      border: 1px solid #dbeafe;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 0.28rem 0.7rem;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .info-chip--amber {
      border-color: #fde68a;
      background: #fffbeb;
      color: #b45309;
    }

    .info-chip--green {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #15803d;
    }

    /* Legend */
    .legend-dot { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; display: inline-block; }

    /* Clickable cable edge labels */
    .cable-label-bg {
      cursor: pointer;
      transition: fill 0.12s, stroke 0.12s;
    }
    .cable-label-bg:hover {
      fill: #fff7ed !important;
      stroke: #e95e0f !important;
      stroke-width: 1.5 !important;
    }
    .cable-label-text {
      cursor: pointer;
      transition: fill 0.12s;
    }
    .cable-label-bg:hover ~ .cable-label-text,
    .cable-label-text:hover {
      fill: #c94e0a !important;
    }

    /* Cable Wizard floating button */
    .wizard-fab {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 55;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid #fed7aa;
      background: linear-gradient(135deg, #fff7ed 0%, #ffffff 65%);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.18);
      color: #c2410c;
      padding: 0.55rem 0.75rem;
      transition: box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }

    .wizard-fab:hover {
      box-shadow: 0 18px 34px rgba(15, 23, 42, 0.24);
      border-color: #fb923c;
      transform: translateY(-1px);
    }

    .wizard-fab-label {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1rem;
      margin-left: 0;
      transition: max-width 0.22s ease, opacity 0.22s ease, margin-left 0.22s ease;
    }

    .wizard-fab:hover .wizard-fab-label,
    .wizard-fab:focus-visible .wizard-fab-label {
      max-width: 16rem;
      opacity: 1;
      margin-left: 0.45rem;
    }

    @media (min-width: 768px) {
      .wizard-fab {
        right: 1.5rem;
        bottom: 1.5rem;
      }
    }

    @media (max-width: 767px) {
      .wizard-fab-label {
        max-width: 16rem;
        opacity: 1;
        margin-left: 0.45rem;
      }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen antialiased transition-colors" x-data="machineViz()" x-init="init()" x-cloak :class="{'ekanban-mode': ekanbanMode}">

  <!-- eKanban UI Skin -->
  {% include '_ekanban_skin.html' %}

  <!-- Header -->
  <div x-show="!ekanbanMode">
    {% include '_header.html' %}
  </div>

  <main class="max-w-full mx-auto px-4 py-6">

    <!-- Upload section (shown when no data) -->
    <template x-if="!graphData">
      <section class="max-w-3xl mx-auto space-y-4">

        <!-- Token input -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <div class="bg-gray-50 border-b border-gray-200 px-6 py-4">
            <h2 class="text-lg font-semibold text-gray-700">Maschine per Token laden</h2>
          </div>
          <div class="p-6">
            <p class="text-sm text-gray-500 mb-4">Token aus EPLAN oder einer früheren Sitzung eingeben.</p>
            <form @submit.prevent="if (tokenInput.trim()) { loadFromToken(tokenInput.trim()); }" class="flex gap-3">
              <input
                type="text"
                x-model="tokenInput"
                placeholder="z. B. 3f8a1b2c…"
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-lapp-600"
                spellcheck="false"
                autocomplete="off"
              >
              <button
                type="submit"
                :disabled="!tokenInput.trim() || loading"
                class="bg-lapp-600 hover:bg-lapp-700 disabled:opacity-50 text-white font-medium py-2 px-5 rounded-lg transition-colors text-sm"
              >Laden</button>
            </form>
          </div>
        </div>

        <!-- Example machine -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <div class="p-6 flex items-center justify-between">
            <div>
              <h3 class="text-sm font-semibold text-gray-700">Beispiel-Maschine</h3>
              <p class="text-xs text-gray-400 mt-0.5">Vorkonfigurierte Demo-Maschine laden</p>
            </div>
            <button
              @click="loadFromToken('example')"
              :disabled="loading"
              class="bg-gray-700 hover:bg-gray-800 disabled:opacity-50 text-white font-medium py-2 px-5 rounded-lg transition-colors text-sm"
            >Demo laden</button>
          </div>
        </div>

        <!-- Loading -->
        <div x-show="loading" class="text-center">
          <div class="inline-flex items-center gap-3 bg-blue-50 text-blue-700 px-6 py-3 rounded-lg">
            <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            <span class="font-medium" x-text="loadingMessage"></span>
          </div>
        </div>


      </section>
    </template>

    <!-- Main visualization (shown when data loaded) -->
    <template x-if="graphData">
      <div class="flex flex-col md:flex-row gap-4" style="height: calc(100vh - 170px);">

        <!-- Mobile: left sidebar toggle button -->
        <button @click="mobileSidebarOpen = !mobileSidebarOpen"
          class="md:hidden flex items-center gap-2 bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm font-medium text-gray-700 self-start shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          Info &amp; Filter
        </button>

        <!-- Left sidebar: Info + Legend + Subsystems -->
        <aside
          class="md:w-72 md:flex-shrink-0 md:overflow-y-auto md:flex md:flex-col"
          :class="mobileSidebarOpen ? 'fixed inset-0 z-[60] flex flex-col bg-gray-50' : 'hidden md:flex md:flex-col'"
        >
          <!-- Mobile sticky header with close button -->
          <div class="md:hidden sticky top-0 flex items-center justify-between px-4 py-3 bg-white border-b border-gray-200 flex-shrink-0 z-10">
            <span class="font-semibold text-sm text-gray-700">Info &amp; Filter</span>
            <button @click="mobileSidebarOpen = false" class="text-gray-400 hover:text-gray-700">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <!-- Scrollable content -->
          <div class="flex-1 overflow-y-auto p-4 space-y-4">
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4" x-show="graphData.data_source">
            <h3 class="font-semibold text-gray-700 mb-2 text-sm uppercase tracking-wide">Quelle</h3>
            <div class="space-y-2 text-sm" x-show="graphData.data_source">
              <div class="meta-row">
                <span class="meta-label">Snapshot</span>
                <span class="meta-value" x-text="graphData.data_source?.label"></span>
              </div>
              <div class="meta-row">
                <span class="meta-label">Import</span>
                <span class="meta-value meta-value--nowrap" x-text="formatImportedAt(graphData.data_source?.imported_at)"></span>
              </div>
              <div class="meta-row">
                <span class="meta-label">Quelle</span>
                <span class="meta-value" :title="graphData.data_source?.source_dir" x-text="graphData.data_source?.source_dir"></span>
              </div>
            </div>
          </div>

          <!-- Technical data card -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <h3 class="font-semibold text-gray-700 mb-2 text-sm uppercase tracking-wide">Projektdaten</h3>
            <div class="space-y-2 text-sm">
              <template x-if="graphData.technical_data.project_name">
                <div class="meta-row">
                  <span class="meta-label">Projekt</span>
                  <span class="meta-value" x-text="graphData.technical_data.project_name"></span>
                </div>
              </template>
              <template x-if="graphData.technical_data.export_date">
                <div class="meta-row">
                  <span class="meta-label">Export</span>
                  <span class="meta-value meta-value--nowrap" x-text="graphData.technical_data.export_date"></span>
                </div>
              </template>

            </div>
          </div>

                    <!-- Machine operation params -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <h3 class="font-semibold text-gray-700 mb-3 text-sm uppercase tracking-wide">Maschinenbetrieb</h3>
            <p class="text-xs text-gray-400 mb-3">Wird als Vorbelegung im Optimierer verwendet.</p>
            <div class="space-y-3">
              <div>
                <label class="text-xs font-medium text-gray-500 mb-1 block">Nutzungsdauer (Jahre)</label>
                <input type="number" x-model.number="machineYears" min="1" step="1"
                  class="w-full border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-lapp-600">
              </div>
              <div>
                <label class="text-xs font-medium text-gray-500 mb-1 block">Stunden / Tag</label>
                <input type="number" x-model.number="machineHoursPerDay" min="0" max="24" step="0.5"
                  class="w-full border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-lapp-600">
              </div>
              <div>
                <label class="text-xs font-medium text-gray-500 mb-1 block">Tage / Jahr</label>
                <input type="number" x-model.number="machineDaysPerYear" min="0" max="365" step="1"
                  class="w-full border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-lapp-600">
              </div>
            </div>
          </div>


          <!-- Stats -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <h3 class="font-semibold text-gray-700 mb-2 text-sm uppercase tracking-wide">Übersicht</h3>
            <div class="grid grid-cols-2 gap-2 text-sm">
              <div class="bg-blue-50 rounded-lg p-2 text-center">
                <div class="text-xl font-bold text-blue-700" x-text="graphData.components.length"></div>
                <div class="text-xs text-blue-600">Komponenten</div>
              </div>
              <div class="bg-green-50 rounded-lg p-2 text-center">
                <div class="text-xl font-bold text-green-700" x-text="graphData.connections.filter(c => c.connection_type !== 'fg_chain').length"></div>
                <div class="text-xs text-green-600">Kabel</div>
              </div>
              <div class="bg-purple-50 rounded-lg p-2 text-center">
                <div class="text-xl font-bold text-purple-700" x-text="graphData.subsystems.length"></div>
                <div class="text-xs text-purple-600">Subsysteme</div>
              </div>
              <div class="bg-indigo-50 rounded-lg p-2 text-center">
                <div class="text-xl font-bold text-indigo-700" x-text="graphData.connections.filter(c => c.connection_type === 'fg_chain').length"></div>
                <div class="text-xs text-indigo-600">FG-Ketten</div>
              </div>
            </div>
          </div>


          <!-- Legend -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <h3 class="font-semibold text-gray-700 mb-2 text-sm uppercase tracking-wide">Legende</h3>
            <div class="space-y-1 text-xs">
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#dbeafe;border-color:#3b82f6"></span> Motor / Aktor</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#dcfce7;border-color:#22c55e"></span> Sensor</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#fef3c7;border-color:#f59e0b"></span> Schutzgerät</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#ede9fe;border-color:#8b5cf6"></span> Steuerung</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#fce7f3;border-color:#ec4899"></span> Schalter / Schütz</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#e0e7ff;border-color:#6366f1"></span> Netzteil / Trafo</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#fee2e2;border-color:#ef4444"></span> Heizung</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#f0fdf4;border-color:#16a34a"></span> Baugruppe</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#f1f5f9;border-color:#94a3b8"></span> Kabel</div>
              <div class="flex items-center gap-2 mt-2 pt-2 border-t border-gray-100">
                <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#64748b" stroke-width="2.5"/></svg>
                <span>Kabelverbindung</span>
              </div>
              <div class="flex items-center gap-2">
                <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="5 3"/></svg>
                <span>Funktionsgruppe</span>
              </div>
            </div>
          </div>

          <!-- Upload new -->
          </div><!-- end scrollable content -->
        </aside>

        <!-- Center: Graph visualization -->
        <div class="flex-1 flex flex-col gap-4 min-w-0" style="min-height: 350px;">
          <!-- Toolbar -->
          <div class="flex items-center flex-wrap gap-2">
            <button @click="zoomIn()" class="bg-white border border-gray-300 rounded-lg px-3 py-1.5 text-sm hover:bg-gray-50">
              <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            </button>
            <button @click="zoomOut()" class="bg-white border border-gray-300 rounded-lg px-3 py-1.5 text-sm hover:bg-gray-50">
              <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"/></svg>
            </button>
            <div class="ml-auto flex items-center gap-2">
              <button @click="reloadOriginalGraph()" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 rounded-lg px-3 py-1 text-sm flex items-center gap-1 transition-colors" title="Daten auf Ursprungszustand zurücksetzen" aria-label="Zurücksetzen">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
                <span>Zurücksetzen</span>
              </button>
              <label class="text-sm text-gray-600">Ansicht:</label>
              <select x-model="viewMode" @change="selectedComponent = null; selectedFgGroup = null; selectedCable = null; renderGraph()" class="border border-gray-300 rounded-lg px-2 py-1 text-sm">
                <option value="subsystem">Funktionsgruppen</option>
                <option value="all">Alle Geräte</option>
              </select>
            </div>
          </div>

          <!-- SVG Graph -->
          <div class="graph-container flex-1" id="graphContainer" style="min-height: 300px"
               @wheel.prevent="handleWheel($event)"
               @mousedown="startPan($event)"
               @mousemove="doPan($event)"
               @mouseup="endPan()"
               @mouseleave="endPan()"
               @touchstart.prevent="handleTouchStart($event)"
               @touchmove.prevent="handleTouchMove($event)"
               @touchend.prevent="handleTouchEnd($event)">
            <svg class="graph-svg" width="100%" height="100%" id="graphSvg">
              <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                  <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
                </marker>
                <marker id="arrowhead-fg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                  <polygon points="0 0, 8 3, 0 6" fill="#a5b4fc"/>
                </marker>
              </defs>
              <g id="graphGroup" :transform="`translate(${panX},${panY}) scale(${zoom})`">
              </g>
            </svg>
          </div>

          <!-- Warnings -->
          <template x-if="graphData.warnings && graphData.warnings.length > 0">
            <div class="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2">
              <template x-for="w in graphData.warnings">
                <p class="text-sm text-amber-700" x-text="w"></p>
              </template>
            </div>
          </template>

          <!-- Error display (for render errors) -->
          <div x-show="error" class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm" x-text="error"></div>
        </div>

        <!-- Right sidebar: Component detail or FG Group detail -->
        <aside x-show="wizardOpen || selectedComponent || selectedFgGroup || selectedCable"
          class="md:w-1/3 md:flex-shrink-0 md:min-w-72 md:overflow-y-auto">

          <!-- Cable Wizard panel -->
          <template x-if="wizardOpen">
            <div>
              <div class="detail-panel-overlay md:hidden" @click="closeCableWizard()"></div>
              <div class="bg-white rounded-xl shadow-sm border border-gray-200 detail-panel">
                <div class="detail-panel-header px-4 py-3 flex items-start justify-between gap-3">
                  <div>
                    <div class="detail-label mb-1">Cable Wizard</div>
                    <h3 class="font-semibold text-slate-800 leading-tight">Schritt-für-Schritt Optimierung</h3>
                  </div>
                  <button @click="closeCableWizard()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                  </button>
                </div>

                <div class="detail-panel-body text-sm">
                  <div class="detail-block">
                    <div class="flex items-center justify-between gap-2 text-xs text-slate-600">
                      <span class="font-medium" x-text="'Schritt ' + wizardDisplayStep() + ' / ' + wizardDisplayTotalSteps()"></span>
                      <span x-text="wizardStepLabel()"></span>
                    </div>
                    <div class="mt-2 h-2 bg-slate-100 rounded-full overflow-hidden">
                      <div class="h-2 bg-lapp-600 transition-all duration-300" :style="`width: ${wizardProgressPercent()}%`"></div>
                    </div>
                    <div class="detail-muted mt-2" x-text="wizardCables.length + ' Kabel im Wizard'"></div>
                  </div>

                  <template x-if="wizardIsCableStep() && wizardCurrentCable">
                    <div class="space-y-3">
                      <div class="detail-block">
                        <div class="detail-label">Aktuelles Kabel</div>
                        <div class="detail-value font-semibold" x-text="wizardCurrentCable.cable_name || 'Unbenanntes Kabel'"></div>
                        <div class="mt-2 flex flex-wrap items-center gap-2 text-xs">
                          <span class="info-chip" x-text="wizardCurrentCable.cable_type || 'Kabel'"></span>
                          <span class="font-mono text-slate-600" x-text="wizardCurrentCable.sap_number || 'keine SAP'"></span>
                          <span class="info-chip info-chip--green" x-text="wizardCurrentCable.cross_section_mm2 != null ? wizardCurrentCable.cross_section_mm2 + ' mm² verbaut' : 'Querschnitt unbekannt'"></span>
                        </div>
                        <div class="detail-muted mt-2" x-text="wizardCurrentCable.cable_spec || 'Keine Spezifikation verfügbar'"></div>
                        <template x-if="wizardCurrentCableShopIsChecking()">
                          <div class="mt-2 text-xs text-slate-700 bg-slate-50 border border-slate-200 rounded-md px-2 py-1.5">
                            Prüfe, ob dieses Kabel im LAPP Shop verfügbar ist …
                          </div>
                        </template>
                        <template x-if="wizardCurrentCableCanOptimize()">
                          <div class="mt-2 text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-md px-2 py-1.5">
                            Im LAPP Shop gefunden. Optimierung möglich.
                          </div>
                        </template>
                        <template x-if="wizardCurrentCableOnlySkippable()">
                          <div class="mt-2 text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-md px-2 py-1.5" x-text="wizardCurrentCableShopSkipMessage()"></div>
                        </template>
                        <template x-if="wizardCurrentCableShouldSkip()">
                          <div class="mt-2 text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-md px-2 py-1.5" x-text="wizardCurrentSkipReason()"></div>
                        </template>
                        <div x-show="wizardIsCurrentCableSkipped()" class="mt-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-md px-2 py-1.5">
                          Dieses Kabel ist als „Übersprungen“ markiert und wird nicht optimiert.
                        </div>
                      </div>

                      <div class="detail-block" x-show="wizardCurrentCableCanOptimize()">
                        <div class="detail-label">Pflichtangaben</div>
                        <div class="grid grid-cols-2 gap-2 mt-2">
                          <div>
                            <label class="detail-label">Betriebsstrom (A) *</label>
                            <input
                              type="number"
                              min="0.1"
                              step="0.1"
                              x-model.number="wizardInputsByCable[wizardCurrentCableKey].current_a"
                              class="w-full border border-lapp-600 rounded-md px-2 py-1.5 text-sm bg-orange-50 focus:outline-none focus:ring-1 focus:ring-lapp-600"
                              placeholder="z.B. 16"
                            >
                          </div>
                          <div>
                            <label class="detail-label">Spannung (V) *</label>
                            <input
                              type="number"
                              min="1"
                              step="1"
                              x-model.number="wizardInputsByCable[wizardCurrentCableKey].system_voltage_v"
                              class="w-full border border-lapp-600 rounded-md px-2 py-1.5 text-sm bg-orange-50 focus:outline-none focus:ring-1 focus:ring-lapp-600"
                              placeholder="z.B. 400"
                            >
                          </div>
                          <div>
                            <label class="detail-label">Länge (m) *</label>
                            <input
                              type="number"
                              min="0.001"
                              step="0.001"
                              x-model.number="wizardInputsByCable[wizardCurrentCableKey].length_m"
                              class="w-full border border-blue-300 rounded-md px-2 py-1.5 text-sm bg-blue-50 focus:outline-none focus:ring-1 focus:ring-lapp-600"
                            >
                          </div>
                          <div>
                            <label class="detail-label">Belastete Adern *</label>
                            <input
                              type="number"
                              min="1"
                              step="1"
                              x-model.number="wizardInputsByCable[wizardCurrentCableKey].loaded_cores"
                              class="w-full border border-blue-300 rounded-md px-2 py-1.5 text-sm bg-blue-50 focus:outline-none focus:ring-1 focus:ring-lapp-600"
                            >
                          </div>
                        </div>
                        <div class="mt-3">
                          <label class="detail-label">Phasen (optional)</label>
                          <div class="flex mt-1 rounded-md overflow-hidden border border-gray-200 text-xs font-medium">
                            <button
                              type="button"
                              @click="wizardInputsByCable[wizardCurrentCableKey].ac_3phase = false"
                              :class="!wizardInputsByCable[wizardCurrentCableKey].ac_3phase ? 'bg-lapp-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'"
                              class="flex-1 py-1.5 transition-colors"
                            >1~</button>
                            <button
                              type="button"
                              @click="wizardInputsByCable[wizardCurrentCableKey].ac_3phase = true"
                              :class="wizardInputsByCable[wizardCurrentCableKey].ac_3phase ? 'bg-lapp-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'"
                              class="flex-1 py-1.5 border-l border-gray-200 transition-colors"
                            >3~</button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </template>

                  <template x-if="wizardIsObjectiveStep()">
                    <div class="space-y-3">
                      <div class="detail-block">
                        <div class="detail-label">Optimierungsziel</div>
                        <p class="detail-muted mb-3">Nach Erfassung aller Kabel wird das beste Ergebnis je Kabel für das gewählte Ziel ausgewählt.</p>
                        <div class="grid grid-cols-1 gap-2">
                          <button
                            @click="wizardObjective = 'tco'"
                            class="w-full text-left rounded-lg border px-3 py-2 transition-colors"
                            :class="wizardObjective === 'tco' ? 'border-emerald-400 bg-emerald-50 text-emerald-800' : 'border-gray-200 bg-white hover:border-emerald-300'"
                          >
                            <div class="font-semibold text-sm">TCO optimieren</div>
                            <div class="text-xs mt-0.5">Minimiert die Gesamtkosten über die Laufzeit.</div>
                          </button>
                          <button
                            @click="wizardObjective = 'co2'"
                            class="w-full text-left rounded-lg border px-3 py-2 transition-colors"
                            :class="wizardObjective === 'co2' ? 'border-blue-400 bg-blue-50 text-blue-800' : 'border-gray-200 bg-white hover:border-blue-300'"
                          >
                            <div class="font-semibold text-sm">CO₂ optimieren</div>
                            <div class="text-xs mt-0.5">Minimiert die gesamten CO₂-Emissionen.</div>
                          </button>
                        </div>
                      </div>
                    </div>
                  </template>

                  <template x-if="wizardIsResultStep()">
                    <div class="space-y-3">
                      <div x-show="wizardRunning" class="detail-block">
                        <div class="flex items-center gap-2 text-blue-700">
                          <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                          <span class="font-medium">Wizard optimiert Kabel …</span>
                        </div>
                        <div class="detail-muted mt-2" x-text="wizardProgress.done + ' / ' + wizardProgress.total + ' verarbeitet'"></div>
                        <div class="mt-2 h-2 bg-slate-100 rounded-full overflow-hidden">
                          <div class="h-2 bg-lapp-600 transition-all duration-200" :style="`width: ${wizardProgress.total > 0 ? Math.round((wizardProgress.done / wizardProgress.total) * 100) : 0}%`"></div>
                        </div>
                      </div>

                      <div x-show="wizardError" class="text-xs text-red-700 bg-red-50 border border-red-200 rounded-md px-2 py-1.5" x-text="wizardError"></div>

                      <template x-if="!wizardRunning && wizardReport.length > 0">
                        <div class="space-y-4">
                          
                          <!-- Focus on Savings (Money & CO2) -->
                          <div class="grid grid-cols-2 gap-3">
                            <div class="rounded-xl border border-emerald-200 bg-gradient-to-br from-emerald-50 to-white p-4 shadow-sm relative overflow-hidden">
                              <div class="absolute -right-2 -top-4 opacity-10">
                                <svg class="w-20 h-20 text-emerald-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h2.26c.09 1.12 1.05 1.59 1.98 1.59 1.15 0 1.94-.65 1.94-1.52 0-1.12-1.07-1.39-2.58-1.84-1.73-.52-3.16-1.45-3.16-3.4 0-1.63 1.18-2.68 2.83-3.12V4h2.67v1.94c1.4.27 2.72 1.14 2.91 3.03h-2.29c-.1-1.05-.88-1.59-1.88-1.59-1.25 0-1.75.75-1.75 1.48 0 1.07 1.05 1.34 2.65 1.84 1.83.56 3.08 1.52 3.08 3.39 0 1.76-1.23 2.76-2.72 3.1z"/></svg>
                              </div>
                              <div class="text-[10px] font-bold uppercase tracking-wider text-emerald-800 mb-1">Ersparnis (TCO)</div>
                              <div class="text-2xl font-black text-emerald-700" x-text="(wizardSummary.delta_tco_total > 0 ? '+' : '') + optFmt(Math.abs(wizardSummary.delta_tco_total)) + ' €'"></div>
                              <div class="text-[10px] text-emerald-600 mt-1 uppercase font-medium">Gesamtlaufzeit</div>
                            </div>
                            
                            <div class="rounded-xl border border-blue-200 bg-gradient-to-br from-blue-50 to-white p-4 shadow-sm relative overflow-hidden">
                              <div class="absolute -right-2 -top-2 opacity-10">
                                <svg class="w-16 h-16 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
                              </div>
                              <div class="text-[10px] font-bold uppercase tracking-wider text-blue-800 mb-1">CO₂-Reduktion</div>
                              <div class="text-2xl font-black text-blue-700" x-text="(wizardSummary.delta_co2_total > 0 ? '+' : '') + optFmt(Math.abs(wizardSummary.delta_co2_total)) + ' kg'"></div>
                              <div class="text-[10px] text-blue-600 mt-1 uppercase font-medium">Eingespartes CO₂</div>
                            </div>
                          </div>

                          <!-- Compact Stats -->
                          <div class="flex flex-wrap items-center justify-between gap-2 px-1">
                            <div class="flex gap-2">
                              <span class="inline-flex items-center gap-1 text-[11px] font-medium text-slate-700 bg-slate-100 px-2 py-1 rounded-md border border-slate-200"><span x-text="wizardSummary.total"></span> <span class="text-slate-500 font-normal">Gesamt</span></span>
                              <span class="inline-flex items-center gap-1 text-[11px] font-medium text-emerald-700 bg-emerald-50 px-2 py-1 rounded-md border border-emerald-200"><span x-text="wizardSummary.changed"></span> <span class="text-emerald-600 font-normal">Optimiert</span></span>
                              <span class="inline-flex items-center gap-1 text-[11px] font-medium text-amber-700 bg-amber-50 px-2 py-1 rounded-md border border-amber-200"><span x-text="wizardSummary.skipped"></span> <span class="text-amber-600 font-normal">Überspr.</span></span>
                            </div>
                          </div>

                          <!-- Scrollable Table -->
                          <div class="border border-gray-200 rounded-lg overflow-hidden flex flex-col shadow-sm">
                            <div class="overflow-y-auto overflow-x-auto max-h-[35vh]">
                              <table class="w-full text-[11px] min-w-[700px] border-collapse">
                                <thead class="bg-gray-50 text-gray-500 uppercase sticky top-0 z-10 shadow-sm border-b border-gray-200">
                                  <tr>
                                    <th class="px-2 py-2 text-left">Kabel</th>
                                    <th class="px-2 py-2 text-left">SAP</th>
                                    <th class="px-2 py-2 text-right">Ist mm²</th>
                                    <th class="px-2 py-2 text-right">Neu mm²</th>
                                    <th class="px-2 py-2 text-left">Status</th>
                                    <th class="px-2 py-2 text-right">ΔTCO €</th>
                                    <th class="px-2 py-2 text-right">ΔCO₂ kg</th>
                                    <th class="px-2 py-2 text-left">Hinweis</th>
                                    <th class="px-2 py-2 text-center">Aktion</th>
                                  </tr>
                                </thead>
                              <tbody>
                                <template x-for="row in wizardReport" :key="row.report_key">
                                  <tr class="border-t border-gray-100">
                                    <td class="px-2 py-1 font-medium text-slate-800" x-text="row.cable_name"></td>
                                    <td class="px-2 py-1 font-mono text-slate-500" x-text="row.sap_number || '-'"></td>
                                    <td class="px-2 py-1 text-right" x-text="row.original_mm2 != null ? row.original_mm2 : '-'"></td>
                                    <td class="px-2 py-1 text-right" x-text="row.recommended_mm2 != null ? row.recommended_mm2 : '-'"></td>
                                    <td class="px-2 py-1">
                                      <span class="inline-flex items-center rounded-full px-2 py-0.5 text-[10px] font-semibold" :class="wizardStatusClass(row.status)" x-text="wizardStatusLabel(row.status)"></span>
                                    </td>
                                    <td class="px-2 py-1 text-right" x-text="row.delta_tco != null ? (row.delta_tco > 0 ? '+' : '') + optFmt(row.delta_tco) : '-'"></td>
                                    <td class="px-2 py-1 text-right" x-text="row.delta_co2 != null ? (row.delta_co2 > 0 ? '+' : '') + optFmt(row.delta_co2) : '-'"></td>
                                    <td class="px-2 py-1 text-slate-500" x-text="row.reason || '-'"></td>
                                    <td class="px-2 py-1 text-center">
                                      <template x-if="row.status === 'changed'">
                                        <button @click="markAsReplaced(row.cable_name, row.original_mm2, row.recommended_mm2, row.recommended_article_nr)"
                                          class="text-[10px] font-semibold text-white bg-blue-600 rounded px-2 py-1 hover:bg-blue-700 transition-colors"
                                          :class="{'opacity-50 cursor-not-allowed': replacedCables[row.cable_name]}"
                                          :disabled="!!replacedCables[row.cable_name]">
                                          <template x-if="replacedCables[row.cable_name]">
                                            <svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                                          </template>
                                          <template x-if="!replacedCables[row.cable_name]">
                                            <span>Replace</span>
                                          </template>
                                        </button>
                                      </template>
                                    </td>
                                  </tr>
                                </template>
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>

                  <div class="flex flex-wrap items-center gap-2 pt-1">
                    <button
                      x-show="!wizardRunning"
                      @click="closeCableWizard()"
                      class="text-xs font-medium text-gray-600 border border-gray-300 rounded-md px-3 py-1.5 hover:bg-gray-50 transition-colors"
                    >Abbrechen</button>

                    <button
                      x-show="wizardStepIndex > 0 && !wizardRunning && !wizardIsResultStep()"
                      @click="wizardPrevStep()"
                      class="text-xs font-medium text-gray-600 border border-gray-300 rounded-md px-3 py-1.5 hover:bg-gray-50 transition-colors"
                    >Zurück</button>

                    <button
                      x-show="wizardIsCableStep() && !wizardRunning"
                      @click="wizardSkipCurrentCableAndNext()"
                      class="ml-auto text-xs font-semibold text-amber-700 border border-amber-300 bg-amber-50 rounded-md px-3 py-1.5 hover:bg-amber-100 transition-colors"
                    >Überspringen</button>

                    <button
                      x-show="wizardIsCableStep() && !wizardRunning && wizardCurrentCableCanOptimize()"
                      @click="wizardNextStep()"
                      :disabled="!wizardCurrentStepValid()"
                      :class="{'opacity-50 cursor-not-allowed': !wizardCurrentStepValid()}"
                      class="text-xs font-semibold text-white bg-lapp-600 hover:bg-lapp-700 rounded-md px-3 py-1.5 transition-colors"
                    >Weiter</button>

                    <button
                      x-show="wizardIsObjectiveStep() && !wizardRunning"
                      @click="runCableWizardOptimization()"
                      class="ml-auto text-xs font-semibold text-white bg-lapp-600 hover:bg-lapp-700 rounded-md px-3 py-1.5 transition-colors"
                    >Optimierung starten</button>

                    <button
                      x-show="wizardIsResultStep() && !wizardRunning"
                      @click="restartCableWizard()"
                      class="text-xs font-semibold text-lapp-600 border border-lapp-600 rounded-md px-3 py-1.5 hover:bg-lapp-50 transition-colors"
                    >Neu starten</button>

                    <button
                      x-show="wizardIsResultStep() && !wizardRunning"
                      @click="exportWizardCSV()"
                      tooltip="Exportiert die Ergebnistabelle als CSV-Datei."
                      class="ml-auto text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-300 rounded-md px-3 py-1.5 hover:bg-emerald-100 transition-colors flex items-center gap-1.5"
                    >
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                      CSV
                    </button>

                    <button
                      x-show="wizardIsResultStep() && !wizardRunning"
                      @click="applyWizardResults()"
                      tooltip="Übernimmt die neuen Querschnitte in die Maschinen-Ansicht."
                      class="text-xs font-semibold text-white bg-lapp-600 hover:bg-lapp-700 rounded-md px-3 py-1.5 transition-colors"
                    >In Ansicht übernehmen</button>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <!-- Cable detail panel -->
          <template x-if="!wizardOpen && selectedCable && !selectedComponent && !selectedFgGroup">
            <div>
              <div class="detail-panel-overlay md:hidden" @click="selectedCable = null; selectedCableShop = null; selectedCableShopError = ''; selectedCableShopLoading = false"></div>
              <div class="bg-white rounded-xl shadow-sm border border-gray-200 detail-panel">
              <div class="detail-panel-header px-4 py-3 flex items-start justify-between gap-3">
                <div>
                  <div class="detail-label mb-1">Kabel</div>
                  <h3 class="font-semibold text-slate-800 leading-tight" x-text="selectedCable.cable_name"></h3>
                </div>
                <button @click="selectedCable = null; selectedCableShop = null; selectedCableShopError = ''; selectedCableShopLoading = false" class="text-gray-400 hover:text-gray-600">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
              <div class="detail-panel-body text-sm">
                <div class="space-y-4">
                  <div>
                    <div class="detail-label">Identität</div>
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="info-chip" x-text="selectedCable.cable_type || 'Kabel'"></span>
                      <span class="font-mono text-sm text-slate-700" x-text="selectedCable.sap_number || '-'"></span>
                    </div>
                    <div class="detail-muted mt-2" x-text="selectedCable.cable_spec || '-'"></div>
                  </div>

                  <div class="grid grid-cols-3 gap-2 text-xs pt-4 border-t border-gray-100">
                    <div>
                      <div class="detail-label mb-1">Adern</div>
                      <div class="detail-value font-medium" x-text="selectedCable.num_cores || '-'"></div>
                      <div x-show="selectedCable.used_wires != null && selectedCable.used_wires != selectedCable.num_cores" class="detail-muted text-[10px]" x-text="selectedCable.used_wires + ' belastet'"></div>
                    </div>
                    <div>
                      <div class="detail-label mb-1">Querschnitt</div>
                      <div class="detail-value font-medium" x-text="selectedCable.cross_section_mm2 ? selectedCable.cross_section_mm2 + ' mm²' : '-'"></div>
                    </div>
                    <div>
                      <div class="detail-label mb-1">Länge</div>
                      <div class="detail-value font-medium" x-text="selectedCable.length_m ? selectedCable.length_m + ' m' : '-'"></div>
                    </div>
                  </div>

                  <div class="pt-4 border-t border-gray-100">
                    <div class="detail-label">Verbindung</div>
                    <div class="detail-value font-mono" x-text="'+' + (selectedCable.from_location || '-') + ' → +' + (selectedCable.to_location || '-')"></div>
                  </div>

                  <div class="pt-4 border-t border-gray-100">
                    <div class="detail-label mb-2">Shop</div>
                    <div class="flex items-start justify-between gap-3">
                      <div class="min-w-0">
                        <div class="detail-value font-medium" x-text="selectedCableShop?.name || 'Shop-Variante wird geladen'"></div>
                        <div class="detail-muted mt-1" x-text="selectedCableShop?.article_number || selectedCable.sap_number || '-'"></div>
                      </div>
                      <a x-show="selectedCableShop?.url" :href="selectedCableShop?.url" target="_blank" rel="noreferrer" class="info-chip flex-shrink-0">Shop öffnen</a>
                    </div>

                    <template x-if="selectedCableShopLoading">
                      <div class="mt-3 flex items-center gap-2 text-sm text-blue-700">
                        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        <span>Lade Shop-Variante…</span>
                      </div>
                    </template>

                    <template x-if="selectedCableShopError">
                      <div class="mt-3 detail-muted text-red-700 bg-red-50 border border-red-200 rounded-md px-2 py-1" x-text="selectedCableShopError"></div>
                    </template>

                    <template x-if="selectedCableShop && !selectedCableShopLoading">
                      <div class="mt-3">
                        <div class="flex gap-3 items-start">
                          <template x-if="selectedCableShop.image_url">
                            <img :src="selectedCableShop.image_url" alt="Shop Produktbild" class="w-20 h-20 object-contain rounded-lg bg-white border border-blue-100 shadow-sm p-2 flex-shrink-0">
                          </template>
                          <div class="min-w-0 flex-1">
                            <div class="mt-1 text-lg font-bold text-slate-900 leading-tight" x-text="selectedCableShop.price_formatted || (selectedCableShop.price_on_request ? 'Preis auf Anfrage' : 'Kein Preis verfügbar')"></div>
                            <div class="detail-muted mt-1" x-text="selectedCableShop.base_product_code ? 'Basisprodukt ' + selectedCableShop.base_product_code : '-'"></div>
                          </div>
                        </div>

                        <template x-if="selectedCableShop.description">
                          <div class="detail-muted mt-3" x-text="selectedCableShop.description"></div>
                        </template>
                      </div>
                    </template>
                  </div>

                  <!-- ============ Optimizer Panel ============ -->
                  <div class="pt-4 border-t border-gray-100">
                    <div class="flex items-center justify-between w-full">
                      <button @click="optShowPanel = !optShowPanel" class="flex items-center gap-2 group flex-1 min-w-0">
                        <div class="detail-label mb-0">Querschnitt optimieren</div>
                        <svg class="w-4 h-4 text-gray-400 transition-transform flex-shrink-0" :class="optShowPanel ? 'rotate-180' : ''" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                      </button>
                      <a href="/settings" target="_blank" rel="noreferrer" title="Einstellungen" class="ml-2 flex-shrink-0 text-gray-400 hover:text-lapp-600 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                      </a>
                    </div>

                    <div x-show="optShowPanel" x-collapse class="mt-3 space-y-3">

                      <!-- Parameter inputs -->
                      <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                          <label class="detail-label">Betriebsstrom (A) *</label>
                          <input type="number" x-model.number="optParams.current_a" min="0" step="0.1"
                            class="w-full border border-lapp-600 rounded-md px-2 py-1.5 text-sm bg-orange-50 focus:outline-none focus:ring-1 focus:ring-lapp-600"
                            placeholder="z.B. 16">
                        </div>
                        <div>
                          <label class="detail-label">Spannung (V) *</label>
                          <input type="number" x-model.number="optParams.system_voltage_v" min="0" step="1"
                            class="w-full border border-lapp-600 rounded-md px-2 py-1.5 text-sm bg-orange-50 focus:outline-none focus:ring-1 focus:ring-lapp-600"
                            placeholder="z.B. 400">
                        </div>
                        <div>
                          <label class="detail-label flex items-center justify-between">
                            <span>Länge (m)</span>
                            <span x-show="optEplanLength != null" class="text-[9px] font-semibold bg-blue-100 text-blue-700 rounded px-1 py-0.5" x-text="'EPLAN: ' + optEplanLength"></span>
                          </label>
                          <input type="number" x-model.number="optParams.length_m" min="0" step="0.001"
                            :class="optEplanLength != null ? 'border-blue-300 bg-blue-50' : 'border-gray-200'"
                            class="w-full rounded-md px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-lapp-600">
                        </div>
                        <div>
                          <label class="detail-label flex items-center justify-between">
                            <span>Belastete Adern</span>
                            <span x-show="optUsedWires != null" class="text-[9px] font-semibold bg-blue-100 text-blue-700 rounded px-1 py-0.5" x-text="'EPLAN: ' + optUsedWires"></span>
                          </label>
                          <input type="number" x-model.number="optParams.loaded_cores" min="1" max="20" step="1"
                            class="w-full border border-blue-300 rounded-md px-2 py-1.5 text-sm bg-blue-50 focus:outline-none focus:ring-1 focus:ring-lapp-600">
                        </div>
                        <div>
                          <label class="detail-label">Phasen</label>
                          <div class="flex mt-1 rounded-md overflow-hidden border border-gray-200 text-xs font-medium">
                            <button type="button" @click="optParams.ac_3phase = false"
                              :class="!optParams.ac_3phase ? 'bg-lapp-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'"
                              class="flex-1 py-1.5 transition-colors">1~</button>
                            <button type="button" @click="optParams.ac_3phase = true"
                              :class="optParams.ac_3phase ? 'bg-lapp-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'"
                              class="flex-1 py-1.5 border-l border-gray-200 transition-colors">3~</button>
                          </div>
                        </div>
                      </div>

                      <!-- Cable options status -->
                      <div class="flex items-center gap-2 text-xs text-gray-500">
                        <template x-if="optOptionsLoading">
                          <div class="flex items-center gap-1.5 text-blue-600">
                            <svg class="animate-spin h-3 w-3" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                            <span>Lade Kabelvarianten…</span>
                          </div>
                        </template>
                        <template x-if="!optOptionsLoading && optOptions.length > 0">
                          <span x-text="filteredOptOptions.length + ' von ' + optOptions.length + ' Varianten'"></span>
                        </template>
                      </div>

                      <!-- Calculate button -->
                      <button @click="calculateOpt()"
                        class="w-full bg-lapp-600 hover:bg-lapp-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition-colors shadow-sm"
                        :disabled="optLoading || optParams.current_a <= 0 || optParams.system_voltage_v <= 0 || filteredOptOptions.length === 0"
                        :class="{'opacity-50 cursor-not-allowed': optLoading || optParams.current_a <= 0 || optParams.system_voltage_v <= 0 || filteredOptOptions.length === 0}">
                        <span x-show="!optLoading">Berechnen</span>
                        <span x-show="optLoading" class="flex items-center justify-center gap-2">
                          <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                          Berechne…
                        </span>
                      </button>

                      <!-- Error -->
                      <div x-show="optError" class="text-xs text-red-700 bg-red-50 border border-red-200 rounded-md px-2 py-1.5" x-text="optError"></div>

                      <!-- Results -->
                      <template x-if="optResult">
                        <div class="space-y-3">
                          <!-- Optimum cards -->
                          <div class="grid grid-cols-2 gap-2">
                            <template x-if="optResult.optimum.tco">
                              <div class="rounded-lg border-l-3 border-emerald-500 bg-emerald-50 p-2">
                                <div class="text-[10px] font-semibold text-emerald-700 uppercase">TCO-Opt.</div>
                                <div class="text-sm font-bold text-emerald-900" x-text="optResult.optimum.tco.cross_section_mm2 + ' mm²'"></div>
                                <div class="text-xs text-emerald-700" x-text="optFmt(optResult.optimum.tco.tco_eur) + ' €'"></div>
                              </div>
                            </template>
                            <template x-if="optResult.optimum.co2">
                              <div class="rounded-lg border-l-3 border-blue-500 bg-blue-50 p-2">
                                <div class="text-[10px] font-semibold text-blue-700 uppercase">CO₂-Opt.</div>
                                <div class="text-sm font-bold text-blue-900" x-text="optResult.optimum.co2.cross_section_mm2 + ' mm²'"></div>
                                <div class="text-xs text-blue-700" x-text="optFmt(optResult.optimum.co2.co2_total_kg) + ' kg'"></div>
                              </div>
                            </template>
                          </div>

                          <!-- Payback -->
                          <template x-if="optResult.optimum.payback_tco_years !== null && optResult.optimum.payback_tco_years !== undefined">
                            <div class="flex items-center gap-2 text-xs">
                              <span class="info-chip info-chip--amber">
                                <span>Amortisation:</span>
                                <span class="font-bold" x-text="optFmt(optResult.optimum.payback_tco_years) + ' J.'"></span>
                              </span>
                            </div>
                          </template>

                          <!-- Current cable highlight -->
                          <template x-if="selectedCable?.cross_section_mm2">
                            <div class="text-xs text-gray-500">
                              Aktuell verbaut: <span class="font-semibold" x-text="selectedCable.cross_section_mm2 + ' mm²'"></span>
                            </div>
                          </template>

                          <!-- Compact result table -->
                          <div class="overflow-x-auto border border-gray-200 rounded-lg">
                            <table class="w-full text-[11px]">
                              <thead class="bg-gray-50 text-gray-500 uppercase">
                                <tr>
                                  <th class="px-1.5 py-1 text-left">mm²</th>
                                  <th class="px-1.5 py-1 text-right">TCO €</th>
                                  <th class="px-1.5 py-1 text-right">CO₂ kg</th>
                                  <th class="px-1.5 py-1 text-right">ΔU %</th>
                                </tr>
                              </thead>
                              <tbody>
                                <template x-for="row in optResult.rows" :key="row.cross_section_mm2">
                                  <tr class="border-t border-gray-100"
                                      :class="{
                                        'bg-emerald-50 font-semibold': optResult.optimum.tco && row.cross_section_mm2 === optResult.optimum.tco.cross_section_mm2,
                                        'bg-blue-50': optResult.optimum.co2 && row.cross_section_mm2 === optResult.optimum.co2.cross_section_mm2 && !(optResult.optimum.tco && row.cross_section_mm2 === optResult.optimum.tco.cross_section_mm2),
                                        'bg-red-50 text-red-400 line-through': !row.admissible,
                                        'ring-2 ring-lapp-600 ring-inset': selectedCable?.cross_section_mm2 && row.cross_section_mm2 === selectedCable.cross_section_mm2,
                                      }">
                                    <td class="px-1.5 py-1" x-text="row.cross_section_mm2"></td>
                                    <td class="px-1.5 py-1 text-right" x-text="optFmt(row.tco_eur)"></td>
                                    <td class="px-1.5 py-1 text-right" x-text="optFmt(row.co2_total_kg)"></td>
                                    <td class="px-1.5 py-1 text-right" x-text="row.voltage_drop_percent != null ? row.voltage_drop_percent.toFixed(1) : '-'"></td>
                                  </tr>
                                </template>
                              </tbody>
                            </table>
                          </div>

                          <!-- Legend -->
                          <div class="flex flex-wrap gap-2 text-[10px] text-gray-400">
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded bg-emerald-300 inline-block"></span>TCO-Opt.</span>
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded bg-blue-300 inline-block"></span>CO₂-Opt.</span>
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded bg-red-200 inline-block"></span>Unzulässig</span>
                            <span class="flex items-center gap-1"><span class="inline-block w-2 h-2 rounded ring-1 ring-lapp-600"></span>Aktuell</span>
                          </div>

                          <div class="grid grid-cols-2 gap-2 mt-2">
                            <!-- Open in full optimizer -->
                            <button @click="openInOptimizer()"
                              class="col-span-1 flex items-center justify-center gap-1.5 text-xs font-semibold text-lapp-600 border border-lapp-600 rounded-lg px-2 py-1.5 hover:bg-lapp-600 hover:text-white transition-colors">
                              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                              </svg>
                              Im Optimierer
                            </button>

                            <!-- Replace Button (Phase 2) -->
                            <template x-if="optResult.optimum.tco && optResult.optimum.tco.cross_section_mm2 !== selectedCable?.cross_section_mm2">
                              <button @click="markAsReplaced(selectedCable.cable_name, selectedCable.cross_section_mm2, optResult.optimum.tco.cross_section_mm2, (optOptions.find(o => Number(o.cross_section_mm2) === Number(optResult.optimum.tco.cross_section_mm2)) || {}).article_number)"
                                class="col-span-1 flex items-center justify-center gap-1.5 text-xs font-semibold text-white bg-blue-600 rounded-lg px-2 py-1.5 hover:bg-blue-700 transition-colors shadow-sm"
                                :class="{'opacity-50 cursor-not-allowed': replacedCables[selectedCable?.cable_name]}"
                                :disabled="!!replacedCables[selectedCable?.cable_name]">
                                <template x-if="replacedCables[selectedCable?.cable_name]">
                                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                                </template>
                                <template x-if="!replacedCables[selectedCable?.cable_name]">
                                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                                </template>
                                <span x-text="replacedCables[selectedCable?.cable_name] ? 'Ersetzt' : 'Replace'"></span>
                              </button>
                            </template>
                          </div>
                        </div>
                      </template>

                    </div>
                  </div>
                  <!-- ============ /Optimizer Panel ============ -->

                </div>
              </div>
            </div>
            </div>
          </template>

          <!-- FG Group detail panel -->
          <template x-if="!wizardOpen && selectedFgGroup && !selectedComponent">
            <div>
              <div class="detail-panel-overlay md:hidden" @click="selectedFgGroup = null"></div>
              <div class="bg-white rounded-xl shadow-sm border border-gray-200 detail-panel">
              <div class="detail-panel-header px-4 py-3 flex items-start justify-between gap-3">
                <div>
                  <div class="detail-label mb-1">Funktionsgruppe</div>
                  <h3 class="font-semibold text-slate-800">
                    <span x-text="'=' + selectedFgGroup.fg"></span>
                    <span class="text-gray-400 text-sm ml-1" x-text="'(' + selectedFgGroup.subsystem + ')'"></span>
                  </h3>
                </div>
                <button @click="selectedFgGroup = null" class="text-gray-400 hover:text-gray-600">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
              <div class="detail-panel-body text-sm">
                <div class="detail-block">
                  <div class="detail-label">Überblick</div>
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="info-chip" x-text="selectedFgGroup.components.length + ' Geräte'"></span>
                    <span class="detail-muted" x-text="selectedFgGroup.subsystem"></span>
                    <span x-show="fgCables(selectedFgGroup).length > 0" class="info-chip info-chip--green" x-text="fgCables(selectedFgGroup).length + ' Kabel'"></span>
                  </div>
                </div>

                <!-- Component list -->
                <div class="detail-block">
                  <div class="detail-label">Enthaltene Geräte</div>
                  <div class="max-h-72 overflow-y-auto space-y-1 pr-1">
                  <template x-for="comp in selectedFgGroup.components" :key="comp.id">
                    <div class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-xs cursor-pointer hover:border-lapp-600 hover:shadow-sm transition-all"
                         @click="selectedComponent = comp">
                      <div class="flex items-center justify-between">
                        <span class="font-mono font-bold text-gray-900" x-text="comp.designation"></span>
                        <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-medium"
                              :class="typeColorClass(comp.component_type)"
                              x-text="typeLabel(comp.component_type)"></span>
                      </div>
                      <div class="text-gray-700 mt-1" x-text="comp.description_de"></div>
                      <div class="text-gray-400 font-mono text-[10px] mt-1 truncate" x-text="comp.full_eplan_name"></div>
                    </div>
                  </template>
                  </div>
                </div>


              </div>
            </div>
            </div>
          </template>

          <!-- Single component detail panel -->
          <div x-show="!wizardOpen && selectedComponent">
            <div class="detail-panel-overlay md:hidden" @click="selectedComponent = null"></div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 detail-panel">
              <div class="detail-panel-header px-4 py-3 flex items-start justify-between gap-3">
                <div>
                  <div class="detail-label mb-1">Gerät</div>
                  <h3 class="font-semibold text-slate-800" x-text="selectedComponent?.designation"></h3>
                </div>
                <button @click="selectedComponent = null" class="text-gray-400 hover:text-gray-600">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            <div class="detail-panel-body text-sm" x-show="selectedComponent">
              <!-- Type badge -->
              <div class="detail-block">
                <div class="detail-label">Typ</div>
                <div class="flex flex-wrap items-center gap-2">
                  <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                        :class="typeColorClass(selectedComponent?.component_type)"
                        x-text="typeLabel(selectedComponent?.component_type)"></span>
                </div>
              </div>

              <div class="detail-grid">
                <div class="detail-grid-item">
                  <div class="detail-label">Beschreibung</div>
                  <div class="detail-value font-medium" x-text="selectedComponent?.description_de || '-'"></div>
                  <div class="detail-muted" x-text="selectedComponent?.description_en" x-show="selectedComponent.description_en"></div>
                </div>
                <div class="detail-grid-item grid grid-cols-2 gap-2 text-xs">
                  <div>
                    <div class="detail-label mb-1">Funktionsgruppe</div>
                    <div class="detail-value font-mono" x-text="selectedComponent?.function_group ? '=' + selectedComponent.function_group : '-'"></div>
                  </div>
                  <div>
                    <div class="detail-label mb-1">Einbauort</div>
                    <div class="detail-value font-medium" x-text="selectedComponent?.location ? (selectedComponent.location === '+SS1' ? 'Schaltschrank' : selectedComponent.location === '+MR1' ? 'Maschinenraum' : selectedComponent.location) : '-'"></div>
                  </div>
                  <div>
                    <div class="detail-label mb-1">Hersteller</div>
                    <div class="detail-value" x-text="selectedComponent.manufacturer || '-'"></div>
                  </div>
                  <div>
                    <div class="detail-label mb-1">Subsystem</div>
                    <div class="detail-value" x-text="selectedComponent.subsystem || '-'"></div>
                  </div>
                  <div>
                    <div class="detail-label mb-1">Bestellnr.</div>
                    <div class="detail-value font-mono" x-text="selectedComponent.order_number || '-'"></div>
                  </div>
                  <div>
                    <div class="detail-label mb-1">SAP</div>
                    <div class="detail-value font-mono" x-text="selectedComponent.sap_number || '-'"></div>
                  </div>
                </div>
                <template x-if="selectedComponent?.technical_specs">
                  <div class="detail-grid-item">
                    <div class="detail-label">Technische Daten</div>
                    <div class="detail-value font-mono" x-text="selectedComponent.technical_specs"></div>
                  </div>
                </template>
              </div>

              <!-- I/O assignments for controllers -->
              <div x-show="getComponentIO(selectedComponent).length > 0" class="detail-block">
                <div class="detail-label">I/O-Zuordnung</div>
                <div class="max-h-48 overflow-y-auto pr-1">
                  <template x-for="io in getComponentIO(selectedComponent)" :key="io.pin + io.function_de">
                    <div class="flex gap-2 text-xs py-1 border-b border-gray-100 last:border-b-0">
                      <span class="font-mono font-medium w-8" x-text="io.signal_type"></span>
                      <span class="font-mono w-6 text-gray-400" x-text="io.pin"></span>
                      <span class="text-gray-700" x-text="io.function_de"></span>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Back to group button -->
              <template x-if="selectedFgGroup">
                <button @click="selectedComponent = null"
                        class="w-full text-center text-xs text-gray-500 hover:text-lapp-600 mt-1 py-2 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 transition-colors">
                  ← Zurück zur Gruppe
                </button>
              </template>
            </div>
            </div>
          </div>
        </aside>
      </div>
    </template>

    <button
      x-show="graphData && !wizardOpen"
      x-cloak
      @click="startCableWizard()"
      class="wizard-fab"
      type="button"
      aria-label="Cable Wizard starten"
    >
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L6 12l7.5 7.5M19.5 4.5L12 12l7.5 7.5"/>
      </svg>
      <span class="wizard-fab-label">Cable Wizard starten</span>
    </button>
  </main>

  <script type="application/json" id="default-params">{{ default_params | tojson }}</script>
  <script type="application/json" id="default-options">{{ default_options | tojson }}</script>
  <script>
    const DEFAULT_PARAMS = JSON.parse(document.getElementById('default-params').textContent);
    const DEFAULT_OPTIONS = JSON.parse(document.getElementById('default-options').textContent);

    const optNumFmt = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // Graph element registry — rebuilt on every _drawGraph(); used for highlight + zoom-to-cable
    let _gReg = { edgesByCable: {}, nodeById: {}, allPathEls: [], allLabelBgs: [], allLabelTexts: [], allNodeGs: [] };

    function machineViz() {
      return {
        ekanbanMode: localStorage.getItem('ekanbanMode') === 'true' && window.innerWidth >= 768,
        toggleEkanban() {
          if (window.innerWidth < 768) return;
          this.ekanbanMode = !this.ekanbanMode;
          localStorage.setItem('ekanbanMode', this.ekanbanMode);
        },
        graphData: null,
        loading: false,
        loadingMessage: 'Snapshot wird geladen…',
        error: '',
        tokenInput: '',
        selectedComponent: null,
        selectedFgGroup: null,
        selectedCable: null,
        selectedCableShop: null,
        selectedCableShopLoading: false,
        selectedCableShopError: '',
        filterSubsystem: '',
        viewMode: 'subsystem',
        zoom: 1,
        panX: 0,
        panY: 0,
