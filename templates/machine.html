                    </div>
                    <div>
                      <div class="detail-label mb-1">Querschnitt</div>
                      <div class="detail-value font-medium" x-text="selectedCable.cross_section_mm2 ? selectedCable.cross_section_mm2 + ' mm²' : '–'"></div>
                    </div>
                    <div>
                      <div class="detail-label mb-1">Länge</div>
                      <div class="detail-value font-medium" x-text="selectedCable.length_m ? selectedCable.length_m + ' m' : '–'"></div>
                    </div>
                  </div>

                  <div class="pt-4 border-t border-gray-100">
                    <div class="detail-label">Verbindung</div>
                    <div class="detail-value font-mono" x-text="'+' + (selectedCable.from_location || '–') + ' → +' + (selectedCable.to_location || '–')"></div>
                  </div>

                  <div class="pt-4 border-t border-gray-100">
                    <div class="detail-label mb-2">Shop</div>
                    <div class="flex items-start justify-between gap-3">
                      <div class="min-w-0">
                        <div class="detail-value font-medium" x-text="selectedCableShop?.name || 'Shop-Variante wird geladen'"></div>
                        <div class="detail-muted mt-1" x-text="selectedCableShop?.article_number || selectedCable.sap_number || '–'"></div>
                      </div>
                      <a x-show="selectedCableShop?.url" :href="selectedCableShop?.url" target="_blank" rel="noreferrer" class="info-chip flex-shrink-0">Shop öffnen</a>
                    </div>

                    <template x-if="selectedCableShopLoading">
                      <div class="mt-3 flex items-center gap-2 text-sm text-blue-700">
                        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        <span>Lade Shop-Variante…</span>
                      </div>
                    </template>

                    <template x-if="selectedCableShopError">
                      <div class="mt-3 detail-muted text-red-700 bg-red-50 border border-red-200 rounded-md px-2 py-1" x-text="selectedCableShopError"></div>
                    </template>

                    <template x-if="selectedCableShop && !selectedCableShopLoading">
                      <div class="mt-3">
                        <div class="flex gap-3 items-start">
                          <template x-if="selectedCableShop.image_url">
                            <img :src="selectedCableShop.image_url" alt="Shop Produktbild" class="w-20 h-20 object-contain rounded-lg bg-white border border-blue-100 shadow-sm p-2 flex-shrink-0">
                          </template>
                          <div class="min-w-0 flex-1">
                            <div class="mt-1 text-lg font-bold text-slate-900 leading-tight" x-text="selectedCableShop.price_formatted || (selectedCableShop.price_on_request ? 'Preis auf Anfrage' : 'Kein Preis verfügbar')"></div>
                            <div class="detail-muted mt-1" x-text="selectedCableShop.base_product_code ? 'Basisprodukt ' + selectedCableShop.base_product_code : '–'"></div>
                          </div>
                        </div>

                        <template x-if="selectedCableShop.description">
                          <div class="detail-muted mt-3" x-text="selectedCableShop.description"></div>
                        </template>
                      </div>
                    </template>
                  </div>

                  <!-- ============ Optimizer Panel ============ -->
                  <div class="pt-4 border-t border-gray-100">
                    <div class="flex items-center justify-between w-full">
                      <button @click="optShowPanel = !optShowPanel" class="flex items-center gap-2 group flex-1 min-w-0">
                        <div class="detail-label mb-0">Querschnitt optimieren</div>
                        <svg class="w-4 h-4 text-gray-400 transition-transform flex-shrink-0" :class="optShowPanel ? 'rotate-180' : ''" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                      </button>
                      <a href="/settings" target="_blank" rel="noreferrer" title="Einstellungen" class="ml-2 flex-shrink-0 text-gray-400 hover:text-lapp-600 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                      </a>
                    </div>

                    <div x-show="optShowPanel" x-collapse class="mt-3 space-y-3">

                      <!-- Parameter inputs -->
                      <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                          <label class="detail-label">Betriebsstrom (A) *</label>
                          <input type="number" x-model.number="optParams.current_a" min="0" step="0.1"
                            class="w-full border border-lapp-600 rounded-md px-2 py-1.5 text-sm bg-orange-50 focus:outline-none focus:ring-1 focus:ring-lapp-600"
                            placeholder="z.B. 16">
                        </div>
                        <div>
                          <label class="detail-label">Spannung (V) *</label>
                          <input type="number" x-model.number="optParams.system_voltage_v" min="0" step="1"
                            class="w-full border border-lapp-600 rounded-md px-2 py-1.5 text-sm bg-orange-50 focus:outline-none focus:ring-1 focus:ring-lapp-600"
                            placeholder="z.B. 400">
                        </div>
                        <div>
                          <label class="detail-label flex items-center justify-between">
                            <span>Länge (m)</span>
                            <span x-show="optEplanLength != null" class="text-[9px] font-semibold bg-blue-100 text-blue-700 rounded px-1 py-0.5" x-text="'EPLAN: ' + optEplanLength"></span>
                          </label>
                          <input type="number" x-model.number="optParams.length_m" min="0" step="0.001"
                            :class="optEplanLength != null ? 'border-blue-300 bg-blue-50' : 'border-gray-200'"
                            class="w-full rounded-md px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-lapp-600">
                        </div>
                        <div>
                          <label class="detail-label flex items-center justify-between">
                            <span>Belastete Adern</span>
                            <span x-show="optUsedWires != null" class="text-[9px] font-semibold bg-blue-100 text-blue-700 rounded px-1 py-0.5" x-text="'EPLAN: ' + optUsedWires"></span>
                          </label>
                          <input type="number" x-model.number="optParams.loaded_cores" min="1" max="20" step="1"
                            class="w-full border border-blue-300 rounded-md px-2 py-1.5 text-sm bg-blue-50 focus:outline-none focus:ring-1 focus:ring-lapp-600">
                        </div>
                        <div>
                          <label class="detail-label">Phasen</label>
                          <div class="flex mt-1 rounded-md overflow-hidden border border-gray-200 text-xs font-medium">
                            <button type="button" @click="optParams.ac_3phase = false"
                              :class="!optParams.ac_3phase ? 'bg-lapp-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'"
                              class="flex-1 py-1.5 transition-colors">1~</button>
                            <button type="button" @click="optParams.ac_3phase = true"
                              :class="optParams.ac_3phase ? 'bg-lapp-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'"
                              class="flex-1 py-1.5 border-l border-gray-200 transition-colors">3~</button>
                          </div>
                        </div>
                      </div>

                      <!-- Cable options status -->
                      <div class="flex items-center gap-2 text-xs text-gray-500">
                        <template x-if="optOptionsLoading">
                          <div class="flex items-center gap-1.5 text-blue-600">
                            <svg class="animate-spin h-3 w-3" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                            <span>Lade Kabelvarianten…</span>
                          </div>
                        </template>
                        <template x-if="!optOptionsLoading && optOptions.length > 0">
                          <span x-text="filteredOptOptions.length + ' von ' + optOptions.length + ' Varianten'"></span>
                        </template>
                      </div>

                      <!-- Calculate button -->
                      <button @click="calculateOpt()"
                        class="w-full bg-lapp-600 hover:bg-lapp-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition-colors shadow-sm"
                        :disabled="optLoading || optParams.current_a <= 0 || optParams.system_voltage_v <= 0 || filteredOptOptions.length === 0"
                        :class="{'opacity-50 cursor-not-allowed': optLoading || optParams.current_a <= 0 || optParams.system_voltage_v <= 0 || filteredOptOptions.length === 0}">
                        <span x-show="!optLoading">Berechnen</span>
                        <span x-show="optLoading" class="flex items-center justify-center gap-2">
                          <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                          Berechne…
                        </span>
                      </button>

                      <!-- Error -->
                      <div x-show="optError" class="text-xs text-red-700 bg-red-50 border border-red-200 rounded-md px-2 py-1.5" x-text="optError"></div>

                      <!-- Results -->
                      <template x-if="optResult">
                        <div class="space-y-3">
                          <!-- Optimum cards -->
                          <div class="grid grid-cols-2 gap-2">
                            <template x-if="optResult.optimum.tco">
                              <div class="rounded-lg border-l-3 border-emerald-500 bg-emerald-50 p-2">
                                <div class="text-[10px] font-semibold text-emerald-700 uppercase">TCO-Opt.</div>
                                <div class="text-sm font-bold text-emerald-900" x-text="optResult.optimum.tco.cross_section_mm2 + ' mm²'"></div>
                                <div class="text-xs text-emerald-700" x-text="optFmt(optResult.optimum.tco.tco_eur) + ' €'"></div>
                              </div>
                            </template>
                            <template x-if="optResult.optimum.co2">
                              <div class="rounded-lg border-l-3 border-blue-500 bg-blue-50 p-2">
                                <div class="text-[10px] font-semibold text-blue-700 uppercase">CO₂-Opt.</div>
                                <div class="text-sm font-bold text-blue-900" x-text="optResult.optimum.co2.cross_section_mm2 + ' mm²'"></div>
                                <div class="text-xs text-blue-700" x-text="optFmt(optResult.optimum.co2.co2_total_kg) + ' kg'"></div>
                              </div>
                            </template>
                          </div>

                          <!-- Payback -->
                          <template x-if="optResult.optimum.payback_tco_years !== null && optResult.optimum.payback_tco_years !== undefined">
                            <div class="flex items-center gap-2 text-xs">
                              <span class="info-chip info-chip--amber">
                                <span>Amortisation:</span>
                                <span class="font-bold" x-text="optFmt(optResult.optimum.payback_tco_years) + ' J.'"></span>
                              </span>
                            </div>
                          </template>

                          <!-- Current cable highlight -->
                          <template x-if="selectedCable?.cross_section_mm2">
                            <div class="text-xs text-gray-500">
                              Aktuell verbaut: <span class="font-semibold" x-text="selectedCable.cross_section_mm2 + ' mm²'"></span>
                            </div>
                          </template>

                          <!-- Compact result table -->
                          <div class="overflow-x-auto border border-gray-200 rounded-lg">
                            <table class="w-full text-[11px]">
                              <thead class="bg-gray-50 text-gray-500 uppercase">
                                <tr>
                                  <th class="px-1.5 py-1 text-left">mm²</th>
                                  <th class="px-1.5 py-1 text-right">TCO €</th>
                                  <th class="px-1.5 py-1 text-right">CO₂ kg</th>
                                  <th class="px-1.5 py-1 text-right">ΔU %</th>
                                </tr>
                              </thead>
                              <tbody>
                                <template x-for="row in optResult.rows" :key="row.cross_section_mm2">
                                  <tr class="border-t border-gray-100"
                                      :class="{
                                        'bg-emerald-50 font-semibold': optResult.optimum.tco && row.cross_section_mm2 === optResult.optimum.tco.cross_section_mm2,
                                        'bg-blue-50': optResult.optimum.co2 && row.cross_section_mm2 === optResult.optimum.co2.cross_section_mm2 && !(optResult.optimum.tco && row.cross_section_mm2 === optResult.optimum.tco.cross_section_mm2),
                                        'bg-red-50 text-red-400 line-through': !row.admissible,
                                        'ring-2 ring-lapp-600 ring-inset': selectedCable?.cross_section_mm2 && row.cross_section_mm2 === selectedCable.cross_section_mm2,
                                      }">
                                    <td class="px-1.5 py-1" x-text="row.cross_section_mm2"></td>
                                    <td class="px-1.5 py-1 text-right" x-text="optFmt(row.tco_eur)"></td>
                                    <td class="px-1.5 py-1 text-right" x-text="optFmt(row.co2_total_kg)"></td>
                                    <td class="px-1.5 py-1 text-right" x-text="row.voltage_drop_percent != null ? row.voltage_drop_percent.toFixed(1) : '–'"></td>
                                  </tr>
                                </template>
                              </tbody>
                            </table>
                          </div>

                          <!-- Legend -->
                          <div class="flex flex-wrap gap-2 text-[10px] text-gray-400">
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded bg-emerald-300 inline-block"></span>TCO-Opt.</span>
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded bg-blue-300 inline-block"></span>CO₂-Opt.</span>
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded bg-red-200 inline-block"></span>Unzulässig</span>
                            <span class="flex items-center gap-1"><span class="inline-block w-2 h-2 rounded ring-1 ring-lapp-600"></span>Aktuell</span>
                          </div>

                          <!-- Open in full optimizer -->
                          <button @click="openInOptimizer()"
                            class="w-full flex items-center justify-center gap-1.5 text-xs font-semibold text-lapp-600 border border-lapp-600 rounded-lg px-3 py-1.5 hover:bg-lapp-600 hover:text-white transition-colors">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                            </svg>
                            Details im Optimierer
                          </button>
                        </div>
                      </template>

                    </div>
                  </div>
                  <!-- ============ /Optimizer Panel ============ -->

                </div>
              </div>
            </div>
            </div>
          </template>

          <!-- FG Group detail panel -->
          <template x-if="selectedFgGroup && !selectedComponent">
            <div>
              <div class="detail-panel-overlay md:hidden" @click="selectedFgGroup = null"></div>
              <div class="bg-white rounded-xl shadow-sm border border-gray-200 detail-panel">
              <div class="detail-panel-header px-4 py-3 flex items-start justify-between gap-3">
                <div>
                  <div class="detail-label mb-1">Funktionsgruppe</div>
                  <h3 class="font-semibold text-slate-800">
                    <span x-text="'=' + selectedFgGroup.fg"></span>
                    <span class="text-gray-400 text-sm ml-1" x-text="'(' + selectedFgGroup.subsystem + ')'"></span>
                  </h3>
                </div>
                <button @click="selectedFgGroup = null" class="text-gray-400 hover:text-gray-600">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
              <div class="detail-panel-body text-sm">
                <div class="detail-block">
                  <div class="detail-label">Überblick</div>
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="info-chip" x-text="selectedFgGroup.components.length + ' Geräte'"></span>
                    <span class="detail-muted" x-text="selectedFgGroup.subsystem"></span>
                    <span x-show="selectedFgGroup.components[0]?.related_cables?.length > 0" class="info-chip info-chip--green" x-text="selectedFgGroup.components[0]?.related_cables?.length + ' Kabel'"></span>
                  </div>
                </div>

                <!-- Component list -->
                <div class="detail-block">
                  <div class="detail-label">Enthaltene Geräte</div>
                  <div class="max-h-72 overflow-y-auto space-y-1 pr-1">
                  <template x-for="comp in selectedFgGroup.components" :key="comp.id">
                    <div class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-xs cursor-pointer hover:border-lapp-600 hover:shadow-sm transition-all"
                         @click="selectedComponent = comp">
                      <div class="flex items-center justify-between">
                        <span class="font-mono font-bold text-gray-900" x-text="comp.designation"></span>
                        <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-medium"
                              :class="typeColorClass(comp.component_type)"
                              x-text="typeLabel(comp.component_type)"></span>
                      </div>
                      <div class="text-gray-700 mt-1" x-text="comp.description_de"></div>
                      <div class="text-gray-400 font-mono text-[10px] mt-1 truncate" x-text="comp.full_eplan_name"></div>
                    </div>
                  </template>
                  </div>
                </div>

                <!-- Cables for this FG group's location -->
                <template x-if="selectedFgGroup.components[0]?.related_cables?.length > 0">
                  <div class="detail-block">
                    <div class="detail-label">Kabel am Standort</div>
                    <div class="space-y-2">
                      <template x-for="cable in selectedFgGroup.components[0].related_cables" :key="cable.cable_name">
                          <div class="rounded-lg border border-gray-200 bg-gray-50 px-2 py-1.5 text-xs">
                          <div class="font-medium text-gray-800" x-text="cable.cable_name"></div>
                          <div class="detail-muted mt-0.5" x-text="cable.cable_spec"></div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
            </div>
          </template>

          <!-- Single component detail panel -->
          <div x-show="selectedComponent">
            <div class="detail-panel-overlay md:hidden" @click="selectedComponent = null"></div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 detail-panel">
              <div class="detail-panel-header px-4 py-3 flex items-start justify-between gap-3">
                <div>
                  <div class="detail-label mb-1">Gerät</div>
                  <h3 class="font-semibold text-slate-800" x-text="selectedComponent?.designation"></h3>
                </div>
                <button @click="selectedComponent = null" class="text-gray-400 hover:text-gray-600">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            <div class="detail-panel-body text-sm" x-show="selectedComponent">
              <!-- Type badge -->
              <div class="detail-block">
                <div class="detail-label">Typ</div>
                <div class="flex flex-wrap items-center gap-2">
                  <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                        :class="typeColorClass(selectedComponent?.component_type)"
                        x-text="typeLabel(selectedComponent?.component_type)"></span>
                </div>
              </div>

              <div class="detail-grid">
                <div class="detail-grid-item">
                  <div class="detail-label">Beschreibung</div>
                  <div class="detail-value font-medium" x-text="selectedComponent?.description_de || '–'"></div>
                  <div class="detail-muted" x-text="selectedComponent?.description_en" x-show="selectedComponent.description_en"></div>
                </div>
                <div class="detail-grid-item grid grid-cols-2 gap-2 text-xs">
                  <div>
                    <div class="detail-label mb-1">Funktionsgruppe</div>
                    <div class="detail-value font-mono" x-text="selectedComponent?.function_group ? '=' + selectedComponent.function_group : '–'"></div>
                  </div>
                  <div>
                    <div class="detail-label mb-1">Einbauort</div>
                    <div class="detail-value font-medium" x-text="selectedComponent?.location ? (selectedComponent.location === '+SS1' ? 'Schaltschrank' : selectedComponent.location === '+MR1' ? 'Maschinenraum' : selectedComponent.location) : '–'"></div>
                  </div>
                  <div>
                    <div class="detail-label mb-1">Hersteller</div>
                    <div class="detail-value" x-text="selectedComponent.manufacturer || '–'"></div>
                  </div>
                  <div>
                    <div class="detail-label mb-1">Subsystem</div>
                    <div class="detail-value" x-text="selectedComponent.subsystem || '–'"></div>
                  </div>
                  <div>
                    <div class="detail-label mb-1">Bestellnr.</div>
                    <div class="detail-value font-mono" x-text="selectedComponent.order_number || '–'"></div>
                  </div>
                  <div>
                    <div class="detail-label mb-1">SAP</div>
                    <div class="detail-value font-mono" x-text="selectedComponent.sap_number || '–'"></div>
                  </div>
                </div>
                <template x-if="selectedComponent?.technical_specs">
                  <div class="detail-grid-item">
                    <div class="detail-label">Technische Daten</div>
                    <div class="detail-value font-mono" x-text="selectedComponent.technical_specs"></div>
                  </div>
                </template>
              </div>

              <!-- Connected cables -->
              <div x-show="getComponentCables(selectedComponent).length > 0" class="detail-block">
                <div class="detail-label">Verbundene Kabel</div>
                <template x-for="cable in getComponentCables(selectedComponent)" :key="cable.cable_name">
                  <div class="rounded-lg border border-gray-200 bg-gray-50 px-2 py-1.5 mb-2 text-xs">
                    <div class="font-medium text-gray-800" x-text="cable.cable_name"></div>
                    <div class="detail-muted" x-text="cable.cable_spec"></div>
                    <div class="detail-muted" x-text="cable.cable_type" x-show="cable.cable_type && cable.cable_type !== cable.cable_spec"></div>
                    <template x-if="cable.cross_section_mm2">
                      <a :href="'/?cs=' + cable.cross_section_mm2 + '&cores=' + (cable.num_cores || 3)"
                         class="text-lapp-600 hover:underline mt-1 inline-block">
                        → Querschnitt optimieren
                      </a>
                    </template>
                  </div>
                </template>
              </div>

              <!-- I/O assignments for controllers -->
              <div x-show="getComponentIO(selectedComponent).length > 0" class="detail-block">
                <div class="detail-label">I/O-Zuordnung</div>
                <div class="max-h-48 overflow-y-auto pr-1">
                  <template x-for="io in getComponentIO(selectedComponent)" :key="io.pin + io.function_de">
                    <div class="flex gap-2 text-xs py-1 border-b border-gray-100 last:border-b-0">
                      <span class="font-mono font-medium w-8" x-text="io.signal_type"></span>
                      <span class="font-mono w-6 text-gray-400" x-text="io.pin"></span>
                      <span class="text-gray-700" x-text="io.function_de"></span>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Back to group button -->
              <template x-if="selectedFgGroup">
                <button @click="selectedComponent = null"
                        class="w-full text-center text-xs text-gray-500 hover:text-lapp-600 mt-1 py-2 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 transition-colors">
                  ← Zurück zur Gruppe
                </button>
              </template>
            </div>
            </div>
          </div>
        </aside>
      </div>
    </template>
  </main>

  <script type="application/json" id="default-params">{{ default_params | tojson }}</script>
  <script type="application/json" id="default-options">{{ default_options | tojson }}</script>
  <script>
    const DEFAULT_PARAMS = JSON.parse(document.getElementById('default-params').textContent);
    const DEFAULT_OPTIONS = JSON.parse(document.getElementById('default-options').textContent);

    const optNumFmt = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // Graph element registry — rebuilt on every _drawGraph(); used for highlight + zoom-to-cable
    let _gReg = { edgesByCable: {}, nodeById: {}, allPathEls: [], allLabelBgs: [], allLabelTexts: [], allNodeGs: [] };

    function machineViz() {
      return {
        graphData: null,
        loading: false,
        loadingMessage: 'Snapshot wird geladen…',
        error: '',
        tokenInput: '',
        selectedComponent: null,
        selectedFgGroup: null,
        selectedCable: null,
        selectedCableShop: null,
        selectedCableShopLoading: false,
        selectedCableShopError: '',
        filterSubsystem: '',
        viewMode: 'subsystem',
        zoom: 1,
        panX: 0,
        panY: 0,
        isPanning: false,
        panStart: { x: 0, y: 0 },

        // Optimizer state
        optParams: { ...DEFAULT_PARAMS },
        optOptions: [],
        optResult: null,
        optLoading: false,
        optOptionsLoading: false,
        optError: '',
        optShowPanel: true,
        optUsedWires: null,
        optEplanLength: null,
        optSettingsPrice: null,
        optSettingsVoltDrop: null,

        // Machine-level operation params (left panel, persisted)
        machineYears: DEFAULT_PARAMS.years,
        machineHoursPerDay: DEFAULT_PARAMS.hours_per_day,
        machineDaysPerYear: DEFAULT_PARAMS.days_per_year,
        optMachineYears: null,
        optMachineHoursPerDay: null,
        optMachineDaysPerYear: null,

        mobileSidebarOpen: false,

        // Type color mapping
        TYPE_COLORS: {
          motor:       { fill: '#dbeafe', stroke: '#3b82f6', text: '#1e40af' },
          sensor:      { fill: '#dcfce7', stroke: '#22c55e', text: '#166534' },
          protection:  { fill: '#fef3c7', stroke: '#f59e0b', text: '#92400e' },
          controller:  { fill: '#ede9fe', stroke: '#8b5cf6', text: '#5b21b6' },
          switch:      { fill: '#fce7f3', stroke: '#ec4899', text: '#9d174d' },
          transformer: { fill: '#e0e7ff', stroke: '#6366f1', text: '#3730a3' },
          heater:      { fill: '#fee2e2', stroke: '#ef4444', text: '#991b1b' },
          assembly:    { fill: '#f0fdf4', stroke: '#16a34a', text: '#166534' },
          cable:       { fill: '#f1f5f9', stroke: '#94a3b8', text: '#334155' },
        },

        TYPE_LABELS: {
          motor: 'Motor / Aktor',
          sensor: 'Sensor',
          protection: 'Schutzgerät',
          controller: 'Steuerung',
          switch: 'Schalter / Schütz',
          transformer: 'Netzteil',
          heater: 'Heizung',
          assembly: 'Baugruppe',
          cable: 'Kabel',
        },

        // Subsystem color palette
        SUB_COLORS: [
          '#3b82f6', '#22c55e', '#f59e0b', '#8b5cf6', '#ec4899',
          '#6366f1', '#ef4444', '#14b8a6', '#f97316', '#06b6d4',
          '#84cc16', '#a855f7', '#e11d48', '#0891b2', '#65a30d',
          '#7c3aed', '#dc2626', '#0d9488', '#ea580c', '#2563eb',
          '#16a34a', '#d97706',
        ],

        typeColorClass(type) {
          const map = {
            motor: 'bg-blue-100 text-blue-800',
            sensor: 'bg-green-100 text-green-800',
            protection: 'bg-amber-100 text-amber-800',
            controller: 'bg-violet-100 text-violet-800',
            switch: 'bg-pink-100 text-pink-800',
            transformer: 'bg-indigo-100 text-indigo-800',
            heater: 'bg-red-100 text-red-800',
            assembly: 'bg-emerald-100 text-emerald-800',
            cable: 'bg-slate-100 text-slate-800',
          };
          return map[type] || 'bg-gray-100 text-gray-800';
        },

        async init() {
          // Load machine operation params from localStorage
          const ms = JSON.parse(localStorage.getItem('lapp_machine_ops') || '{}');
          if (ms.years !== undefined) this.machineYears = ms.years;
          if (ms.hours_per_day !== undefined) this.machineHoursPerDay = ms.hours_per_day;
          if (ms.days_per_year !== undefined) this.machineDaysPerYear = ms.days_per_year;
          // Watchers: persist + push to open optimizer in real-time
          this.$watch('machineYears', (v) => { this._saveMachineOps(); if (this.selectedCable) { this.optParams.years = v; this.optMachineYears = v; } });
          this.$watch('machineHoursPerDay', (v) => { this._saveMachineOps(); if (this.selectedCable) { this.optParams.hours_per_day = v; this.optMachineHoursPerDay = v; } });
          this.$watch('machineDaysPerYear', (v) => { this._saveMachineOps(); if (this.selectedCable) { this.optParams.days_per_year = v; this.optMachineDaysPerYear = v; } });
          this.$watch('selectedCable', (cable) => {
            if (cable) this.$nextTick(() => this.highlightCable(cable));
            else this.clearGraphHighlight();
          });

          const token = new URLSearchParams(window.location.search).get('token');
          if (token) {
            await this.loadFromToken(token);
          } else {
            await this.loadDatabaseGraph();
          }
        },

        formatImportedAt(value) {
          if (!value) return '';
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return value;
          return date.toLocaleString('de-DE', {
            dateStyle: 'short',
            timeStyle: 'short',
          });
        },

        typeLabel(type) {
          return this.TYPE_LABELS[type] || type || 'Unbekannt';
        },

        getComponentCables(component) {
          if (!component || !this.graphData) return [];
          if (Array.isArray(component.related_cables) && component.related_cables.length > 0) {
            return component.related_cables;
          }

          const designation = component.designation;
          if (!designation) return [];
          return this.graphData.connections.filter(c => {
            // Cable name typically contains the component designation after 'W'
            const short = c.cable_name.includes('-') ? c.cable_name.split('-').slice(1).join('-') : c.cable_name;
            const target = short.startsWith('W') ? short.substring(1).replace(/-\d+$/, '') : '';
            return target === designation || c.to_component?.includes(designation) || c.from_component?.includes(designation);
          });
        },

        getComponentIO(component) {
          if (!component || !this.graphData) return [];
          if (Array.isArray(component.io_assignments) && component.io_assignments.length > 0) {
            return component.io_assignments;
          }

          const designation = component.designation;
          if (!designation) return [];
          if (designation !== 'K801') return [];
          return this.graphData.io_assignments;
        },

        async loadDatabaseGraph() {
          this.loadingMessage = 'Snapshot wird geladen…';
          this.loading = true;
          this.error = '';
          this.graphData = null;
          this.selectedComponent = null;
          try {
            const resp = await fetch('/api/machine-db');
            if (!resp.ok) {
              const err = await resp.json();
              throw new Error(err.detail || 'Snapshot konnte nicht geladen werden.');
            }
            this.graphData = await resp.json();
            this.$nextTick(() => this.renderGraph());
          } catch (e) {
            this.error = e.message;
          } finally {
            this.loading = false;
          }
        },

        async loadFromToken(token) {
          this.loadingMessage = 'Maschine wird geladen…';
          this.loading = true;
          this.error = '';
          this.graphData = null;
          this.selectedComponent = null;
          try {
            const resp = await fetch('/api/machine-db/' + encodeURIComponent(token));
            if (!resp.ok) {
              const err = await resp.json().catch(() => ({}));
              throw new Error(err.detail || 'Maschine konnte nicht geladen werden.');
            }
            this.graphData = await resp.json();
            this.$nextTick(() => this.renderGraph());
          } catch (e) {
            this.error = e.message;
          } finally {
            this.loading = false;
          }
        },

        async loadCableShopInfo(cable) {
          const articleNumber = cable?.sap_number || cable?.article_part_nr || '';
          const normalizedArticleNumber = articleNumber.replace(/^lapp\.?\s*/i, '').trim();
          this.selectedCableShop = null;
          this.selectedCableShopError = '';

          // Init optimizer with cable data
          this.initOptimizer(cable);

          if (!normalizedArticleNumber) {
            this.selectedCableShopError = 'Keine Artikelnummer für diesen Kabelsatz vorhanden.';
            // Load default options as fallback
            this.optOptions = DEFAULT_OPTIONS.map(o => ({ ...o }));
            return;
          }

          this.selectedCableShopLoading = true;
          try {
            const resp = await fetch(`/api/shop/variant/${encodeURIComponent(normalizedArticleNumber)}`);
            if (!resp.ok) {
              const err = await resp.json().catch(() => ({}));
              throw new Error(err.detail || 'Shop-Variante konnte nicht geladen werden.');
            }
            this.selectedCableShop = await resp.json();
            // Auto-load cable options from shop
            if (this.selectedCableShop?.base_product_code) {
              this.loadOptCableOptions(this.selectedCableShop.base_product_code);
            } else {
              this.optOptions = DEFAULT_OPTIONS.map(o => ({ ...o }));
            }
          } catch (e) {
            this.selectedCableShopError = e.message;
            this.optOptions = DEFAULT_OPTIONS.map(o => ({ ...o }));
          } finally {
            this.selectedCableShopLoading = false;
          }
        },

        // --------------- Optimizer ---------------

        initOptimizer(cable) {
          this.optParams = { ...DEFAULT_PARAMS, current_a: 0, system_voltage_v: 0, ac_3phase: false };
          this.optResult = null;
          this.optError = '';
          this.optOptions = [];
          this.optUsedWires = null;
          this.optMachineYears = null;
          this.optMachineHoursPerDay = null;
          this.optMachineDaysPerYear = null;

          // Pre-fill from cable data
          if (cable?.length_m) {
            this.optParams.length_m = cable.length_m;
            this.optEplanLength = cable.length_m;
          } else {
            this.optEplanLength = null;
          }
          // usedWires = physically loaded conductors from EPLAN (preferred over num_cores = total wire count)
          const coresRaw = cable?.used_wires ?? cable?.num_cores;
          if (coresRaw != null) {
            const cores = parseInt(coresRaw);
            if (!isNaN(cores) && cores >= 1) {
              this.optParams.loaded_cores = cores;
              this.optUsedWires = cores;
            }
          }

          // Load settings from localStorage (same as index.html)
          const s = JSON.parse(localStorage.getItem('lapp_settings') || '{}');
          if (s.energy_price_eur_per_kwh !== undefined) {
            this.optParams.energy_price_eur_per_kwh = s.energy_price_eur_per_kwh;
            this.optSettingsPrice = s.energy_price_eur_per_kwh;
          } else {
            this.optSettingsPrice = null;
          }
          if (s.max_voltage_drop_percent !== undefined) {
            this.optParams.max_voltage_drop_percent = s.max_voltage_drop_percent;
            this.optSettingsVoltDrop = s.max_voltage_drop_percent;
          } else {
            this.optSettingsVoltDrop = null;
          }
          if (s.electricity_emission_factor_kg_per_kwh !== undefined) this.optParams.electricity_emission_factor_kg_per_kwh = s.electricity_emission_factor_kg_per_kwh;
          if (s.copper_emission_factor_kg_per_kg !== undefined) this.optParams.copper_emission_factor_kg_per_kg = s.copper_emission_factor_kg_per_kg;

          // Fill from machine operation params (left panel)
          this.optParams.years = this.machineYears;
          this.optMachineYears = this.machineYears;
          this.optParams.hours_per_day = this.machineHoursPerDay;
          this.optMachineHoursPerDay = this.machineHoursPerDay;
          this.optParams.days_per_year = this.machineDaysPerYear;
          this.optMachineDaysPerYear = this.machineDaysPerYear;
        },

        _saveMachineOps() {
          localStorage.setItem('lapp_machine_ops', JSON.stringify({
            years: this.machineYears,
            hours_per_day: this.machineHoursPerDay,
            days_per_year: this.machineDaysPerYear,
          }));
        },

        async loadOptCableOptions(baseProductCode) {
          this.optOptionsLoading = true;
          this.optOptions = [];
          try {
            const resp = await fetch('/api/shop/product/' + encodeURIComponent(baseProductCode) + '/cable-options');
            if (!resp.ok) throw new Error('Kabelvarianten konnten nicht geladen werden.');
            const opts = await resp.json();
            this.optOptions = opts.length > 0 ? opts : DEFAULT_OPTIONS.map(o => ({ ...o }));
          } catch (e) {
            console.error('loadOptCableOptions error:', e);
            this.optOptions = DEFAULT_OPTIONS.map(o => ({ ...o }));
          } finally {
            this.optOptionsLoading = false;
          }
        },

        get filteredOptOptions() {
          return this.optOptions.filter(o => {
            const cores = parseInt(o.num_cores);
            if (!isNaN(cores) && cores < this.optParams.loaded_cores) return false;
            if (o.ampacity_a != null && this.optParams.current_a > 0 && o.ampacity_a < this.optParams.current_a) return false;
            return true;
          });
        },

        async calculateOpt() {
          if (this.optParams.current_a <= 0 || this.optParams.system_voltage_v <= 0) {
            this.optError = 'Bitte Betriebsstrom und Spannung eingeben.';
            return;
          }
          const opts = this.filteredOptOptions;
          if (opts.length === 0) {
            this.optError = 'Keine passenden Kabelvarianten verfügbar.';
            return;
          }
          this.optLoading = true;
          this.optError = '';
          this.optResult = null;
          try {
            const resp = await fetch('/api/calculate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ params: this.optParams, options: opts }),
            });
            if (!resp.ok) throw new Error(await resp.text());
            this.optResult = await resp.json();
          } catch (e) {
            console.error(e);
            this.optError = 'Fehler: ' + e.message;
          } finally {
            this.optLoading = false;
          }
        },

        optFmt(v) { return optNumFmt.format(v); },

        openInOptimizer() {
          const prefill = {
            params: { ...this.optParams },
            options: this.filteredOptOptions,
            productName: this.selectedCableShop?.name || '',
            productImage: this.selectedCableShop?.image_url || '',
            baseCode: this.selectedCableShop?.base_product_code || '',
          };
          localStorage.setItem('lapp_opt_prefill', JSON.stringify(prefill));
          window.open('/optimizer', '_blank');
        },

        // Pan & Zoom
        _zoomAt(newZoom, anchorX, anchorY) {
          const container = document.getElementById('graphContainer');
          if (!container) return;

          const oldZoom = this.zoom;
          const clampedZoom = Math.max(0.2, Math.min(3, newZoom));
          if (clampedZoom === oldZoom) return;

          const x = anchorX ?? container.clientWidth / 2;
          const y = anchorY ?? container.clientHeight / 2;
          const worldX = (x - this.panX) / oldZoom;
          const worldY = (y - this.panY) / oldZoom;

          this.zoom = clampedZoom;
          this.panX = x - worldX * this.zoom;
          this.panY = y - worldY * this.zoom;
        },

        zoomIn(anchorX, anchorY)  { this._zoomAt(this.zoom * 1.2, anchorX, anchorY); },
        zoomOut(anchorX, anchorY) { this._zoomAt(this.zoom / 1.2, anchorX, anchorY); },
        resetView() { this.zoom = 1; this.panX = 20; this.panY = 20; },
        handleWheel(e) {
          const container = document.getElementById('graphContainer');
          if (!container) return;

          const rect = container.getBoundingClientRect();
          const anchorX = e.clientX - rect.left;
          const anchorY = e.clientY - rect.top;

          if (e.deltaY < 0) this.zoomIn(anchorX, anchorY); else this.zoomOut(anchorX, anchorY);
        },
        startPan(e) { this.isPanning = true; this.panStart = { x: e.clientX - this.panX, y: e.clientY - this.panY }; },
        doPan(e)  { if (this.isPanning) { this.panX = e.clientX - this.panStart.x; this.panY = e.clientY - this.panStart.y; } },
        endPan()  { this.isPanning = false; },

        // Touch pan support
        _touchStart: null,
        handleTouchStart(e) {
          if (e.touches.length === 1) {
            this._touchStart = { x: e.touches[0].clientX - this.panX, y: e.touches[0].clientY - this.panY };
          }
        },
        handleTouchMove(e) {
          if (e.touches.length === 1 && this._touchStart) {
            this.panX = e.touches[0].clientX - this._touchStart.x;
            this.panY = e.touches[0].clientY - this._touchStart.y;
          }
        },
        handleTouchEnd(e) { this._touchStart = null; },

        // --------------- Graph rendering with Dagre ---------------
        renderGraph() {
          if (!this.graphData) return;
          const el = document.getElementById('graphGroup');
          if (!el) {
            // DOM not ready yet (x-if template not rendered), retry
            setTimeout(() => this.renderGraph(), 50);
            return;
          }
          this.error = '';

          try {
            const g = new dagre.graphlib.Graph({ compound: true, multigraph: true });
            g.setGraph({ rankdir: 'LR', nodesep: 80, ranksep: 250, marginx: 50, marginy: 50, edgesep: 40 });
            g.setDefaultEdgeLabel(() => ({}));

            const components = this.graphData.components;
            const connections = this.graphData.connections;
            const subsystems = this.graphData.subsystems;

            // Build lookup: designation → component
            const compByDesig = {};
            components.forEach(c => { compByDesig[c.designation] = c; });

            if (this.viewMode === 'subsystem') {
              this._renderSubsystemView(g, components, connections, subsystems, compByDesig);
            } else {
              this._renderAllView(g, components, connections, compByDesig);
            }

            dagre.layout(g);
            this._drawGraph(g);
          } catch (e) {
            console.error('renderGraph error:', e);
            this.error = 'Graph-Rendering fehlgeschlagen: ' + e.message;
          }
        },

        _renderSubsystemView(g, components, connections, subsystems, compByDesig) {
          // Group components by (subsystem, function_group) for a condensed view.
          // Each FG group becomes one node instead of showing every device.

          // Create subsystem cluster nodes (= locations)
          const subIdx = {};
          subsystems.forEach((sub, i) => {
            subIdx[sub.name] = i;
            const label = sub.name_de || sub.name;
            g.setNode('sub_' + i, {
              label: label,
              clusterLabelPos: 'top',
              style: 'fill: transparent',
              width: 160,
              height: 60,
              isSubsystem: true,
              subIndex: i,
            });
          });

          // Group components by subsystem + function_group
          const fgGroups = {};  // key "loc|fg" → { fg, subsystem, components: [...] }
          components.forEach(c => {
            if (this.filterSubsystem && c.subsystem !== this.filterSubsystem) return;
            const key = c.subsystem + '|' + (c.function_group || '_none');
            if (!fgGroups[key]) {
              fgGroups[key] = {
                fg: c.function_group || '',
                subsystem: c.subsystem,
                components: [],
              };
            }
            fgGroups[key].components.push(c);
          });

          // Create one node per FG group
          const compByLoc = {};
          const addedNodes = new Set();

          Object.entries(fgGroups).forEach(([key, group]) => {
            const nodeId = 'fg_' + key;

            // Summarise the types in this group
            const typeCounts = {};
            group.components.forEach(c => {
              const desc = c.description_de || c.component_type;
              typeCounts[desc] = (typeCounts[desc] || 0) + 1;
            });
            const typeSummary = Object.entries(typeCounts)
              .sort((a, b) => b[1] - a[1])
              .slice(0, 3)
              .map(([desc, n]) => n > 1 ? `${n}\u00d7 ${desc}` : desc)
              .join(', ');

            // Pick dominant component type for colour
            const typeFreq = {};
            group.components.forEach(c => {
              typeFreq[c.component_type] = (typeFreq[c.component_type] || 0) + 1;
            });
            const dominantType = Object.entries(typeFreq)
              .sort((a, b) => b[1] - a[1])[0][0];
            const colors = this.TYPE_COLORS[dominantType] || { fill: '#f1f5f9', stroke: '#94a3b8', text: '#334155' };

            // Label: FG name on top, type summary below
            const fgLabel = group.fg || group.subsystem;
            const countLabel = group.components.length > 1
              ? `${group.components.length} Geräte`
              : typeSummary;
            const label = fgLabel + '\n' + (group.components.length > 1 ? typeSummary : (group.components[0].description_de || ''));

            // Wider for groups with many types
            const nodeWidth = Math.max(180, Math.min(280, typeSummary.length * 6.5 + 40));

            g.setNode(nodeId, {
              label: label,
              width: nodeWidth,
              height: 60,
              // Store first component for click, but also array of all
              component: group.components[0],
              fgGroup: group,
              colors: colors,
            });

            // Mark all component IDs as added (for edge routing)
            group.components.forEach(c => addedNodes.add(c.id));

            // Track by location for cable edge routing
            if (!compByLoc[group.subsystem]) compByLoc[group.subsystem] = [];
            compByLoc[group.subsystem].push(nodeId);

            // Parent to subsystem cluster
            if (subIdx[group.subsystem] !== undefined && !this.filterSubsystem) {
              g.setParent(nodeId, 'sub_' + subIdx[group.subsystem]);
            }
          });

          // Cable edges only (skip FG chains — they are now collapsed into FG group nodes)
          this._addCableEdges(g, connections, subsystems, addedNodes, compByLoc, true);
        },

        _renderAllView(g, components, connections, compByDesig) {
          const addedNodes = new Set();
          const compByLoc = {};
          components.forEach(c => {
            if (this.filterSubsystem && c.subsystem !== this.filterSubsystem) return;

            const nodeId = 'comp_' + c.id;
            const colors = this.TYPE_COLORS[c.component_type] || { fill: '#f1f5f9', stroke: '#94a3b8', text: '#334155' };
            const fgPrefix = c.function_group ? c.function_group + ' ' : '';
            const descShort = c.description_de ? c.description_de.substring(0, 18) : '';

            if (c.subsystem) {
              if (!compByLoc[c.subsystem]) compByLoc[c.subsystem] = [];
              compByLoc[c.subsystem].push(nodeId);
            }

            g.setNode(nodeId, {
              label: c.designation + '\n' + fgPrefix + descShort,
              width: 170,
              height: 60,
              component: c,
              colors: colors,
            });
            addedNodes.add(c.id);
          });

          this._addCableEdges(g, connections, null, addedNodes, compByLoc);
        },

        _addCableEdges(g, connections, subsystems, addedNodes, compByLoc, skipFgChains) {
          // compByLoc maps location -> array of component node IDs in that location
          // We pick a representative node from each location as edge endpoint
          // (dagre cannot route edges between compound/parent nodes)

          // --- Bundle cables by (fromNode, toNode) route to avoid overlapping labels ---
          const cableConns = connections.filter(c => c.connection_type === 'cable');

          // First, group cables by their resolved (fromNode, toNode) pair
          const routeBundles = {};  // "fromNode|toNode" → { fromNode, toNode, cables: [...] }
          cableConns.forEach((conn, idx) => {
            const fromLoc = conn.from_location || '';
            const toLoc = conn.to_location || '';
            if (!fromLoc || !toLoc) return;

            const fromNodes = compByLoc[fromLoc];
            const toNodes = compByLoc[toLoc];
            if (!fromNodes || !fromNodes.length || !toNodes || !toNodes.length) return;

            // Distribute across FG-group nodes in the location
            const fromNode = fromNodes[idx % fromNodes.length];
            const toNode = toNodes[idx % toNodes.length];
            const routeKey = fromNode + '|' + toNode;

            if (!routeBundles[routeKey]) {
              routeBundles[routeKey] = { fromNode, toNode, cables: [] };
            }
            routeBundles[routeKey].cables.push(conn);
          });

          // Create one edge per route bundle
          Object.entries(routeBundles).forEach(([routeKey, bundle], idx) => {
            const cables = bundle.cables;
            const firstCable = cables[0];
            const extraCount = Math.max(0, cables.length - 1);

            // Keep the visual label compact, but preserve the technical detail line.
            const mainLabel = extraCount > 0
              ? `${firstCable.cable_name} +${extraCount}`
              : firstCable.cable_name;

            const detailParts = [];
            if (firstCable.cable_spec) detailParts.push(firstCable.cable_spec);
            if (firstCable.length_m) detailParts.push(`${firstCable.length_m} m`);
            if (firstCable.num_cores) detailParts.push(`${firstCable.num_cores} Adern`);
            if (extraCount > 0) detailParts.push(`+${extraCount} weitere`);
            const detailLabel = detailParts.join(' | ');

            // Compute label dimensions for dagre spacing
            const lines = detailLabel ? [mainLabel, detailLabel] : [mainLabel];
            const lineCount = lines.length;
            const longestLine = lines.reduce((a, b) => a.length > b.length ? a : b, '');
            const labelWidth = longestLine.length * 7 + 24;
            const labelHeight = lineCount * 16 + 12;

            g.setEdge(bundle.fromNode, bundle.toNode, {
              label: lines.join('\n'),
              cables: cables,
              edgeType: 'cable',
              minlen: 3,
              labelpos: 'c',
              width: labelWidth,
              height: labelHeight,
            }, 'cable_' + idx);
          });

          // --- Function-group chain edges within subsystems ---
          if (!skipFgChains) {
            const addedNodeSet = addedNodes instanceof Set ? addedNodes : new Set(addedNodes);
            let fgIdx = 0;
            connections.forEach(conn => {
              if (conn.connection_type !== 'fg_chain') return;
              const fromId = conn.from_component;
              const toId = conn.to_component;
              if (!addedNodeSet.has(fromId) || !addedNodeSet.has(toId)) return;

              const fromNode = 'comp_' + fromId;
              const toNode = 'comp_' + toId;

              g.setEdge(fromNode, toNode, {
                label: conn.function_group || '',
                edgeType: 'fg_chain',
                functionGroup: conn.function_group,
                minlen: 1,
              }, 'fg_' + fgIdx++);
            });
          }
        },

        _drawGraph(g) {
          const group = document.getElementById('graphGroup');
          group.innerHTML = '';
          const self = this;

          // Reset highlight registry
          _gReg = { edgesByCable: {}, nodeById: {}, allPathEls: [], allLabelBgs: [], allLabelTexts: [], allNodeGs: [] };

          // Draw edges first (behind nodes)
          g.edges().forEach(e => {
            const edge = g.edge(e);
            if (!edge.points) return;

            const isFgChain = edge.edgeType === 'fg_chain';
            const isCable = edge.edgeType === 'cable';

            const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            // Use smooth cubic bezier curves instead of straight line segments
            let d;
            if (edge.points.length <= 2) {
              d = 'M' + edge.points.map(p => `${p.x},${p.y}`).join(' L');
            } else {
              d = `M${edge.points[0].x},${edge.points[0].y}`;
              for (let i = 1; i < edge.points.length - 1; i++) {
                const prev = edge.points[i - 1];
                const curr = edge.points[i];
                const next = edge.points[i + 1];
                const cpx1 = (prev.x + curr.x) / 2;
                const cpy1 = (prev.y + curr.y) / 2;
                const cpx2 = (curr.x + next.x) / 2;
                const cpy2 = (curr.y + next.y) / 2;
                if (i === 1) d += ` Q${curr.x},${curr.y} ${cpx2},${cpy2}`;
                else d += ` T${cpx2},${cpy2}`;
              }
              const last = edge.points[edge.points.length - 1];
              d += ` L${last.x},${last.y}`;
            }
            pathEl.setAttribute('d', d);
            pathEl.setAttribute('fill', 'none');

            if (isFgChain) {
              // Thin dashed line for function-group chains
              pathEl.setAttribute('stroke', '#a5b4fc');
              pathEl.setAttribute('stroke-width', '1.5');
              pathEl.setAttribute('stroke-dasharray', '5 3');
              pathEl.setAttribute('marker-end', 'url(#arrowhead-fg)');
            } else {
              // Thick solid line for cable connections
              pathEl.setAttribute('stroke', '#94a3b8');
              pathEl.setAttribute('stroke-width', '2');
              pathEl.setAttribute('marker-end', 'url(#arrowhead)');
            }
            group.appendChild(pathEl);
            _gReg.allPathEls.push(pathEl);

            // Edge label
            let edgeLabelBgEl = null;
            let edgeLabelTextEls = [];
            if (edge.label) {
              // Use dagre's label position, or compute midpoint from path
              let lx = edge.x;
              let ly = edge.y;
              if (lx === undefined || ly === undefined) {
                const mid = edge.points[Math.floor(edge.points.length / 2)];
                lx = mid.x;
                ly = mid.y;
              }
              if (isFgChain) {
                // Small FG label (no background pill)
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', lx);
                text.setAttribute('y', ly + 3);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-size', '9');
                text.setAttribute('fill', '#818cf8');
                text.textContent = edge.label;
                group.appendChild(text);
              } else if (isCable) {
                // Bundled cable label: show each cable on its own line
                const cables = edge.cables || [];
                const lines = edge.label.split('\n');
                const lineHeight = 15;
                const totalHeight = lines.length * lineHeight + 8;
                const longestLine = lines.reduce((a, b) => a.length > b.length ? a : b, '');
                const totalWidth = longestLine.length * 7 + 24;

                // Background pill
                const labelBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                labelBg.setAttribute('x', lx - totalWidth / 2);
                labelBg.setAttribute('y', ly - totalHeight / 2);
                labelBg.setAttribute('width', totalWidth);
                labelBg.setAttribute('height', totalHeight);
                labelBg.setAttribute('rx', '6');
                labelBg.setAttribute('fill', '#f8fafc');
                labelBg.setAttribute('stroke', '#cbd5e1');
                labelBg.setAttribute('stroke-width', '1');
                labelBg.setAttribute('style', 'cursor:pointer');
                group.appendChild(labelBg);
                edgeLabelBgEl = labelBg;

                // Render each line
                const startY = ly - totalHeight / 2 + lineHeight;
                lines.forEach((line, lineIdx) => {
                  const textEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                  textEl.setAttribute('x', lx);
                  textEl.setAttribute('y', startY + lineIdx * lineHeight);
                  textEl.setAttribute('text-anchor', 'middle');
                  textEl.setAttribute('font-size', '10');
                  textEl.setAttribute('font-weight', '600');
                  textEl.setAttribute('fill', '#475569');
                  textEl.setAttribute('style', 'cursor:pointer');
                  textEl.textContent = line;
                  group.appendChild(textEl);
                  edgeLabelTextEls.push(textEl);

                  // Find matching cable for click handler
                  const matchingCable = cables.find(c => c.cable_name === line);
                  if (matchingCable) {
                    textEl.addEventListener('click', () => {
                      self.selectedComponent = null;
                      self.selectedFgGroup = null;
                      self.selectedCable = matchingCable;
                      self.loadCableShopInfo(matchingCable);
                    });
                  }
                });

                // Click on background opens first cable detail
                if (cables.length > 0) {
                  labelBg.addEventListener('click', () => {
                    self.selectedComponent = null;
                    self.selectedFgGroup = null;
                    self.selectedCable = cables[0];
                    self.loadCableShopInfo(cables[0]);
                  });
                }
              }

              // Tooltip with full cable details
              if (edge.cables) {
                const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                title.textContent = edge.cables.map(c =>
                  `${c.cable_name}: ${c.cable_spec}`
                ).join('\n');
                pathEl.appendChild(title);
              }
              // Tooltip for FG chain
              if (isFgChain && edge.functionGroup) {
                const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                title.textContent = `Funktionsgruppe ${edge.functionGroup}`;
                pathEl.appendChild(title);
              }
            }

            // Register cable edges for highlight/zoom
            if (isCable && edge.cables) {
              edge.cables.forEach(c => {
                _gReg.edgesByCable[c.cable_name] = { pathEl, labelBgEl: edgeLabelBgEl, labelTextEls: edgeLabelTextEls, fromNodeId: e.v, toNodeId: e.w, points: edge.points };
              });
              if (edgeLabelBgEl) _gReg.allLabelBgs.push(edgeLabelBgEl);
              edgeLabelTextEls.forEach(t => _gReg.allLabelTexts.push(t));
            }
          });

          // Draw subsystem boxes (compound nodes)
          g.nodes().forEach(nodeId => {
            const node = g.node(nodeId);
            if (!node || !node.isSubsystem) return;

            // Find bounding box of child nodes
            const children = g.children(nodeId);
            if (!children || children.length === 0) return;

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            children.forEach(childId => {
              const child = g.node(childId);
              if (child) {
                minX = Math.min(minX, child.x - child.width / 2);
                minY = Math.min(minY, child.y - child.height / 2);
                maxX = Math.max(maxX, child.x + child.width / 2);
                maxY = Math.max(maxY, child.y + child.height / 2);
              }
            });

            if (minX === Infinity) return;

            const pad = 30;
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            const color = this.SUB_COLORS[node.subIndex % this.SUB_COLORS.length];
            rect.setAttribute('x', minX - pad);
            rect.setAttribute('y', minY - pad - 24);
            rect.setAttribute('width', maxX - minX + pad * 2);
            rect.setAttribute('height', maxY - minY + pad * 2 + 24);
            rect.setAttribute('rx', '12');
            rect.setAttribute('ry', '12');
            rect.setAttribute('fill', color + '10');
            rect.setAttribute('stroke', color);
            rect.setAttribute('stroke-width', '1.5');
            rect.setAttribute('stroke-dasharray', '6 3');
            rect.setAttribute('pointer-events', 'none');
            group.appendChild(rect);

            // Subsystem label
            const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            label.setAttribute('x', minX - pad + 12);
            label.setAttribute('y', minY - pad - 6);
            label.setAttribute('font-size', '13');
            label.setAttribute('font-weight', '700');
            label.setAttribute('fill', color);
            label.setAttribute('pointer-events', 'none');
            label.textContent = node.label;
            group.appendChild(label);
          });

          // Draw component / FG-group nodes
          g.nodes().forEach(nodeId => {
            const node = g.node(nodeId);
            if (!node || node.isSubsystem || !node.component) return;

            const colors = node.colors;
            const gNode = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            gNode.setAttribute('class', 'node');
            gNode.setAttribute('transform', `translate(${node.x - node.width / 2}, ${node.y - node.height / 2})`);

            // Background rect
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('width', node.width);
            rect.setAttribute('height', node.height);
            rect.setAttribute('rx', '8');
            rect.setAttribute('ry', '8');
            rect.setAttribute('fill', colors.fill);
            rect.setAttribute('stroke', colors.stroke);
            rect.setAttribute('stroke-width', '2');
            gNode.appendChild(rect);

            // Text lines
            const lines = node.label.split('\n');
            const text1 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text1.setAttribute('x', node.width / 2);
            text1.setAttribute('y', lines.length > 1 ? 22 : 32);
            text1.setAttribute('text-anchor', 'middle');
            text1.setAttribute('font-size', '14');
            text1.setAttribute('font-weight', '700');
            text1.setAttribute('fill', colors.text);
            text1.textContent = lines[0];
            gNode.appendChild(text1);

            if (lines.length > 1) {
              const text2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
              text2.setAttribute('x', node.width / 2);
              text2.setAttribute('y', 42);
              text2.setAttribute('text-anchor', 'middle');
              text2.setAttribute('font-size', '11');
              text2.setAttribute('fill', '#64748b');
              // Truncate subtitle if too long to prevent overflow
              const maxChars = Math.floor(node.width / 6.5);
              text2.textContent = lines[1].length > maxChars ? lines[1].substring(0, maxChars - 1) + '…' : lines[1];
              gNode.appendChild(text2);
            }

            // Count badge for FG groups with multiple components
            if (node.fgGroup && node.fgGroup.components.length > 1) {
              const count = node.fgGroup.components.length;
              const badgeX = node.width - 8;
              const badgeY = -6;
              const badge = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
              badge.setAttribute('cx', badgeX);
              badge.setAttribute('cy', badgeY);
              badge.setAttribute('r', '10');
              badge.setAttribute('fill', colors.stroke);
              gNode.appendChild(badge);
              const badgeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
              badgeText.setAttribute('x', badgeX);
              badgeText.setAttribute('y', badgeY + 4);
              badgeText.setAttribute('text-anchor', 'middle');
              badgeText.setAttribute('font-size', '10');
              badgeText.setAttribute('font-weight', '700');
              badgeText.setAttribute('fill', '#fff');
              badgeText.textContent = count;
              gNode.appendChild(badgeText);
            }

            // Click handler
            gNode.addEventListener('click', () => {
              if (node.fgGroup) {
                self.selectedFgGroup = node.fgGroup;
                self.selectedComponent = null;
              } else {
                self.selectedComponent = node.component;
                self.selectedFgGroup = null;
              }
            });

            gNode.style.cursor = 'pointer';
            group.appendChild(gNode);
            _gReg.allNodeGs.push(gNode);
            _gReg.nodeById[nodeId] = { gEl: gNode, x: node.x, y: node.y, w: node.width, h: node.height };
          });

          // Auto-fit view: compute bounding box and scale to fit viewport
          this._autoFit();
        },

        highlightCable(cable) {
          const match = _gReg.edgesByCable[cable.cable_name];

          // Dim everything
          _gReg.allPathEls.forEach(el => { el.style.opacity = '0.1'; });
          _gReg.allLabelBgs.forEach(el  => { el.style.opacity = '0.1'; });
          _gReg.allLabelTexts.forEach(el => { el.style.opacity = '0.1'; });
          _gReg.allNodeGs.forEach(el    => { el.style.opacity = '0.12'; el.style.filter = ''; });

          if (!match) return;

          // Highlight the cable edge
          match.pathEl.style.opacity = '1';
          match.pathEl.style.stroke = '#e95e0f';
          match.pathEl.style.strokeWidth = '4';
          if (match.labelBgEl) {
            match.labelBgEl.style.opacity = '1';
            match.labelBgEl.style.fill = '#fff7e6';
            match.labelBgEl.style.stroke = '#e95e0f';
            match.labelBgEl.style.strokeWidth = '2';
          }
          match.labelTextEls.forEach(el => {
            el.style.opacity = '1';
            el.style.fill = '#c94e0a';
          });

          // Highlight the connected nodes
          [match.fromNodeId, match.toNodeId].forEach(nodeId => {
            const nd = _gReg.nodeById[nodeId];
            if (nd) {
              nd.gEl.style.opacity = '1';
              nd.gEl.style.filter = 'drop-shadow(0 0 10px rgba(233,94,15,0.55))';
            }
          });

          // Zoom to the cable + both endpoint nodes
          this._zoomToCable(match);
        },

        clearGraphHighlight() {
          _gReg.allPathEls.forEach(el  => { el.style.opacity = ''; el.style.stroke = ''; el.style.strokeWidth = ''; });
          _gReg.allLabelBgs.forEach(el => { el.style.opacity = ''; el.style.fill = ''; el.style.stroke = ''; el.style.strokeWidth = ''; });
          _gReg.allLabelTexts.forEach(el => { el.style.opacity = ''; el.style.fill = ''; });
          _gReg.allNodeGs.forEach(el   => { el.style.opacity = ''; el.style.filter = ''; });
        },

        _zoomToCable(match) {
          const container = document.getElementById('graphContainer');
          if (!container) return;
          const cw = container.clientWidth;
          const ch = container.clientHeight;

          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

          // Bounding box from edge path waypoints
          (match.points || []).forEach(p => {
            minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
            maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
          });

          // Include both endpoint nodes
          [match.fromNodeId, match.toNodeId].forEach(nodeId => {
            const nd = _gReg.nodeById[nodeId];
            if (nd) {
              minX = Math.min(minX, nd.x - nd.w / 2);
              minY = Math.min(minY, nd.y - nd.h / 2);
              maxX = Math.max(maxX, nd.x + nd.w / 2);
              maxY = Math.max(maxY, nd.y + nd.h / 2);
            }
          });

          if (minX === Infinity) return;

          const pad = 100;
          const newZoom = Math.min(cw / (maxX - minX + pad * 2), ch / (maxY - minY + pad * 2), 2.2);
          this.zoom = Math.max(0.15, newZoom);
          this.panX = cw / 2 - ((minX + maxX) / 2) * this.zoom;
          this.panY = ch / 2 - ((minY + maxY) / 2) * this.zoom;
        },

        _autoFit() {
          const container = document.getElementById('graphContainer');
          const svgGroup = document.getElementById('graphGroup');
          if (!container || !svgGroup) { this.resetView(); return; }

          const bbox = svgGroup.getBBox();
          if (!bbox || bbox.width === 0 || bbox.height === 0) { this.resetView(); return; }

          const cw = container.clientWidth;
          const ch = container.clientHeight;
          const padding = 40;

          const scaleX = (cw - padding * 2) / bbox.width;
          const scaleY = (ch - padding * 2) / bbox.height;
          const scale = Math.min(scaleX, scaleY, 1.2); // cap at 1.2 so it's not too zoomed in

          this.zoom = Math.max(0.15, Math.round(scale * 100) / 100);
          this.panX = padding - bbox.x * this.zoom + (cw - bbox.width * this.zoom) / 2 - padding;
          this.panY = padding - bbox.y * this.zoom + (ch - bbox.height * this.zoom) / 2 - padding;
        },
      };
    }
  </script>
</body>
