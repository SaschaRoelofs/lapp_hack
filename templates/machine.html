<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <title>Maschinenvisualisierung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lapp: { 600: '#e95e0f', 700: '#c94e0a' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }

    /* Graph styles */
    .graph-container { position: relative; overflow: hidden; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; }
    .graph-svg { cursor: grab; }
    .graph-svg:active { cursor: grabbing; }
    .graph-svg .node rect { cursor: pointer; transition: filter 0.15s; }
    .graph-svg .node rect:hover { filter: brightness(0.92); }
    .graph-svg .node text { pointer-events: none; }
    .graph-svg .edgePath path { fill: none; stroke-width: 2; }
    .graph-svg .edgeLabel text { font-size: 12px; fill: #64748b; }

    .subsystem-box { rx: 12; ry: 12; stroke-dasharray: 6 3; }

    /* Component type colors */
    .comp-motor     { fill: #dbeafe; stroke: #3b82f6; }
    .comp-sensor    { fill: #dcfce7; stroke: #22c55e; }
    .comp-protection{ fill: #fef3c7; stroke: #f59e0b; }
    .comp-controller{ fill: #ede9fe; stroke: #8b5cf6; }
    .comp-switch    { fill: #fce7f3; stroke: #ec4899; }
    .comp-transformer{ fill: #e0e7ff; stroke: #6366f1; }
    .comp-heater    { fill: #fee2e2; stroke: #ef4444; }
    .comp-assembly  { fill: #f0fdf4; stroke: #16a34a; }
    .comp-cable     { fill: #f1f5f9; stroke: #94a3b8; }

    /* Detail panel */
    .detail-panel {
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      border-radius: 1rem;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    @media (max-width: 767px) {
      .detail-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 70vh;
        border-radius: 1.25rem 1.25rem 0 0;
        z-index: 50;
        box-shadow: 0 -8px 32px rgba(15,23,42,0.18);
      }
      .detail-panel-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15,23,42,0.35);
        z-index: 49;
      }
    }

    .detail-panel-header {
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
      border-bottom: 1px solid #e2e8f0;
    }

    .detail-panel-body {
      padding: 1rem;
      display: grid;
      gap: 0.9rem;
    }

    .detail-block {
      border: 1px solid #e2e8f0;
      background: #ffffff;
      border-radius: 0.9rem;
      padding: 0.8rem 0.85rem;
    }

    .detail-grid {
      border: 1px solid #e2e8f0;
      background: #ffffff;
      border-radius: 0.9rem;
      overflow: hidden;
    }

    .detail-grid-item {
      padding: 0.7rem 0.85rem;
    }

    .detail-grid-item + .detail-grid-item {
      border-top: 1px solid #e2e8f0;
    }

    .detail-label {
      font-size: 0.675rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 0.35rem;
    }

    .detail-value {
      color: #0f172a;
      font-size: 0.9rem;
      line-height: 1.35rem;
      word-break: break-word;
    }

    .detail-muted {
      color: #64748b;
      font-size: 0.8rem;
      line-height: 1.15rem;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 5.5rem minmax(0, 1fr);
      gap: 0.5rem;
      align-items: start;
    }

    .meta-label {
      color: #6b7280;
      font-size: 0.875rem;
      line-height: 1.25rem;
    }

    .meta-value {
      min-width: 0;
      color: #111827;
      font-size: 0.875rem;
      line-height: 1.25rem;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .meta-value--nowrap {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border-radius: 999px;
      border: 1px solid #dbeafe;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 0.28rem 0.7rem;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .info-chip--amber {
      border-color: #fde68a;
      background: #fffbeb;
      color: #b45309;
    }

    .info-chip--green {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #15803d;
    }

    /* Legend */
    .legend-dot { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; display: inline-block; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen antialiased" x-data="machineViz()" x-init="init()" x-cloak>

  <!-- Header -->
  {% include '_header.html' %}

  <main class="max-w-full mx-auto px-4 py-6">

    <!-- Upload section (shown when no data) -->
    <template x-if="!graphData">
      <section class="max-w-3xl mx-auto space-y-4">

        <!-- Token input -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <div class="bg-gray-50 border-b border-gray-200 px-6 py-4">
            <h2 class="text-lg font-semibold text-gray-700">Maschine per Token laden</h2>
          </div>
          <div class="p-6">
            <p class="text-sm text-gray-500 mb-4">Token aus EPLAN oder einer früheren Sitzung eingeben.</p>
            <form @submit.prevent="if (tokenInput.trim()) { loadFromToken(tokenInput.trim()); }" class="flex gap-3">
              <input
                type="text"
                x-model="tokenInput"
                placeholder="z. B. 3f8a1b2c…"
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-lapp-600"
                spellcheck="false"
                autocomplete="off"
              >
              <button
                type="submit"
                :disabled="!tokenInput.trim() || loading"
                class="bg-lapp-600 hover:bg-lapp-700 disabled:opacity-50 text-white font-medium py-2 px-5 rounded-lg transition-colors text-sm"
              >Laden</button>
            </form>
          </div>
        </div>

        <!-- Example machine -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <div class="p-6 flex items-center justify-between">
            <div>
              <h3 class="text-sm font-semibold text-gray-700">Beispiel-Maschine</h3>
              <p class="text-xs text-gray-400 mt-0.5">Vorkonfigurierte Demo-Maschine laden</p>
            </div>
            <button
              @click="loadFromToken('example')"
              :disabled="loading"
              class="bg-gray-700 hover:bg-gray-800 disabled:opacity-50 text-white font-medium py-2 px-5 rounded-lg transition-colors text-sm"
            >Demo laden</button>
          </div>
        </div>

        <!-- Loading -->
        <div x-show="loading" class="text-center">
          <div class="inline-flex items-center gap-3 bg-blue-50 text-blue-700 px-6 py-3 rounded-lg">
            <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            <span class="font-medium" x-text="loadingMessage"></span>
          </div>
        </div>

        <!-- Error -->
        <div x-show="error" class="bg-red-50 border border-red-200 text-red-700 rounded-xl px-5 py-4 text-sm flex items-start gap-3">
          <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
          <div>
            <p class="font-semibold mb-1">Fehler beim Laden</p>
            <p x-text="error"></p>
          </div>
        </div>

      </section>
    </template>

    <!-- Main visualization (shown when data loaded) -->
    <template x-if="graphData">
      <div class="flex flex-col md:flex-row gap-4" style="height: calc(100vh - 170px);">

        <!-- Mobile: left sidebar toggle button -->
        <button @click="mobileSidebarOpen = !mobileSidebarOpen"
          class="md:hidden flex items-center gap-2 bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm font-medium text-gray-700 self-start shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          Info &amp; Filter
        </button>

        <!-- Left sidebar: Info + Legend + Subsystems -->
        <aside
          class="md:w-72 md:flex-shrink-0 md:overflow-y-auto md:flex md:flex-col"
          :class="mobileSidebarOpen ? 'fixed inset-0 z-[60] flex flex-col bg-gray-50' : 'hidden md:flex md:flex-col'"
        >
          <!-- Mobile sticky header with close button -->
          <div class="md:hidden sticky top-0 flex items-center justify-between px-4 py-3 bg-white border-b border-gray-200 flex-shrink-0 z-10">
            <span class="font-semibold text-sm text-gray-700">Info &amp; Filter</span>
            <button @click="mobileSidebarOpen = false" class="text-gray-400 hover:text-gray-700">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <!-- Scrollable content -->
          <div class="flex-1 overflow-y-auto p-4 space-y-4">
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4" x-show="graphData.data_source">
            <h3 class="font-semibold text-gray-700 mb-2 text-sm uppercase tracking-wide">Quelle</h3>
            <div class="space-y-2 text-sm" x-show="graphData.data_source">
              <div class="meta-row">
                <span class="meta-label">Snapshot</span>
                <span class="meta-value" x-text="graphData.data_source?.label"></span>
              </div>
              <div class="meta-row">
                <span class="meta-label">Import</span>
                <span class="meta-value meta-value--nowrap" x-text="formatImportedAt(graphData.data_source?.imported_at)"></span>
              </div>
              <div class="meta-row">
                <span class="meta-label">Quelle</span>
                <span class="meta-value" :title="graphData.data_source?.source_dir" x-text="graphData.data_source?.source_dir"></span>
              </div>
            </div>
          </div>

          <!-- Technical data card -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <h3 class="font-semibold text-gray-700 mb-2 text-sm uppercase tracking-wide">Projektdaten</h3>
            <div class="space-y-2 text-sm">
              <template x-if="graphData.technical_data.project_name">
                <div class="meta-row">
                  <span class="meta-label">Projekt</span>
                  <span class="meta-value" x-text="graphData.technical_data.project_name"></span>
                </div>
              </template>
              <template x-if="graphData.technical_data.export_date">
                <div class="meta-row">
                  <span class="meta-label">Export</span>
                  <span class="meta-value meta-value--nowrap" x-text="graphData.technical_data.export_date"></span>
                </div>
              </template>

            </div>
          </div>

                    <!-- Machine operation params -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <h3 class="font-semibold text-gray-700 mb-3 text-sm uppercase tracking-wide">Maschinenbetrieb</h3>
            <p class="text-xs text-gray-400 mb-3">Wird als Vorbelegung im Optimierer verwendet.</p>
            <div class="space-y-3">
              <div>
                <label class="text-xs font-medium text-gray-500 mb-1 block">Nutzungsdauer (Jahre)</label>
                <input type="number" x-model.number="machineYears" min="1" step="1"
                  class="w-full border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-lapp-600">
              </div>
              <div>
                <label class="text-xs font-medium text-gray-500 mb-1 block">Stunden / Tag</label>
                <input type="number" x-model.number="machineHoursPerDay" min="0" max="24" step="0.5"
                  class="w-full border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-lapp-600">
              </div>
              <div>
                <label class="text-xs font-medium text-gray-500 mb-1 block">Tage / Jahr</label>
                <input type="number" x-model.number="machineDaysPerYear" min="0" max="365" step="1"
                  class="w-full border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-lapp-600">
              </div>
            </div>
          </div>


          <!-- Stats -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <h3 class="font-semibold text-gray-700 mb-2 text-sm uppercase tracking-wide">Übersicht</h3>
            <div class="grid grid-cols-2 gap-2 text-sm">
              <div class="bg-blue-50 rounded-lg p-2 text-center">
                <div class="text-xl font-bold text-blue-700" x-text="graphData.components.length"></div>
                <div class="text-xs text-blue-600">Komponenten</div>
              </div>
              <div class="bg-green-50 rounded-lg p-2 text-center">
                <div class="text-xl font-bold text-green-700" x-text="graphData.connections.filter(c => c.connection_type !== 'fg_chain').length"></div>
                <div class="text-xs text-green-600">Kabel</div>
              </div>
              <div class="bg-purple-50 rounded-lg p-2 text-center">
                <div class="text-xl font-bold text-purple-700" x-text="graphData.subsystems.length"></div>
                <div class="text-xs text-purple-600">Subsysteme</div>
              </div>
              <div class="bg-indigo-50 rounded-lg p-2 text-center">
                <div class="text-xl font-bold text-indigo-700" x-text="graphData.connections.filter(c => c.connection_type === 'fg_chain').length"></div>
                <div class="text-xs text-indigo-600">FG-Ketten</div>
              </div>
            </div>
          </div>


          <!-- Legend -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <h3 class="font-semibold text-gray-700 mb-2 text-sm uppercase tracking-wide">Legende</h3>
            <div class="space-y-1 text-xs">
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#dbeafe;border-color:#3b82f6"></span> Motor / Aktor</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#dcfce7;border-color:#22c55e"></span> Sensor</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#fef3c7;border-color:#f59e0b"></span> Schutzgerät</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#ede9fe;border-color:#8b5cf6"></span> Steuerung</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#fce7f3;border-color:#ec4899"></span> Schalter / Schütz</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#e0e7ff;border-color:#6366f1"></span> Netzteil / Trafo</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#fee2e2;border-color:#ef4444"></span> Heizung</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#f0fdf4;border-color:#16a34a"></span> Baugruppe</div>
              <div class="flex items-center gap-2"><span class="legend-dot" style="background:#f1f5f9;border-color:#94a3b8"></span> Kabel</div>
              <div class="flex items-center gap-2 mt-2 pt-2 border-t border-gray-100">
                <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#64748b" stroke-width="2.5"/></svg>
                <span>Kabelverbindung</span>
              </div>
              <div class="flex items-center gap-2">
                <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="5 3"/></svg>
                <span>Funktionsgruppe</span>
              </div>
            </div>
          </div>

          <!-- Subsystem filter -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
            <h3 class="font-semibold text-gray-700 mb-2 text-sm uppercase tracking-wide">Subsysteme</h3>
            <div class="space-y-1">
              <button @click="filterSubsystem = ''; renderGraph()"
                      class="w-full text-left px-2 py-1 rounded text-sm transition-colors"
                      :class="filterSubsystem === '' ? 'bg-lapp-600 text-white' : 'hover:bg-gray-100 text-gray-700'">
                Alle anzeigen
              </button>
              <template x-for="sub in graphData.subsystems" :key="sub.name">
                <button @click="filterSubsystem = sub.name; renderGraph()"
                        class="w-full text-left px-2 py-1 rounded text-sm transition-colors flex justify-between items-center"
                        :class="filterSubsystem === sub.name ? 'bg-lapp-600 text-white' : 'hover:bg-gray-100 text-gray-700'">
                  <span x-text="sub.name_de || sub.name"></span>
                  <span class="text-xs opacity-60" x-text="sub.component_ids.length + ' / ' + (sub.cable_count || 0)"></span>
                </button>
              </template>
            </div>
          </div>

          <!-- Upload new -->
          </div><!-- end scrollable content -->
        </aside>

        <!-- Center: Graph visualization -->
        <div class="flex-1 flex flex-col gap-4 min-w-0" style="min-height: 350px;">
          <!-- Toolbar -->
          <div class="flex items-center flex-wrap gap-2">
            <button @click="zoomIn()" class="bg-white border border-gray-300 rounded-lg px-3 py-1.5 text-sm hover:bg-gray-50">
              <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            </button>
            <button @click="zoomOut()" class="bg-white border border-gray-300 rounded-lg px-3 py-1.5 text-sm hover:bg-gray-50">
              <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"/></svg>
            </button>
            <button @click="resetView()" class="bg-white border border-gray-300 rounded-lg px-3 py-1.5 text-sm hover:bg-gray-50">Reset</button>
            <div class="ml-auto flex items-center gap-2">
              <label class="text-sm text-gray-600">Ansicht:</label>
              <select x-model="viewMode" @change="selectedComponent = null; selectedFgGroup = null; selectedCable = null; renderGraph()" class="border border-gray-300 rounded-lg px-2 py-1 text-sm">
                <option value="subsystem">Funktionsgruppen</option>
                <option value="all">Alle Geräte</option>
              </select>
            </div>
          </div>

          <!-- SVG Graph -->
          <div class="graph-container flex-1" id="graphContainer" style="min-height: 300px"
               @wheel.prevent="handleWheel($event)"
               @mousedown="startPan($event)"
               @mousemove="doPan($event)"
               @mouseup="endPan()"
               @mouseleave="endPan()"
               @touchstart.prevent="handleTouchStart($event)"
               @touchmove.prevent="handleTouchMove($event)"
               @touchend.prevent="handleTouchEnd($event)">
            <svg class="graph-svg" width="100%" height="100%" id="graphSvg">
              <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                  <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
                </marker>
                <marker id="arrowhead-fg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                  <polygon points="0 0, 8 3, 0 6" fill="#a5b4fc"/>
                </marker>
              </defs>
              <g id="graphGroup" :transform="`translate(${panX},${panY}) scale(${zoom})`">
              </g>
            </svg>
          </div>

          <!-- Warnings -->
          <template x-if="graphData.warnings && graphData.warnings.length > 0">
            <div class="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2">
              <template x-for="w in graphData.warnings">
                <p class="text-sm text-amber-700" x-text="w"></p>
              </template>
            </div>
          </template>

          <!-- Error display (for render errors) -->
          <div x-show="error" class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm" x-text="error"></div>
        </div>

        <!-- Right sidebar: Component detail or FG Group detail -->
        <aside x-show="selectedComponent || selectedFgGroup || selectedCable"
          class="md:w-1/3 md:flex-shrink-0 md:min-w-72 md:overflow-y-auto">

          <!-- Cable detail panel -->
          <template x-if="selectedCable && !selectedComponent && !selectedFgGroup">
            <div>
              <div class="detail-panel-overlay md:hidden" @click="selectedCable = null; selectedCableShop = null; selectedCableShopError = ''; selectedCableShopLoading = false"></div>
              <div class="bg-white rounded-xl shadow-sm border border-gray-200 detail-panel">
              <div class="detail-panel-header px-4 py-3 flex items-start justify-between gap-3">
                <div>
                  <div class="detail-label mb-1">Kabel</div>
                  <h3 class="font-semibold text-slate-800 leading-tight" x-text="selectedCable.cable_name"></h3>
                </div>
                <button @click="selectedCable = null; selectedCableShop = null; selectedCableShopError = ''; selectedCableShopLoading = false" class="text-gray-400 hover:text-gray-600">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
              <div class="detail-panel-body text-sm">
                <div class="space-y-4">
                  <div>
                    <div class="detail-label">Identität</div>
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="info-chip" x-text="selectedCable.cable_type || 'Kabel'"></span>

                    </div>
                    <div class="detail-muted mt-2" x-text="selectedCable.cable_spec || '–'"></div>
                  </div>

                  <div class="grid grid-cols-3 gap-2 text-xs pt-4 border-t border-gray-100">
                    <div>
                      <div class="detail-label mb-1">Adern</div>
                      <div class="detail-value font-medium" x-text="selectedCable.num_cores || '–'"></div>
