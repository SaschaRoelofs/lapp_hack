        isPanning: false,
        panStart: { x: 0, y: 0 },

        // Optimizer state
        optParams: { ...DEFAULT_PARAMS },
        optOptions: [],
        optResult: null,
        optLoading: false,
        optOptionsLoading: false,
        optError: '',
        optShowPanel: true,
        optUsedWires: null,
        optEplanLength: null,
        optSettingsPrice: null,
        optSettingsVoltDrop: null,

        // Machine-level operation params (left panel, persisted)
        machineYears: DEFAULT_PARAMS.years,
        machineHoursPerDay: DEFAULT_PARAMS.hours_per_day,
        machineDaysPerYear: DEFAULT_PARAMS.days_per_year,
        optMachineYears: null,
        optMachineHoursPerDay: null,
        optMachineDaysPerYear: null,

        mobileSidebarOpen: false,

        // Cable Wizard state
        wizardOpen: false,
        wizardStepIndex: 0,
        wizardCables: [],
        wizardInputsByCable: {},
        wizardSkipByCable: {},
        wizardShopByCable: {},
        wizardShopCheckPromises: {},
        wizardShopPreloadRunning: false,
        wizardObjective: 'tco',
        wizardRunning: false,
        wizardProgress: { done: 0, total: 0 },
        wizardReport: [],
        wizardSummary: {
          total: 0,
          skipped: 0,
          changed: 0,
          unchanged: 0,
          not_optimizable: 0,
          delta_tco_total: 0,
          delta_co2_total: 0,
        },
        wizardError: '',

        // Phase 2: Cable Replacements
        replacedCables: {}, // map of cable_name -> { recommended_mm2, recommended_article_nr, timestamp }

        async markAsReplaced(cableName, current_mm2, recommended_mm2, recommended_article_nr) {
          const token = new URLSearchParams(window.location.search).get('token') || 'example';
          const rec = {
            cable_name: cableName,
            original_mm2: current_mm2,
            recommended_mm2: recommended_mm2 || null,
            recommended_article_nr: recommended_article_nr || null,
            reason: 'optimizer_manual'
          };
          
          try {
            const res = await fetch(`/api/machine-db/${encodeURIComponent(token)}/replacements`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify([rec])
            });
            if (!res.ok) throw new Error('Replace failed');
            
            // Assuming successful
            this.replacedCables = { ...this.replacedCables, [cableName]: rec };
            this.$nextTick(() => { if (typeof this.renderGraph === 'function') this.renderGraph(); });
          } catch (e) {
            console.error('Failed to save replacement:', e);
            alert('Failed to mark as replaced. Please try again.');
          }
        },

        async replaceBulk(cablesToReplace) {
          const token = new URLSearchParams(window.location.search).get('token') || 'example';
          
          try {
            const payload = cablesToReplace.map(c => ({
              cable_name: c.cableName,
              original_mm2: c.original_mm2,
              recommended_mm2: c.recommended_mm2,
              recommended_article_nr: c.recommended_article_nr,
              reason: 'wizard_bulk'
            }));

            const res = await fetch(`/api/machine-db/${encodeURIComponent(token)}/replacements`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('Bulk replace failed');
            
            let newMap = { ...this.replacedCables };
            payload.forEach(r => {
              newMap[r.cable_name] = r;
            });
            this.replacedCables = newMap;
            this.$nextTick(() => { if (typeof this.renderGraph === 'function') this.renderGraph(); });
          } catch (e) {
            console.error('Failed to bulk save replacements:', e);
            alert('Failed to mark cables as replaced.');
          }
        },

        // Type color mapping
        TYPE_COLORS: {
          motor:       { fill: '#dbeafe', stroke: '#3b82f6', text: '#1e40af' },
          sensor:      { fill: '#dcfce7', stroke: '#22c55e', text: '#166534' },
          protection:  { fill: '#fef3c7', stroke: '#f59e0b', text: '#92400e' },
          controller:  { fill: '#ede9fe', stroke: '#8b5cf6', text: '#5b21b6' },
          switch:      { fill: '#fce7f3', stroke: '#ec4899', text: '#9d174d' },
          transformer: { fill: '#e0e7ff', stroke: '#6366f1', text: '#3730a3' },
          heater:      { fill: '#fee2e2', stroke: '#ef4444', text: '#991b1b' },
          assembly:    { fill: '#f0fdf4', stroke: '#16a34a', text: '#166534' },
          cable:       { fill: '#f1f5f9', stroke: '#94a3b8', text: '#334155' },
        },

        TYPE_LABELS: {
          motor: 'Motor / Aktor',
          sensor: 'Sensor',
          protection: 'Schutzgerät',
          controller: 'Steuerung',
          switch: 'Schalter / Schütz',
          transformer: 'Netzteil',
          heater: 'Heizung',
          assembly: 'Baugruppe',
          cable: 'Kabel',
        },

        // Subsystem color palette
        SUB_COLORS: [
          '#3b82f6', '#22c55e', '#f59e0b', '#8b5cf6', '#ec4899',
          '#6366f1', '#ef4444', '#14b8a6', '#f97316', '#06b6d4',
          '#84cc16', '#a855f7', '#e11d48', '#0891b2', '#65a30d',
          '#7c3aed', '#dc2626', '#0d9488', '#ea580c', '#2563eb',
          '#16a34a', '#d97706',
        ],

        typeColorClass(type) {
          const map = {
            motor: 'bg-blue-100 text-blue-800',
            sensor: 'bg-green-100 text-green-800',
            protection: 'bg-amber-100 text-amber-800',
            controller: 'bg-violet-100 text-violet-800',
            switch: 'bg-pink-100 text-pink-800',
            transformer: 'bg-indigo-100 text-indigo-800',
            heater: 'bg-red-100 text-red-800',
            assembly: 'bg-emerald-100 text-emerald-800',
            cable: 'bg-slate-100 text-slate-800',
          };
          return map[type] || 'bg-gray-100 text-gray-800';
        },

        async init() {
          // Load machine operation params from localStorage
          const ms = JSON.parse(localStorage.getItem('lapp_machine_ops') || '{}');
          if (ms.years !== undefined) this.machineYears = ms.years;
          if (ms.hours_per_day !== undefined) this.machineHoursPerDay = ms.hours_per_day;
          if (ms.days_per_year !== undefined) this.machineDaysPerYear = ms.days_per_year;
          // Watchers: persist + push to open optimizer in real-time
          this.$watch('machineYears', (v) => { this._saveMachineOps(); if (this.selectedCable) { this.optParams.years = v; this.optMachineYears = v; } });
          this.$watch('machineHoursPerDay', (v) => { this._saveMachineOps(); if (this.selectedCable) { this.optParams.hours_per_day = v; this.optMachineHoursPerDay = v; } });
          this.$watch('machineDaysPerYear', (v) => { this._saveMachineOps(); if (this.selectedCable) { this.optParams.days_per_year = v; this.optMachineDaysPerYear = v; } });
          this.$watch('selectedCable', (cable) => {
            if (cable) this.$nextTick(() => this.highlightCable(cable));
            else if (!this.wizardOpen) this.clearGraphHighlight();
          });
          this.$watch('wizardOpen', (isOpen) => {
            if (isOpen && this.wizardIsCableStep()) {
              const c = this.wizardCurrentCable;
              if (c) this.$nextTick(() => this.highlightCable(c));
            } else if (!isOpen && !this.selectedCable) {
              this.clearGraphHighlight();
            }
          });
          this.$watch('wizardStepIndex', () => {
            if (this.wizardOpen) {
              if (this.wizardIsCableStep()) {
                const c = this.wizardCurrentCable;
                if (c) this.$nextTick(() => this.highlightCable(c));
              } else {
                this.clearGraphHighlight();
              }
            }
          });

          const token = new URLSearchParams(window.location.search).get('token');
          if (token) {
            await this.loadFromToken(token);
          } else {
            await this.loadDatabaseGraph();
          }
        },

        formatImportedAt(value) {
          if (!value) return '';
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return value;
          return date.toLocaleString('de-DE', {
            dateStyle: 'short',
            timeStyle: 'short',
          });
        },

        typeLabel(type) {
          return this.TYPE_LABELS[type] || type || 'Unbekannt';
        },

        _emptyWizardSummary() {
          return {
            total: 0,
            skipped: 0,
            changed: 0,
            unchanged: 0,
            not_optimizable: 0,
            delta_tco_total: 0,
            delta_co2_total: 0,
          };
        },

        _wizardResetState() {
          this.wizardOpen = false;
          this.wizardStepIndex = 0;
          this.wizardCables = [];
          this.wizardInputsByCable = {};
          this.wizardSkipByCable = {};
          this.wizardShopByCable = {};
          this.wizardShopCheckPromises = {};
          this.wizardObjective = 'tco';
          this.wizardRunning = false;
          this.wizardProgress = { done: 0, total: 0 };
          this.wizardReport = [];
          this.wizardSummary = this._emptyWizardSummary();
          this.wizardError = '';
        },

        wizardShouldRecommendSkip(cable) {
          const txt = [cable?.cable_type, cable?.cable_name, cable?.cable_spec]
            .filter(Boolean)
            .join(' ')
            .toLowerCase();

          if (!txt) return false;

          const keywordMatches = [
            'patchkabel',
            'patch cable',
            'datenkabel',
            'data cable',
            'datenleitung',
            'ethernet',
            'profinet',
            'fieldbus',
            'bus cable',
          ].some(k => txt.includes(k));

          const catMatch = /\bcat[\s-]?[5-8]\b/.test(txt);
          return keywordMatches || catMatch;
        },

        wizardCurrentCableShouldSkip() {
          return this.wizardShouldRecommendSkip(this.wizardCurrentCable);
        },

        wizardCurrentSkipReason() {
          if (!this.wizardCurrentCableShouldSkip()) return '';
          return 'Empfehlung: Dieses Kabel wirkt wie ein Patch- oder Datenkabel. Bitte auf Überspringen klicken.';
        },

        wizardIsCurrentCableSkipped() {
          const key = this.wizardCurrentCableKey;
          if (!key) return false;
          return !!this.wizardSkipByCable[key];
        },

        _wizardShopStateForCable(cable) {
          const key = cable?._wizard_key;
          if (!key) return { status: 'unknown', reason: '' };
          return this.wizardShopByCable[key] || { status: 'unknown', reason: '' };
        },

        wizardCurrentCableShopState() {
          return this._wizardShopStateForCable(this.wizardCurrentCable);
        },

        wizardCurrentCableShopIsChecking() {
          const status = this.wizardCurrentCableShopState().status;
          return this.wizardShopPreloadRunning || status === 'unknown' || status === 'checking';
        },

        wizardCurrentCableCanOptimize() {
          return this.wizardCurrentCableShopState().status === 'found';
        },

        wizardCurrentCableOnlySkippable() {
          const status = this.wizardCurrentCableShopState().status;
          return status === 'missing' || status === 'no_article' || status === 'error';
        },

        wizardCurrentCableShopSkipMessage() {
          const state = this.wizardCurrentCableShopState();
          if (state.status === 'no_article') {
            return 'Dieses Kabel hat keine SAP-/Artikelnummer und kann im LAPP Shop nicht geprüft werden. Bitte überspringen.';
          }
          if (state.status === 'missing') {
            return 'Dieses Kabel wurde im LAPP Shop nicht gefunden und kann hier nur übersprungen werden.';
          }
          if (state.status === 'error') {
            return state.reason || 'Die Shop-Prüfung ist fehlgeschlagen. Bitte dieses Kabel überspringen.';
          }
          return '';
        },

        async wizardEnsureShopInfoForCable(cable) {
          const key = cable?._wizard_key;
          if (!key) return { status: 'unknown', reason: '' };

          const existing = this._wizardShopStateForCable(cable);
          if (existing.status !== 'unknown' && existing.status !== 'checking') {
            return existing;
          }

          if (this.wizardShopCheckPromises[key]) {
            return await this.wizardShopCheckPromises[key];
          }

          const articleNumber = this._wizardNormalizeArticleNumber(cable?.sap_number || cable?.article_part_nr || '');
          if (!articleNumber) {
            const noArticle = {
              status: 'no_article',
              reason: 'Keine SAP-/Artikelnummer vorhanden.',
            };
            this.wizardShopByCable[key] = noArticle;
            return noArticle;
          }

          this.wizardShopByCable[key] = { status: 'checking', reason: '' };

          const checkPromise = (async () => {
            const maxRetries = 3;
            for (let attempt = 0; attempt <= maxRetries; attempt++) {
              try {
                const resp = await fetch(`/api/shop/variant/${encodeURIComponent(articleNumber)}`);
                if (resp.status === 404) {
                  const notFound = {
                    status: 'missing',
                    reason: 'Nicht im LAPP Shop gefunden.',
                  };
                  this.wizardShopByCable[key] = notFound;
                  return notFound;
                }

                if (!resp.ok) {
                  // Retry on transient server errors (502, 503, 429)
                  if (attempt < maxRetries && (resp.status >= 500 || resp.status === 429)) {
                    await new Promise(r => setTimeout(r, 800 * (attempt + 1)));
                    continue;
                  }
                  const failed = {
                    status: 'error',
                    reason: `Shop-Prüfung fehlgeschlagen (${resp.status}).`,
                  };
                  this.wizardShopByCable[key] = failed;
                  return failed;
                }

                const variant = await resp.json();
                const baseProductCode = variant?.base_product_code || '';
                if (!baseProductCode) {
                  const notFound = {
                    status: 'missing',
                    reason: 'Kein Shop-Produkt gefunden.',
                  };
                  this.wizardShopByCable[key] = notFound;
                  return notFound;
                }

                const found = {
                  status: 'found',
                  reason: '',
                  base_product_code: baseProductCode,
                };
                this.wizardShopByCable[key] = found;
                return found;
              } catch (_e) {
                if (attempt < maxRetries) {
                  await new Promise(r => setTimeout(r, 800 * (attempt + 1)));
                  continue;
                }
                const failed = {
                  status: 'error',
                  reason: 'Shop-Prüfung fehlgeschlagen.',
                };
                this.wizardShopByCable[key] = failed;
                return failed;
              }
            }
          })().finally(() => { delete this.wizardShopCheckPromises[key]; });

          this.wizardShopCheckPromises[key] = checkPromise;
          return await checkPromise;
        },

        wizardEnsureCurrentCableShopCheck() {
          if (!this.wizardIsCableStep()) return;
          const cable = this.wizardCurrentCable;
          if (!cable) return;
          this.wizardEnsureShopInfoForCable(cable);
        },

        async wizardPrimeShopChecks() {
          this.wizardShopByCable = {};
          this.wizardShopCheckPromises = {};
          for (const cable of this.wizardCables) {
            this.wizardShopByCable[cable._wizard_key] = { status: 'checking', reason: '' };
          }

          if (this.wizardCables.length === 0) return;

          const items = this.wizardCables.map(cable => ({
            wizard_key: cable._wizard_key,
            article_code: cable?.sap_number || cable?.article_part_nr || '',
          }));

          try {
            const resp = await fetch('/api/shop/variants/resolve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ items }),
            });

            if (!resp.ok) {
              throw new Error(`Shop preload fehlgeschlagen (${resp.status}).`);
            }

            const data = await resp.json();
            const results = Array.isArray(data?.results) ? data.results : [];
            const byKey = new Map(results.map(r => [r.wizard_key, r]));

            for (const cable of this.wizardCables) {
              const key = cable._wizard_key;
              const row = byKey.get(key);
              if (!row) {
                this.wizardShopByCable[key] = {
                  status: 'error',
                  reason: 'Kein Ergebnis vom Shop-Resolver erhalten.',
                };
                continue;
              }
              this.wizardShopByCable[key] = {
                status: row.status || 'error',
                reason: row.reason || '',
                base_product_code: row.base_product_code || '',
                article_number: row.article_number || '',
              };
            }
            return;
          } catch (_err) {
            // Fallback: resolve cables sequentially to avoid rate limiting.
            for (const cable of this.wizardCables) {
              await this.wizardEnsureShopInfoForCable(cable);
            }
          }
        },

        _wizardNormalizeArticleNumber(raw) {
          return String(raw || '').replace(/^lapp\.?\s*/i, '').trim();
        },

        _wizardDefaultInputForCable(cable) {
          const loadedRaw = cable?.used_wires ?? cable?.num_cores;
          const loadedParsed = parseInt(loadedRaw, 10);
          const lengthParsed = Number(cable?.length_m);

          return {
            current_a: null,
            system_voltage_v: null,
            length_m: Number.isFinite(lengthParsed) && lengthParsed > 0 ? lengthParsed : null,
            loaded_cores: Number.isFinite(loadedParsed) && loadedParsed >= 1 ? loadedParsed : 1,
            ac_3phase: false,
          };
        },

        _wizardCableList() {
          if (!this.graphData?.connections) return [];
          const dedup = new Map();

          for (const c of this.graphData.connections) {
            if (c.connection_type !== 'cable') continue;
            const cableName = (c.cable_name || '').trim();
            const key = cableName || [c.from_location || '', c.to_location || '', c.sap_number || '', c.cable_spec || ''].join('|');
            if (!dedup.has(key)) {
              dedup.set(key, {
                ...c,
                _wizard_key: key,
                cable_name: cableName || key,
              });
            }
          }

          return Array.from(dedup.values()).sort((a, b) => {
            const aName = String(a.cable_name || '');
            const bName = String(b.cable_name || '');
            return aName.localeCompare(bName, 'de');
          });
        },

        _wizardGlobalParams() {
          const settings = JSON.parse(localStorage.getItem('lapp_settings') || '{}');
          return {
            years: Number(this.machineYears) || DEFAULT_PARAMS.years,
            days_per_year: Number(this.machineDaysPerYear) || DEFAULT_PARAMS.days_per_year,
            hours_per_day: Number(this.machineHoursPerDay) || DEFAULT_PARAMS.hours_per_day,
            energy_price_eur_per_kwh: settings.energy_price_eur_per_kwh !== undefined ? Number(settings.energy_price_eur_per_kwh) : DEFAULT_PARAMS.energy_price_eur_per_kwh,
            electricity_emission_factor_kg_per_kwh: settings.electricity_emission_factor_kg_per_kwh !== undefined ? Number(settings.electricity_emission_factor_kg_per_kwh) : DEFAULT_PARAMS.electricity_emission_factor_kg_per_kwh,
            copper_emission_factor_kg_per_kg: settings.copper_emission_factor_kg_per_kg !== undefined ? Number(settings.copper_emission_factor_kg_per_kg) : DEFAULT_PARAMS.copper_emission_factor_kg_per_kg,
            max_voltage_drop_percent: settings.max_voltage_drop_percent !== undefined ? Number(settings.max_voltage_drop_percent) : DEFAULT_PARAMS.max_voltage_drop_percent,
          };
        },

        get wizardCurrentCable() {
          return this.wizardIsCableStep() ? this.wizardCables[this.wizardStepIndex] : null;
        },

        get wizardCurrentCableKey() {
          return this.wizardCurrentCable?._wizard_key || '';
        },

        wizardDisplayTotalSteps() {
          return this.wizardCables.length + 2;
        },

        wizardDisplayStep() {
          return Math.min(this.wizardStepIndex + 1, this.wizardDisplayTotalSteps());
        },

        wizardStepLabel() {
          if (this.wizardIsCableStep()) {
            return 'Kabel ' + (this.wizardStepIndex + 1);
          }
          if (this.wizardIsObjectiveStep()) {
            return 'Zielauswahl';
          }
          return 'Ergebnis';
        },

        wizardProgressPercent() {
          const total = this.wizardDisplayTotalSteps();
          if (total <= 0) return 0;
          return Math.max(0, Math.min(100, Math.round((this.wizardDisplayStep() / total) * 100)));
        },

        wizardIsCableStep() {
          return this.wizardStepIndex < this.wizardCables.length;
        },

        wizardIsObjectiveStep() {
          return this.wizardStepIndex === this.wizardCables.length;
        },

        wizardIsResultStep() {
          return this.wizardStepIndex === this.wizardCables.length + 1;
        },

        wizardCurrentStepValid() {
          if (!this.wizardIsCableStep()) return true;
          if (this.wizardIsCurrentCableSkipped()) return true;
          if (!this.wizardCurrentCableCanOptimize()) return false;
          const key = this.wizardCurrentCableKey;
          const input = this.wizardInputsByCable[key];
          if (!input) return false;

          const current = Number(input.current_a);
          const voltage = Number(input.system_voltage_v);
          const length = Number(input.length_m);
          const cores = parseInt(input.loaded_cores, 10);
          return Number.isFinite(current) && current > 0
            && Number.isFinite(voltage) && voltage > 0
            && Number.isFinite(length) && length > 0
            && Number.isFinite(cores) && cores >= 1;
        },

        async startCableWizard() {
          if (!this.graphData) return;

          this.selectedComponent = null;
          this.selectedFgGroup = null;
          this.selectedCable = null;
          this.selectedCableShop = null;
          this.selectedCableShopError = '';
          this.selectedCableShopLoading = false;

          this._wizardResetState();
          this.wizardCables = this._wizardCableList();
          this.wizardInputsByCable = {};
          this.wizardSkipByCable = {};
          this.wizardCables.forEach(cable => {
            this.wizardInputsByCable[cable._wizard_key] = this._wizardDefaultInputForCable(cable);
            this.wizardSkipByCable[cable._wizard_key] = false;
          });
          this.wizardStepIndex = this.wizardCables.length > 0 ? 0 : this.wizardCables.length;
          this.wizardOpen = true;
          this.wizardShopPreloadRunning = true;
          await this.wizardPrimeShopChecks();
          this.wizardShopPreloadRunning = false;
          this.wizardEnsureCurrentCableShopCheck();
        },

        closeCableWizard() {
          this._wizardResetState();
        },

        restartCableWizard() {
          this.wizardRunning = false;
          this.wizardError = '';
          this.wizardReport = [];
          this.wizardSummary = this._emptyWizardSummary();
          this.wizardProgress = { done: 0, total: 0 };
          this.wizardCables.forEach(cable => {
            this.wizardSkipByCable[cable._wizard_key] = false;
          });
          this.wizardStepIndex = this.wizardCables.length > 0 ? 0 : this.wizardCables.length;
          this.wizardEnsureCurrentCableShopCheck();
        },

        wizardPrevStep() {
          if (this.wizardRunning) return;
          this.wizardStepIndex = Math.max(0, this.wizardStepIndex - 1);
          this.wizardEnsureCurrentCableShopCheck();
        },

        wizardSetCurrentCableSkip(skip) {
          const key = this.wizardCurrentCableKey;
          if (!key) return;
          this.wizardSkipByCable[key] = !!skip;
        },

        wizardSkipCurrentCableAndNext() {
          if (this.wizardRunning || !this.wizardIsCableStep()) return;
          this.wizardSetCurrentCableSkip(true);
          this.wizardStepIndex = Math.min(this.wizardStepIndex + 1, this.wizardCables.length);
          this.wizardEnsureCurrentCableShopCheck();
        },

        wizardNextStep() {
          if (this.wizardRunning || !this.wizardIsCableStep() || !this.wizardCurrentStepValid()) return;
          // "Weiter" means this cable should be processed, not skipped.
          this.wizardSetCurrentCableSkip(false);
          this.wizardStepIndex = Math.min(this.wizardStepIndex + 1, this.wizardCables.length);
          this.wizardEnsureCurrentCableShopCheck();
        },

        wizardStatusLabel(status) {
          const map = {
            skipped: 'Übersprungen',
            changed: 'Geändert',
            unchanged: 'Unverändert',
            no_baseline: 'Kein Ist-Wert',
            no_admissible: 'Keine zulässige Option',
            no_options: 'Keine Optionen',
            error: 'Fehler',
          };
          return map[status] || status || 'Unbekannt';
        },

        wizardStatusClass(status) {
          const map = {
            skipped: 'bg-amber-100 text-amber-800 border border-amber-200',
            changed: 'bg-emerald-100 text-emerald-800 border border-emerald-200',
            unchanged: 'bg-blue-100 text-blue-800 border border-blue-200',
            no_baseline: 'bg-amber-100 text-amber-800 border border-amber-200',
            no_admissible: 'bg-rose-100 text-rose-800 border border-rose-200',
            no_options: 'bg-rose-100 text-rose-800 border border-rose-200',
            error: 'bg-red-100 text-red-800 border border-red-200',
          };
          return map[status] || 'bg-slate-100 text-slate-700 border border-slate-200';
        },

        _wizardFindBaselineRow(rows, originalMm2) {
          const installed = Number(originalMm2);
          if (!Number.isFinite(installed)) return null;
          return rows.find(r => Math.abs(Number(r.cross_section_mm2) - installed) < 1e-9) || null;
        },

        _wizardFilterOptions(options, params, cable) {
          // Check if the original cable has a protective conductor (G) or not (X)
          const hasProtConductor = cable?.has_protective_conductor;
          return options.filter(o => {
            const cores = parseInt(o.num_cores, 10);
            if (!isNaN(cores) && cores < params.loaded_cores) return false;
            if (o.ampacity_a != null && params.current_a > 0 && Number(o.ampacity_a) < params.current_a) return false;
            // Filter by protective conductor: if original cable has G, only allow G variants and vice versa
            if (hasProtConductor !== null && hasProtConductor !== undefined && o.protective_conductor != null) {
              const pcVal = String(o.protective_conductor).trim().toLowerCase();
              if (pcVal) {
                const optionHasPC = (pcVal === 'ja' || pcVal === 'yes' || pcVal === 'g');
                if (hasProtConductor && !optionHasPC) return false;
                if (!hasProtConductor && optionHasPC) return false;
              }
            }
            return true;
          });
        },

        async _wizardFetchVariant(articleNumber, variantCache) {
          const normalized = this._wizardNormalizeArticleNumber(articleNumber);
          if (!normalized) return null;
          if (variantCache.has(normalized)) return variantCache.get(normalized);

          try {
            const resp = await fetch(`/api/shop/variant/${encodeURIComponent(normalized)}`);
            if (!resp.ok) {
              variantCache.set(normalized, null);
              return null;
            }
            const data = await resp.json();
            variantCache.set(normalized, data);
            return data;
          } catch (_err) {
            variantCache.set(normalized, null);
            return null;
          }
        },

        async _wizardFetchOptions(baseProductCode, optionsCache) {
          if (!baseProductCode) return [];
          if (optionsCache.has(baseProductCode)) return optionsCache.get(baseProductCode);

          try {
            const resp = await fetch('/api/shop/product/' + encodeURIComponent(baseProductCode) + '/cable-options-direct');
            if (!resp.ok) {
              optionsCache.set(baseProductCode, []);
              return [];
            }
            const data = await resp.json();
            const safeOpts = Array.isArray(data) ? data : (data.options || []);
            optionsCache.set(baseProductCode, safeOpts);
            return safeOpts;
          } catch (_err) {
            optionsCache.set(baseProductCode, []);
            return [];
          }
        },

        async _wizardResolveOptionsForCable(cable, variantCache, optionsCache) {
          const shopState = this._wizardShopStateForCable(cable);
          let baseProductCode = shopState.base_product_code || '';
          if (!baseProductCode) {
            const variant = await this._wizardFetchVariant(cable?.sap_number || cable?.article_part_nr || '', variantCache);
            baseProductCode = variant?.base_product_code || '';
          }
          if (!baseProductCode) {
            return { options: [], usedFallback: false };
          }

          const shopOptions = await this._wizardFetchOptions(baseProductCode, optionsCache);
          if (!shopOptions || shopOptions.length === 0) {
            return { options: [], usedFallback: false };
          }
          return { options: shopOptions, usedFallback: false };
        },

        _wizardBuildParams(input) {
          const global = this._wizardGlobalParams();
          return {
            length_m: Number(input.length_m),
            current_a: Number(input.current_a),
            loaded_cores: parseInt(input.loaded_cores, 10),
            years: global.years,
            days_per_year: global.days_per_year,
            hours_per_day: global.hours_per_day,
            energy_price_eur_per_kwh: global.energy_price_eur_per_kwh,
            electricity_emission_factor_kg_per_kwh: global.electricity_emission_factor_kg_per_kwh,
            copper_emission_factor_kg_per_kg: global.copper_emission_factor_kg_per_kg,
            max_voltage_drop_percent: global.max_voltage_drop_percent,
            system_voltage_v: Number(input.system_voltage_v),
            ac_3phase: !!input.ac_3phase,
          };
        },

        _wizardBuildSkippedReportRow(cable, shopInfo = null) {
          const recommended = this.wizardShouldRecommendSkip(cable);
          const resolvedShopInfo = shopInfo || this._wizardShopStateForCable(cable);
          let reason = 'Vom Nutzer übersprungen.';

          if (resolvedShopInfo.status === 'no_article') {
            reason = 'Vom Nutzer übersprungen (keine SAP-/Artikelnummer vorhanden).';
          } else if (resolvedShopInfo.status === 'missing') {
            reason = 'Vom Nutzer übersprungen (nicht im LAPP Shop gefunden).';
          } else if (resolvedShopInfo.status === 'error') {
            reason = 'Vom Nutzer übersprungen (Shop-Prüfung fehlgeschlagen).';
          } else if (recommended) {
            reason = 'Vom Nutzer übersprungen (empfohlen für Patch-/Datenkabel).';
          }

          return {
            report_key: cable._wizard_key || cable.cable_name || [cable.from_location || '', cable.to_location || '', cable.sap_number || ''].join('|'),
            cable_name: cable.cable_name || 'Unbenanntes Kabel',
            sap_number: cable.sap_number || '',
            original_mm2: cable.cross_section_mm2 ?? null,
            recommended_mm2: null,
            status: 'skipped',
            reason,
            tco_before: null,
            tco_after: null,
            delta_tco: null,
            co2_before: null,
            co2_after: null,
            delta_co2: null,
          };
        },

        async _wizardOptimizeCable(cable, variantCache, optionsCache) {
          const input = this.wizardInputsByCable[cable._wizard_key] || this._wizardDefaultInputForCable(cable);
          const params = this._wizardBuildParams(input);
          const objectiveKey = this.wizardObjective === 'co2' ? 'co2' : 'tco';
          const baseRow = {
            report_key: cable._wizard_key || cable.cable_name || [cable.from_location || '', cable.to_location || '', cable.sap_number || ''].join('|'),
            cable_name: cable.cable_name || 'Unbenanntes Kabel',
            sap_number: cable.sap_number || '',
            original_mm2: cable.cross_section_mm2 ?? null,
            recommended_mm2: null,
            status: 'error',
            reason: '',
            tco_before: null,
            tco_after: null,
            delta_tco: null,
            co2_before: null,
            co2_after: null,
            delta_co2: null,
          };

          const resolved = await this._wizardResolveOptionsForCable(cable, variantCache, optionsCache);
          const allShopOptions = resolved.options || [];
          const filteredOptions = this._wizardFilterOptions(allShopOptions, params, cable);
          if (filteredOptions.length === 0) {
            return {
              ...baseRow,
              status: 'no_options',
              reason: 'Keine passenden Kabelvarianten für die Eingaben.',
            };
          }

          try {
            const resp = await fetch('/api/calculate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ params, options: filteredOptions }),
            });
            if (!resp.ok) {
              const errText = await resp.text();
              throw new Error(errText || 'Berechnung fehlgeschlagen.');
            }

            const result = await resp.json();
            const rows = result?.rows || [];
            const recommended = result?.optimum?.[objectiveKey] || null;
            if (!recommended) {
              return {
                ...baseRow,
                status: 'no_admissible',
                reason: 'Keine zulässige Variante gefunden.',
              };
            }

            const baseline = this._wizardFindBaselineRow(rows, cable.cross_section_mm2);
            if (!baseline) {
              return {
                ...baseRow,
                recommended_mm2: recommended.cross_section_mm2 ?? null,
                status: 'no_baseline',
                reason: 'Kein Referenzwert für den verbauten Querschnitt.',
                tco_after: recommended.tco_eur ?? null,
                co2_after: recommended.co2_total_kg ?? null,
              };
            }

            const changed = Number(recommended.cross_section_mm2) !== Number(baseline.cross_section_mm2);
            const matchingOption = allShopOptions.find(o => Number(o.cross_section_mm2) === Number(recommended.cross_section_mm2));
            return {
              ...baseRow,
              original_mm2: baseline.cross_section_mm2 ?? baseRow.original_mm2,
              recommended_mm2: recommended.cross_section_mm2 ?? null,
              recommended_article_nr: matchingOption?.article_number || null,
              status: changed ? 'changed' : 'unchanged',
              reason: changed ? 'Optimierungspotenzial erkannt.' : 'Verbaute Variante bereits optimal.',
              tco_before: baseline.tco_eur ?? null,
              tco_after: recommended.tco_eur ?? null,
              delta_tco: (baseline.tco_eur != null && recommended.tco_eur != null) ? (recommended.tco_eur - baseline.tco_eur) : null,
              co2_before: baseline.co2_total_kg ?? null,
              co2_after: recommended.co2_total_kg ?? null,
              delta_co2: (baseline.co2_total_kg != null && recommended.co2_total_kg != null) ? (recommended.co2_total_kg - baseline.co2_total_kg) : null,
            };
          } catch (e) {
            return {
              ...baseRow,
              status: 'error',
              reason: 'Fehler bei der Berechnung: ' + (e.message || 'Unbekannter Fehler'),
            };
          }
        },

        async runCableWizardOptimization() {
          if (this.wizardRunning) return;

          this.wizardStepIndex = this.wizardCables.length + 1;
          this.wizardRunning = true;
          this.wizardError = '';
          this.wizardReport = [];
          this.wizardSummary = this._emptyWizardSummary();
          this.wizardProgress = { done: 0, total: this.wizardCables.length };

          if (this.wizardCables.length === 0) {
            this.wizardRunning = false;
            this.wizardError = 'Keine Kabelverbindungen gefunden.';
            return;
          }

          const variantCache = new Map();
          const optionsCache = new Map();
          const report = [];

          for (const cable of this.wizardCables) {
            const shopInfo = await this.wizardEnsureShopInfoForCable(cable);
            if (this.wizardSkipByCable[cable._wizard_key]) {
              report.push(this._wizardBuildSkippedReportRow(cable, shopInfo));
              this.wizardProgress.done += 1;
              continue;
            }
            if (shopInfo.status !== 'found') {
              report.push(this._wizardBuildSkippedReportRow(cable, shopInfo));
              this.wizardProgress.done += 1;
              continue;
            }
            const row = await this._wizardOptimizeCable(cable, variantCache, optionsCache);
            report.push(row);
            this.wizardProgress.done += 1;
          }

          const summary = report.reduce((acc, row) => {
            acc.total += 1;
            if (row.status === 'skipped') {
              acc.skipped += 1;
            } else if (row.status === 'changed') {
              acc.changed += 1;
            } else if (row.status === 'unchanged') {
              acc.unchanged += 1;
            } else {
              acc.not_optimizable += 1;
            }
            if (row.delta_tco != null) acc.delta_tco_total += row.delta_tco;
            if (row.delta_co2 != null) acc.delta_co2_total += row.delta_co2;
            return acc;
          }, this._emptyWizardSummary());

          this.wizardReport = report;
          this.wizardSummary = summary;
          this.wizardRunning = false;
        },

        applyWizardResults() {
          if (!this.graphData || !this.wizardReport) return;
          
          let changedCount = 0;
          const reportMap = new Map();
          const toReplace = [];
          this.wizardReport.forEach(r => {
            if (r.status === 'changed' && r.recommended_mm2 != null) {
              reportMap.set(r.cable_name, r);
              toReplace.push({
                cableName: r.cable_name,
                original_mm2: r.original_mm2,
                recommended_mm2: r.recommended_mm2,
                recommended_article_nr: r.recommended_article_nr || null,
              });
            }
          });
          
          this.graphData.connections.forEach(c => {
            if (c.connection_type === 'cable' && reportMap.has(c.cable_name)) {
              c.cross_section_mm2 = reportMap.get(c.cable_name).recommended_mm2;
              changedCount++;
            }
          });
          
          if (changedCount > 0) {
            this.clearGraphHighlight();
            if (typeof this.renderGraph === 'function') {
              this.renderGraph();
            }
            // Persist replacements to backend
            if (toReplace.length > 0) {
              this.replaceBulk(toReplace);
            }
            alert(`${changedCount} Kabelverbindungen wurden in der Maschine aktualisiert.`);
          }
          this.closeCableWizard();
        },

        exportWizardCSV() {
          if (!this.wizardReport || this.wizardReport.length === 0) return;
          const header = ['Kabel', 'SAP', 'Ist mm2', 'Neu mm2', 'Status', 'Delta TCO EUR', 'Delta CO2 kg', 'Hinweis'];
          const rows = this.wizardReport.map(r => {
            return [
              `"${(r.cable_name || '').replace(/"/g, '""')}"`,
              `"${(r.sap_number || '').replace(/"/g, '""')}"`,
              r.original_mm2 != null ? r.original_mm2 : '',
              r.recommended_mm2 != null ? r.recommended_mm2 : '',
              `"${(this.wizardStatusLabel(r.status) || '').replace(/"/g, '""')}"`,
              r.delta_tco != null ? r.delta_tco.toFixed(2) : '',
              r.delta_co2 != null ? r.delta_co2.toFixed(2) : '',
              `"${(r.reason || '').replace(/"/g, '""')}"`
            ].join(';');
          });
          
          const csvContent = [header.join(';'), ...rows].join('\r\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.setAttribute('href', url);
          link.setAttribute('download', `Kabeloptimierung_${new Date().toISOString().slice(0, 10)}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        },

        getComponentCables(component) {
          if (!component || !this.graphData) return [];
          const loc = component.subsystem;
          if (!loc) return [];
          return this.graphData.connections.filter(c =>
            c.connection_type === 'cable' &&
            (c.from_location === loc || c.to_location === loc)
          );
        },

        fgCables(fgGroup) {
          if (!fgGroup || !this.graphData) return [];
          const fgLocs = new Set(fgGroup.components.map(c => c.subsystem));
          const seen = new Map();
          for (const c of this.graphData.connections) {
            if (c.connection_type !== 'cable') continue;
            if (fgLocs.has(c.from_location) || fgLocs.has(c.to_location)) {
              if (!seen.has(c.cable_name)) seen.set(c.cable_name, c);
            }
          }
          return Array.from(seen.values());
        },

        getComponentIO(component) {
          if (!component || !this.graphData) return [];
          if (Array.isArray(component.io_assignments) && component.io_assignments.length > 0) {
            return component.io_assignments;
          }

          const designation = component.designation;
          if (!designation) return [];
          if (designation !== 'K801') return [];
          return this.graphData.io_assignments;
        },

        async reloadOriginalGraph() {
          const token = new URLSearchParams(window.location.search).get('token');
          if (token) {
            await this.loadFromToken(token);
          } else {
            await this.loadDatabaseGraph();
          }
        },

        async loadDatabaseGraph() {
          this.loadingMessage = 'Snapshot wird geladen…';
          this.loading = true;
          this.error = '';
          this.graphData = null;
          this.selectedComponent = null;
          this.selectedFgGroup = null;
          this.selectedCable = null;
          this.selectedCableShop = null;
          this.selectedCableShopError = '';
          this.selectedCableShopLoading = false;
          this._wizardResetState();
          try {
            const resp = await fetch('/api/machine-db');
            if (!resp.ok) {
              const err = await resp.json();
              throw new Error(err.detail || 'Snapshot konnte nicht geladen werden.');
            }
            this.graphData = await resp.json();
            this.$nextTick(() => this.renderGraph());
          } catch (e) {
            this.error = e.message;
          } finally {
            this.loading = false;
          }
        },

        async loadFromToken(token) {
          this.loadingMessage = 'Maschine wird geladen…';
          this.loading = true;
          this.error = '';
          this.graphData = null;
          this.selectedComponent = null;
          this.selectedFgGroup = null;
          this.selectedCable = null;
          this.selectedCableShop = null;
          this.selectedCableShopError = '';
          this.selectedCableShopLoading = false;
          this.replacedCables = {};
          this._wizardResetState();
          try {
            const resp = await fetch('/api/machine-db/' + encodeURIComponent(token));
            if (!resp.ok) {
              const err = await resp.json().catch(() => ({}));
              throw new Error(err.detail || 'Maschine konnte nicht geladen werden.');
            }
            this.graphData = await resp.json();
            
            // Phase 2: Load Replacements
            try {
              const r_resp = await fetch('/api/machine-db/' + encodeURIComponent(token) + '/replacements');
              if (r_resp.ok) {
                const replacements = await r_resp.json();
                const map = {};
                for (const r of replacements) {
                  map[r.cable_name] = r;
                }
                this.replacedCables = map;
              }
            } catch (e) {
              console.warn('Could not load replacements', e);
            }
            
            this.$nextTick(() => this.renderGraph());
          } catch (e) {
            this.error = e.message;
          } finally {
            this.loading = false;
          }
        },

        async loadCableShopInfo(cable) {
          const articleNumber = cable?.sap_number || cable?.article_part_nr || '';
          const normalizedArticleNumber = articleNumber.replace(/^lapp\.?\s*/i, '').trim();
          this.selectedCableShop = null;
          this.selectedCableShopError = '';

          // Init optimizer with cable data
          this.initOptimizer(cable);

          if (!normalizedArticleNumber) {
            this.selectedCableShopError = 'Keine Artikelnummer für diesen Kabelsatz vorhanden.';
            // Load default options as fallback
            this.optOptions = DEFAULT_OPTIONS.map(o => ({ ...o }));
            return;
          }

          this.selectedCableShopLoading = true;
          try {
            const resp = await fetch(`/api/shop/variant/${encodeURIComponent(normalizedArticleNumber)}`);
            if (!resp.ok) {
              const err = await resp.json().catch(() => ({}));
              throw new Error(err.detail || 'Shop-Variante konnte nicht geladen werden.');
            }
            this.selectedCableShop = await resp.json();
            // Auto-load cable options from shop
            if (this.selectedCableShop?.base_product_code) {
              this.loadOptCableOptions(this.selectedCableShop.base_product_code);
            } else {
              this.optOptions = DEFAULT_OPTIONS.map(o => ({ ...o }));
            }
          } catch (e) {
            this.selectedCableShopError = e.message;
            this.optOptions = DEFAULT_OPTIONS.map(o => ({ ...o }));
          } finally {
            this.selectedCableShopLoading = false;
          }
        },

        // --------------- Optimizer ---------------

        initOptimizer(cable) {
          this.optParams = { ...DEFAULT_PARAMS, current_a: 0, system_voltage_v: 0, ac_3phase: false };
          this.optResult = null;
          this.optError = '';
          this.optOptions = [];
          this.optUsedWires = null;
          this.optMachineYears = null;
          this.optMachineHoursPerDay = null;
          this.optMachineDaysPerYear = null;

          // Pre-fill from cable data
          if (cable?.length_m) {
            this.optParams.length_m = cable.length_m;
            this.optEplanLength = cable.length_m;
          } else {
            this.optEplanLength = null;
          }
          // usedWires = physically loaded conductors from EPLAN (preferred over num_cores = total wire count)
          const coresRaw = cable?.used_wires ?? cable?.num_cores;
          if (coresRaw != null) {
            const cores = parseInt(coresRaw);
            if (!isNaN(cores) && cores >= 1) {
              this.optParams.loaded_cores = cores;
              this.optUsedWires = cores;
            }
          }

          // Load settings from localStorage (same as index.html)
          const s = JSON.parse(localStorage.getItem('lapp_settings') || '{}');
          if (s.energy_price_eur_per_kwh !== undefined) {
            this.optParams.energy_price_eur_per_kwh = s.energy_price_eur_per_kwh;
            this.optSettingsPrice = s.energy_price_eur_per_kwh;
          } else {
            this.optSettingsPrice = null;
          }
          if (s.max_voltage_drop_percent !== undefined) {
            this.optParams.max_voltage_drop_percent = s.max_voltage_drop_percent;
            this.optSettingsVoltDrop = s.max_voltage_drop_percent;
          } else {
            this.optSettingsVoltDrop = null;
          }
          if (s.electricity_emission_factor_kg_per_kwh !== undefined) this.optParams.electricity_emission_factor_kg_per_kwh = s.electricity_emission_factor_kg_per_kwh;
          if (s.copper_emission_factor_kg_per_kg !== undefined) this.optParams.copper_emission_factor_kg_per_kg = s.copper_emission_factor_kg_per_kg;

          // Fill from machine operation params (left panel)
          this.optParams.years = this.machineYears;
          this.optMachineYears = this.machineYears;
          this.optParams.hours_per_day = this.machineHoursPerDay;
          this.optMachineHoursPerDay = this.machineHoursPerDay;
          this.optParams.days_per_year = this.machineDaysPerYear;
          this.optMachineDaysPerYear = this.machineDaysPerYear;
        },

        _saveMachineOps() {
          localStorage.setItem('lapp_machine_ops', JSON.stringify({
            years: this.machineYears,
            hours_per_day: this.machineHoursPerDay,
            days_per_year: this.machineDaysPerYear,
          }));
        },

        async loadOptCableOptions(baseProductCode) {
          this.optOptionsLoading = true;
          this.optOptions = [];
          try {
            const resp = await fetch('/api/shop/product/' + encodeURIComponent(baseProductCode) + '/cable-options-direct');
            if (!resp.ok) throw new Error('Kabelvarianten konnten nicht geladen werden.');
            const data = await resp.json();
            const opts = Array.isArray(data) ? data : (data.options || []);
            this.optOptions = opts.length > 0 ? opts : DEFAULT_OPTIONS.map(o => ({ ...o }));
          } catch (e) {
            console.error('loadOptCableOptions error:', e);
            this.optOptions = DEFAULT_OPTIONS.map(o => ({ ...o }));
          } finally {
            this.optOptionsLoading = false;
          }
        },

        get filteredOptOptions() {
          return this.optOptions.filter(o => {
            const cores = parseInt(o.num_cores);
            if (!isNaN(cores) && cores < this.optParams.loaded_cores) return false;
            if (o.ampacity_a != null && this.optParams.current_a > 0 && o.ampacity_a < this.optParams.current_a) return false;
            return true;
          });
        },

        async calculateOpt() {
          if (this.optParams.current_a <= 0 || this.optParams.system_voltage_v <= 0) {
            this.optError = 'Bitte Betriebsstrom und Spannung eingeben.';
            return;
          }
          const opts = this.filteredOptOptions;
          if (opts.length === 0) {
            this.optError = 'Keine passenden Kabelvarianten verfügbar.';
            return;
          }
          this.optLoading = true;
          this.optError = '';
          this.optResult = null;
          try {
            const resp = await fetch('/api/calculate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ params: this.optParams, options: opts }),
            });
            if (!resp.ok) throw new Error(await resp.text());
            this.optResult = await resp.json();
          } catch (e) {
            console.error(e);
            this.optError = 'Fehler: ' + e.message;
          } finally {
            this.optLoading = false;
          }
        },

        optFmt(v) { return optNumFmt.format(v); },

        openInOptimizer() {
          const prefill = {
            params: { ...this.optParams },
            options: this.filteredOptOptions,
            productName: this.selectedCableShop?.name || '',
            productImage: this.selectedCableShop?.image_url || '',
            baseCode: this.selectedCableShop?.base_product_code || '',
          };
          localStorage.setItem('lapp_opt_prefill', JSON.stringify(prefill));
          window.open('/optimizer', '_blank');
        },

        // Pan & Zoom
        _minZoom: 0.05,
        _zoomAt(newZoom, anchorX, anchorY) {
          const container = document.getElementById('graphContainer');
          if (!container) return;

          const oldZoom = this.zoom;
          const clampedZoom = Math.max(this._minZoom, Math.min(3, newZoom));
          if (clampedZoom === oldZoom) return;

          const x = anchorX ?? container.clientWidth / 2;
          const y = anchorY ?? container.clientHeight / 2;
          const worldX = (x - this.panX) / oldZoom;
          const worldY = (y - this.panY) / oldZoom;

          this.zoom = clampedZoom;
          this.panX = x - worldX * this.zoom;
          this.panY = y - worldY * this.zoom;
        },

        zoomIn(anchorX, anchorY)  { this._zoomAt(this.zoom * 1.2, anchorX, anchorY); },
        zoomOut(anchorX, anchorY) { this._zoomAt(this.zoom / 1.2, anchorX, anchorY); },
        resetView() { this.zoom = 1; this.panX = 20; this.panY = 20; },
        handleWheel(e) {
          const container = document.getElementById('graphContainer');
          if (!container) return;

          const rect = container.getBoundingClientRect();
          const anchorX = e.clientX - rect.left;
          const anchorY = e.clientY - rect.top;

          if (e.deltaY < 0) this.zoomIn(anchorX, anchorY); else this.zoomOut(anchorX, anchorY);
        },
        startPan(e) { this.isPanning = true; this.panStart = { x: e.clientX - this.panX, y: e.clientY - this.panY }; },
        doPan(e)  { if (this.isPanning) { this.panX = e.clientX - this.panStart.x; this.panY = e.clientY - this.panStart.y; } },
        endPan()  { this.isPanning = false; },

        // Touch support: 1-finger pan, 2-finger pinch-to-zoom, tap-to-select
        _touchStart: null,
        _touchMoved: false,
        _pinchStartDist: null,
        _pinchStartZoom: null,

        handleTouchStart(e) {
          if (e.touches.length === 1) {
            const cx = e.touches[0].clientX;
            const cy = e.touches[0].clientY;
            this._touchStart = { x: cx - this.panX, y: cy - this.panY, startX: cx, startY: cy };
            this._touchMoved = false;
            this._pinchStartDist = null;
          } else if (e.touches.length === 2) {
            // Begin pinch - cancel any ongoing pan
            this._touchStart = null;
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            this._pinchStartDist = Math.sqrt(dx * dx + dy * dy);
            this._pinchStartZoom = this.zoom;
          }
        },

        handleTouchMove(e) {
          if (e.touches.length === 1 && this._touchStart) {
            const cx = e.touches[0].clientX;
            const cy = e.touches[0].clientY;
            if (Math.abs(cx - this._touchStart.startX) > 6 || Math.abs(cy - this._touchStart.startY) > 6) {
              this._touchMoved = true;
            }
            this.panX = cx - this._touchStart.x;
            this.panY = cy - this._touchStart.y;
          } else if (e.touches.length === 2 && this._pinchStartDist !== null) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const container = document.getElementById('graphContainer');
            const rect = container.getBoundingClientRect();
            const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
            const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
            this._zoomAt(this._pinchStartZoom * (dist / this._pinchStartDist), midX, midY);
          }
        },

        handleTouchEnd(e) {
          // Tap detection: short touch with no significant movement → fire synthetic click
          if (!this._touchMoved && this._touchStart && e.changedTouches.length > 0) {
            const touch = e.changedTouches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            if (target) {
              target.dispatchEvent(new MouseEvent('click', {
                bubbles: true, cancelable: true,
                clientX: touch.clientX, clientY: touch.clientY,
              }));
            }
          }
          if (e.touches.length === 0) {
            this._touchStart = null;
            this._pinchStartDist = null;
          }
        },

        // --------------- Graph rendering with Dagre ---------------
        renderGraph() {
          if (!this.graphData) return;
          const el = document.getElementById('graphGroup');
          if (!el) {
            // DOM not ready yet (x-if template not rendered), retry
            setTimeout(() => this.renderGraph(), 50);
            return;
          }
          this.error = '';

          try {
            const g = new dagre.graphlib.Graph({ compound: true, multigraph: true });
            g.setGraph({ rankdir: 'LR', nodesep: 80, ranksep: 250, marginx: 50, marginy: 50, edgesep: 40 });
            g.setDefaultEdgeLabel(() => ({}));

            const components = this.graphData.components;
            const connections = this.graphData.connections;
            const subsystems = this.graphData.subsystems;

            // Build lookup: designation → component
            const compByDesig = {};
            components.forEach(c => { compByDesig[c.designation] = c; });

            if (this.viewMode === 'subsystem') {
              this._renderSubsystemView(g, components, connections, subsystems, compByDesig);
            } else {
              this._renderAllView(g, components, connections, compByDesig);
            }

            dagre.layout(g);
            this._drawGraph(g);
          } catch (e) {
            console.error('renderGraph error:', e);
            this.error = 'Graph-Rendering fehlgeschlagen: ' + e.message;
          }
        },

        _renderSubsystemView(g, components, connections, subsystems, compByDesig) {
          // Group components by (subsystem, function_group) for a condensed view.
          // Each FG group becomes one node instead of showing every device.

          // Create subsystem cluster nodes (= locations)
          const subIdx = {};
          subsystems.forEach((sub, i) => {
            subIdx[sub.name] = i;
            const label = sub.name_de || sub.name;
            g.setNode('sub_' + i, {
              label: label,
              clusterLabelPos: 'top',
              style: 'fill: transparent',
              width: 160,
              height: 60,
              isSubsystem: true,
              subIndex: i,
            });
          });

          // Group components by subsystem + function_group
          const fgGroups = {};  // key "loc|fg" → { fg, subsystem, components: [...] }
          components.forEach(c => {
            if (this.filterSubsystem && c.subsystem !== this.filterSubsystem) return;
            const key = c.subsystem + '|' + (c.function_group || '_none');
            if (!fgGroups[key]) {
              fgGroups[key] = {
                fg: c.function_group || '',
                subsystem: c.subsystem,
                components: [],
              };
            }
            fgGroups[key].components.push(c);
          });

          // Create one node per FG group
          const compByLoc = {};
          const addedNodes = new Set();

          Object.entries(fgGroups).forEach(([key, group]) => {
            const nodeId = 'fg_' + key;

            // Summarise the types in this group
            const typeCounts = {};
            group.components.forEach(c => {
              const desc = c.description_de || c.component_type;
              typeCounts[desc] = (typeCounts[desc] || 0) + 1;
            });
            const typeSummary = Object.entries(typeCounts)
              .sort((a, b) => b[1] - a[1])
              .slice(0, 3)
              .map(([desc, n]) => n > 1 ? `${n}\u00d7 ${desc}` : desc)
              .join(', ');

            // Pick dominant component type for colour
            const typeFreq = {};
            group.components.forEach(c => {
              typeFreq[c.component_type] = (typeFreq[c.component_type] || 0) + 1;
            });
            const dominantType = Object.entries(typeFreq)
              .sort((a, b) => b[1] - a[1])[0][0];
            const colors = this.TYPE_COLORS[dominantType] || { fill: '#f1f5f9', stroke: '#94a3b8', text: '#334155' };

            // Label: FG name on top, type summary below
            const fgLabel = group.fg || group.subsystem;
            const countLabel = group.components.length > 1
              ? `${group.components.length} Geräte`
              : typeSummary;
            const label = fgLabel + '\n' + (group.components.length > 1 ? typeSummary : (group.components[0].description_de || ''));

            // Wider for groups with many types
            const nodeWidth = Math.max(180, Math.min(280, typeSummary.length * 6.5 + 40));

            g.setNode(nodeId, {
              label: label,
              width: nodeWidth,
              height: 60,
              // Store first component for click, but also array of all
              component: group.components[0],
              fgGroup: group,
              colors: colors,
            });

            // Mark all component IDs as added (for edge routing)
            group.components.forEach(c => addedNodes.add(c.id));

            // Track by location for cable edge routing
            if (!compByLoc[group.subsystem]) compByLoc[group.subsystem] = [];
            compByLoc[group.subsystem].push(nodeId);

            // Parent to subsystem cluster
            if (subIdx[group.subsystem] !== undefined && !this.filterSubsystem) {
              g.setParent(nodeId, 'sub_' + subIdx[group.subsystem]);
            }
          });

          // Cable edges only (skip FG chains — they are now collapsed into FG group nodes)
          this._addCableEdges(g, connections, subsystems, addedNodes, compByLoc, true);
        },

        _renderAllView(g, components, connections, compByDesig) {
          const addedNodes = new Set();
          const compByLoc = {};
          components.forEach(c => {
            if (this.filterSubsystem && c.subsystem !== this.filterSubsystem) return;

            const nodeId = 'comp_' + c.id;
            const colors = this.TYPE_COLORS[c.component_type] || { fill: '#f1f5f9', stroke: '#94a3b8', text: '#334155' };
            const fgPrefix = c.function_group ? c.function_group + ' ' : '';
            const descShort = c.description_de ? c.description_de.substring(0, 18) : '';

            if (c.subsystem) {
              if (!compByLoc[c.subsystem]) compByLoc[c.subsystem] = [];
              compByLoc[c.subsystem].push(nodeId);
            }

            g.setNode(nodeId, {
              label: c.designation + '\n' + fgPrefix + descShort,
              width: 170,
              height: 60,
              component: c,
              colors: colors,
            });
            addedNodes.add(c.id);
          });

          this._addCableEdges(g, connections, null, addedNodes, compByLoc);
        },

        _addCableEdges(g, connections, subsystems, addedNodes, compByLoc, skipFgChains) {
          // compByLoc maps location -> array of component node IDs in that location
          // We pick a representative node from each location as edge endpoint
          // (dagre cannot route edges between compound/parent nodes)

          // --- Bundle cables by (fromNode, toNode) route to avoid overlapping labels ---
          const cableConns = connections.filter(c => c.connection_type === 'cable');

          // First, group cables by their resolved (fromNode, toNode) pair
          const routeBundles = {};  // "fromNode|toNode" → { fromNode, toNode, cables: [...] }
          cableConns.forEach((conn, idx) => {
            const fromLoc = conn.from_location || '';
            const toLoc = conn.to_location || '';
            if (!fromLoc || !toLoc) return;

            const fromNodes = compByLoc[fromLoc];
            const toNodes = compByLoc[toLoc];
            if (!fromNodes || !fromNodes.length || !toNodes || !toNodes.length) return;

            // Distribute across FG-group nodes in the location
            const fromNode = fromNodes[idx % fromNodes.length];
            const toNode = toNodes[idx % toNodes.length];
            const routeKey = fromNode + '|' + toNode;

            if (!routeBundles[routeKey]) {
              routeBundles[routeKey] = { fromNode, toNode, cables: [] };
            }
            routeBundles[routeKey].cables.push(conn);
          });

          // Create one edge per route bundle
          Object.entries(routeBundles).forEach(([routeKey, bundle], idx) => {
            const cables = bundle.cables;
            const firstCable = cables[0];
            const extraCount = Math.max(0, cables.length - 1);

            // Keep the visual label compact, but preserve the technical detail line.
            const mainLabel = extraCount > 0
              ? `${firstCable.cable_name} +${extraCount}`
              : firstCable.cable_name;

            const detailParts = [];
            if (firstCable.cable_spec) detailParts.push(firstCable.cable_spec);
            if (firstCable.length_m) detailParts.push(`${firstCable.length_m} m`);
            if (firstCable.num_cores) detailParts.push(`${firstCable.num_cores} Adern`);
            if (extraCount > 0) detailParts.push(`+${extraCount} weitere`);
            const detailLabel = detailParts.join(' | ');

            // Compute label dimensions for dagre spacing
            const lines = detailLabel ? [mainLabel, detailLabel] : [mainLabel];
            const lineCount = lines.length;
            const longestLine = lines.reduce((a, b) => a.length > b.length ? a : b, '');
            const labelWidth = longestLine.length * 7 + 24;
            const labelHeight = lineCount * 16 + 12;

            g.setEdge(bundle.fromNode, bundle.toNode, {
              label: lines.join('\n'),
              cables: cables,
              edgeType: 'cable',
              minlen: 3,
              labelpos: 'c',
              width: labelWidth,
              height: labelHeight,
            }, 'cable_' + idx);
          });

          // --- Function-group chain edges within subsystems ---
          if (!skipFgChains) {
            const addedNodeSet = addedNodes instanceof Set ? addedNodes : new Set(addedNodes);
            let fgIdx = 0;
            connections.forEach(conn => {
              if (conn.connection_type !== 'fg_chain') return;
              const fromId = conn.from_component;
              const toId = conn.to_component;
              if (!addedNodeSet.has(fromId) || !addedNodeSet.has(toId)) return;

              const fromNode = 'comp_' + fromId;
              const toNode = 'comp_' + toId;

              g.setEdge(fromNode, toNode, {
                label: conn.function_group || '',
                edgeType: 'fg_chain',
                functionGroup: conn.function_group,
                minlen: 1,
              }, 'fg_' + fgIdx++);
            });
          }
        },

        _drawGraph(g) {
          const group = document.getElementById('graphGroup');
          group.innerHTML = '';
          const self = this;

          // Reset highlight registry
          _gReg = { edgesByCable: {}, nodeById: {}, allPathEls: [], allLabelBgs: [], allLabelTexts: [], allNodeGs: [] };

          // Draw edges first (behind nodes)
          g.edges().forEach(e => {
            const edge = g.edge(e);
            if (!edge.points) return;

            const isFgChain = edge.edgeType === 'fg_chain';
            const isCable = edge.edgeType === 'cable';

            const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            // Use smooth cubic bezier curves instead of straight line segments
            let d;
            if (edge.points.length <= 2) {
              d = 'M' + edge.points.map(p => `${p.x},${p.y}`).join(' L');
            } else {
              d = `M${edge.points[0].x},${edge.points[0].y}`;
              for (let i = 1; i < edge.points.length - 1; i++) {
                const prev = edge.points[i - 1];
                const curr = edge.points[i];
                const next = edge.points[i + 1];
                const cpx1 = (prev.x + curr.x) / 2;
                const cpy1 = (prev.y + curr.y) / 2;
                const cpx2 = (curr.x + next.x) / 2;
                const cpy2 = (curr.y + next.y) / 2;
                if (i === 1) d += ` Q${curr.x},${curr.y} ${cpx2},${cpy2}`;
                else d += ` T${cpx2},${cpy2}`;
              }
              const last = edge.points[edge.points.length - 1];
              d += ` L${last.x},${last.y}`;
            }
            pathEl.setAttribute('d', d);
            pathEl.setAttribute('fill', 'none');

            if (isFgChain) {
              // Thin dashed line for function-group chains
              pathEl.setAttribute('stroke', '#a5b4fc');
              pathEl.setAttribute('stroke-width', '1.5');
              pathEl.setAttribute('stroke-dasharray', '5 3');
              pathEl.setAttribute('marker-end', 'url(#arrowhead-fg)');
            } else {
              // Thick solid line for cable connections
              pathEl.setAttribute('stroke', '#94a3b8');
              pathEl.setAttribute('stroke-width', '2');
              pathEl.setAttribute('marker-end', 'url(#arrowhead)');
            }
            group.appendChild(pathEl);
            _gReg.allPathEls.push(pathEl);

            // Edge label
            let edgeLabelBgEl = null;
            let edgeLabelTextEls = [];
            if (edge.label) {
              // Use dagre's label position, or compute midpoint from path
              let lx = edge.x;
              let ly = edge.y;
              if (lx === undefined || ly === undefined) {
                const mid = edge.points[Math.floor(edge.points.length / 2)];
                lx = mid.x;
                ly = mid.y;
              }
              if (isFgChain) {
                // Small FG label (no background pill)
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', lx);
                text.setAttribute('y', ly + 3);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-size', '9');
                text.setAttribute('fill', '#818cf8');
                text.textContent = edge.label;
                group.appendChild(text);
              } else if (isCable) {
                // Bundled cable label: show each cable on its own line
                const cables = edge.cables || [];
                const lines = edge.label.split('\n');
                const lineHeight = 15;
                const totalHeight = lines.length * lineHeight + 8;
                const longestLine = lines.reduce((a, b) => a.length > b.length ? a : b, '');
                const totalWidth = longestLine.length * 7 + 24;

                // Background pill
                const labelBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                labelBg.setAttribute('x', lx - totalWidth / 2);
                labelBg.setAttribute('y', ly - totalHeight / 2);
                labelBg.setAttribute('width', totalWidth);
                labelBg.setAttribute('height', totalHeight);
                labelBg.setAttribute('rx', '6');
                labelBg.setAttribute('fill', '#f8fafc');
                labelBg.setAttribute('stroke', '#cbd5e1');
                labelBg.setAttribute('stroke-width', '1');
                labelBg.setAttribute('class', 'cable-label-bg');
                group.appendChild(labelBg);
                edgeLabelBgEl = labelBg;

                // Render each line
                const startY = ly - totalHeight / 2 + lineHeight;
                lines.forEach((line, lineIdx) => {
                  const textEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                  textEl.setAttribute('x', lx);
                  textEl.setAttribute('y', startY + lineIdx * lineHeight);
                  textEl.setAttribute('text-anchor', 'middle');
                  textEl.setAttribute('font-size', '10');
                  textEl.setAttribute('font-weight', '600');
                  textEl.setAttribute('class', 'cable-label-text');
                  
                  const isReplaced = !!self.replacedCables[line];
                  if (isReplaced) {
                    textEl.textContent = line + ' 🔄';
                    textEl.setAttribute('fill', '#2563eb'); // blue for replaced
                  } else {
                    textEl.textContent = line;
                    textEl.setAttribute('fill', '#475569');
                  }
                  
                  group.appendChild(textEl);
                  edgeLabelTextEls.push(textEl);

                  // Find matching cable for click handler
                  const matchingCable = cables.find(c => c.cable_name === line);
                  if (matchingCable) {
                    textEl.addEventListener('click', () => {
                      self.selectedComponent = null;
                      self.selectedFgGroup = null;
                      self.selectedCable = matchingCable;
                      self.loadCableShopInfo(matchingCable);
                    });
                  }
                });

                // Click on background opens first cable detail + hover highlight
                if (cables.length > 0) {
                  labelBg.addEventListener('click', () => {
                    self.selectedComponent = null;
                    self.selectedFgGroup = null;
                    self.selectedCable = cables[0];
                    self.loadCableShopInfo(cables[0]);
                  });
                  // Hover: highlight bg + all text els together
                  const hoverIn = () => {
                    labelBg.setAttribute('fill', '#fff7ed');
                    labelBg.setAttribute('stroke', '#e95e0f');
                    labelBg.setAttribute('stroke-width', '1.5');
                    edgeLabelTextEls.forEach(t => t.setAttribute('fill', '#c94e0a'));
                  };
                  const hoverOut = () => {
                    labelBg.setAttribute('fill', '#f8fafc');
                    labelBg.setAttribute('stroke', '#cbd5e1');
                    labelBg.setAttribute('stroke-width', '1');
                    edgeLabelTextEls.forEach(t => t.setAttribute('fill', '#475569'));
                  };
                  labelBg.addEventListener('mouseenter', hoverIn);
                  labelBg.addEventListener('mouseleave', hoverOut);
                  edgeLabelTextEls.forEach(t => {
                    t.addEventListener('mouseenter', hoverIn);
                    t.addEventListener('mouseleave', hoverOut);
                  });
                }
              }

              // Tooltip with full cable details
              if (edge.cables) {
                const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                title.textContent = edge.cables.map(c =>
                  `${c.cable_name}: ${c.cable_spec}`
                ).join('\n');
                pathEl.appendChild(title);
              }
              // Tooltip for FG chain
              if (isFgChain && edge.functionGroup) {
                const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                title.textContent = `Funktionsgruppe ${edge.functionGroup}`;
                pathEl.appendChild(title);
              }
            }

            // Register cable edges for highlight/zoom
            if (isCable && edge.cables) {
              edge.cables.forEach(c => {
                _gReg.edgesByCable[c.cable_name] = { pathEl, labelBgEl: edgeLabelBgEl, labelTextEls: edgeLabelTextEls, fromNodeId: e.v, toNodeId: e.w, points: edge.points };
              });
              if (edgeLabelBgEl) _gReg.allLabelBgs.push(edgeLabelBgEl);
              edgeLabelTextEls.forEach(t => _gReg.allLabelTexts.push(t));
            }
          });

          // Draw subsystem boxes (compound nodes)
          g.nodes().forEach(nodeId => {
            const node = g.node(nodeId);
            if (!node || !node.isSubsystem) return;

            // Find bounding box of child nodes
            const children = g.children(nodeId);
            if (!children || children.length === 0) return;

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            children.forEach(childId => {
              const child = g.node(childId);
              if (child) {
                minX = Math.min(minX, child.x - child.width / 2);
                minY = Math.min(minY, child.y - child.height / 2);
                maxX = Math.max(maxX, child.x + child.width / 2);
                maxY = Math.max(maxY, child.y + child.height / 2);
              }
            });

            if (minX === Infinity) return;

            const pad = 30;
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            const color = this.SUB_COLORS[node.subIndex % this.SUB_COLORS.length];
            rect.setAttribute('x', minX - pad);
            rect.setAttribute('y', minY - pad - 24);
            rect.setAttribute('width', maxX - minX + pad * 2);
            rect.setAttribute('height', maxY - minY + pad * 2 + 24);
            rect.setAttribute('rx', '12');
            rect.setAttribute('ry', '12');
            rect.setAttribute('fill', color + '10');
            rect.setAttribute('stroke', color);
            rect.setAttribute('stroke-width', '1.5');
            rect.setAttribute('stroke-dasharray', '6 3');
            rect.setAttribute('pointer-events', 'none');
            group.appendChild(rect);

            // Subsystem label
            const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            label.setAttribute('x', minX - pad + 12);
            label.setAttribute('y', minY - pad - 6);
            label.setAttribute('font-size', '13');
            label.setAttribute('font-weight', '700');
            label.setAttribute('fill', color);
