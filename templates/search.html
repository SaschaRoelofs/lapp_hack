<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAPP Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lapp: { 600: '#e95e0f', 700: '#c94e0a' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen antialiased" x-data="shopViewer()" x-init="init()">

  <!-- Header -->
  <header class="sticky top-0 z-50 text-white" style="background:linear-gradient(135deg,#080d1a 0%,#0f1629 40%,#111827 100%);box-shadow:0 4px 30px rgba(0,0,0,0.25)">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center gap-5">
      <div class="relative">
        <div class="bg-gradient-to-br from-lapp-600 to-orange-500 rounded-xl p-2.5" style="box-shadow:0 0 24px rgba(233,94,15,0.4),0 4px 12px rgba(0,0,0,0.3)">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">Leitungsquerschnitt-Optimierer</h1>
        <p class="text-slate-400 text-xs font-medium tracking-wide">TCO- &amp; CO₂-Optimierung von Kupferleitungen</p>
      </div>
      <nav class="ml-auto flex items-center gap-1.5">
        <a href="/" class="inline-flex items-center px-4 py-1.5 rounded-[10px] text-[0.8rem] font-medium text-slate-400 tracking-wide transition-all duration-200 hover:bg-white/[0.07] hover:text-slate-200 hover:-translate-y-px">Home</a>
        <a href="/optimizer" class="inline-flex items-center px-4 py-1.5 rounded-[10px] text-[0.8rem] font-medium text-slate-400 tracking-wide transition-all duration-200 hover:bg-white/[0.07] hover:text-slate-200 hover:-translate-y-px">Optimierer</a>
        <a href="/search" class="inline-flex items-center px-4 py-1.5 rounded-[10px] text-[0.8rem] font-semibold text-orange-400 bg-orange-500/10 tracking-wide">Suche</a>
        <a href="/machine" class="inline-flex items-center px-4 py-1.5 rounded-[10px] text-[0.8rem] font-medium text-slate-400 tracking-wide transition-all duration-200 hover:bg-white/[0.07] hover:text-slate-200 hover:-translate-y-px">Maschine</a>
        <a href="/settings" class="inline-flex items-center px-3 py-1.5 rounded-[10px] text-[0.8rem] font-medium text-slate-400 tracking-wide transition-all duration-200 hover:bg-white/[0.07] hover:text-slate-200 hover:-translate-y-px" title="Einstellungen">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </a>
      </nav>
    </div>
    <div class="h-px" style="background:linear-gradient(90deg,transparent 5%,rgba(233,94,15,0.2) 30%,rgba(249,115,22,0.3) 50%,rgba(233,94,15,0.2) 70%,transparent 95%)"></div>
  </header>

  <div class="flex h-[calc(100vh-76px)]">

    <!-- Left Panel: Search & Results -->
    <aside class="w-96 flex-shrink-0 bg-white border-r border-gray-200 flex flex-col">
      <!-- Search -->
      <div class="p-3 border-b border-gray-200">
        <form @submit.prevent="searchProducts()" class="flex gap-2">
          <input type="text" x-model="query" placeholder="z.B. ÖLFLEX 191 CY, 30010928 ..."
            class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-lapp-600 focus:border-lapp-600 outline-none"
            @keydown.enter="searchProducts()">
          <button type="submit"
            class="bg-lapp-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-lapp-700 transition-colors disabled:opacity-50"
            :disabled="searching || !query.trim()">
            <span x-show="!searching">Suchen</span>
            <span x-show="searching" class="flex items-center gap-1">
              <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"/></svg>
            </span>
          </button>
        </form>
        <div x-show="totalResults !== null" class="mt-2 text-xs text-gray-400">
          <span x-text="totalResults"></span> Ergebnis(se)
        </div>
      </div>
      <!-- Results List -->
      <div class="flex-1 overflow-y-auto">
        <template x-for="p in searchResults" :key="p.base_product_code + '_' + p.code">
          <button @click="loadProduct(p.base_product_code)"
            class="w-full text-left px-4 py-3 border-b border-gray-100 transition-colors flex gap-3"
            :class="selectedCode === p.base_product_code ? 'bg-lapp-600/10 border-l-4 border-l-lapp-600' : 'hover:bg-gray-50'">
            <img x-show="p.image_url" :src="p.image_url" class="w-14 h-14 object-contain rounded flex-shrink-0 bg-gray-50" alt="">
            <div class="min-w-0">
              <div class="text-sm font-medium text-gray-800 truncate" x-text="p.name"></div>
              <div class="text-xs text-gray-400 mt-0.5 truncate" x-text="p.description"></div>
              <div class="flex items-center gap-2 mt-1">
                <span x-show="p.from_price" class="text-xs font-semibold text-lapp-600" x-text="'ab ' + p.from_price"></span>
                <span class="text-xs text-gray-400" x-text="p.variant_count + ' Varianten'"></span>
              </div>
            </div>
          </button>
        </template>
        <div x-show="searchResults.length === 0 && !searching && totalResults !== null" class="px-4 py-8 text-center text-gray-400 text-sm">
          Keine Produkte gefunden
        </div>
        <div x-show="searchResults.length === 0 && totalResults === null && !searching" class="px-4 py-8 text-center text-gray-400 text-sm">
          <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
          </svg>
          <p class="text-sm">Suchbegriff eingeben</p>
          <p class="text-xs mt-1 text-gray-300">z.B. ÖLFLEX, UNITRONIC, H07V-K</p>
        </div>
      </div>
    </aside>

    <!-- Right Panel: Product Detail -->
    <main class="flex-1 overflow-y-auto">

      <!-- Empty State -->
      <div x-show="!selectedCode && !loadingProduct" class="flex items-center justify-center h-full text-gray-400">
        <div class="text-center">
          <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/>
          </svg>
          <p class="text-lg font-medium">Produkt auswählen</p>
          <p class="text-sm mt-1">Suche links nach einem Produkt und wähle es aus</p>
        </div>
      </div>

      <!-- Loading -->
      <div x-show="loadingProduct" class="flex items-center justify-center h-full text-gray-400">
        <div class="text-center">
          <svg class="animate-spin h-10 w-10 mx-auto mb-3 text-lapp-600" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"/>
          </svg>
          <p class="text-sm">Lade Produktdaten vom Shop...</p>
        </div>
      </div>

      <!-- Product Detail -->
      <div x-show="product && !loadingProduct" x-cloak class="p-6 space-y-6">

        <!-- Product Header -->
        <template x-if="product">
          <div>
            <div class="flex items-start gap-6 mb-6">
              <img x-show="product.image_url" :src="product.image_url"
                class="w-32 h-32 object-contain rounded-xl border border-gray-200 bg-white p-2 flex-shrink-0" alt="">
              <div>
                <h2 class="text-2xl font-bold text-gray-800" x-text="product.name"></h2>
                <p class="text-sm text-gray-500 mt-1" x-text="product.description"></p>
                <div class="flex flex-wrap items-center gap-3 mt-3">
                  <span x-show="product.category" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full" x-text="product.category"></span>
                  <span x-show="product.from_price_formatted" class="text-sm font-semibold text-lapp-600" x-text="'ab ' + product.from_price_formatted"></span>
                  <span class="text-xs text-gray-400" x-text="product.variant_count + ' Varianten'"></span>
                  <a :href="product.canonical_url" target="_blank" class="text-xs text-lapp-600 hover:underline flex items-center gap-1">
                    Im Shop öffnen
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                  </a>
                </div>
              </div>
            </div>

            <!-- Info Cards -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
              <!-- Certifications -->
              <div x-show="product.certifications && product.certifications.length" class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Zertifizierungen</h3>
                <div class="flex flex-wrap gap-2">
                  <template x-for="cert in product.certifications" :key="cert">
                    <span class="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-full" x-text="cert"></span>
                  </template>
                </div>
              </div>
              <!-- Characteristics -->
              <div x-show="product.characteristics && product.characteristics.length" class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Eigenschaften</h3>
                <div class="flex flex-wrap gap-2">
                  <template x-for="ch in product.characteristics" :key="ch">
                    <span class="text-xs bg-green-50 text-green-700 px-2 py-1 rounded-full" x-text="ch"></span>
                  </template>
                </div>
              </div>
            </div>

            <!-- Benefits -->
            <div x-show="product.benefits && product.benefits.length" class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-6">
              <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Vorteile</h3>
              <ul class="space-y-1">
                <template x-for="b in product.benefits" :key="b">
                  <li class="text-sm text-gray-700 flex items-start gap-2">
                    <svg class="w-4 h-4 text-green-500 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                    <span x-text="b"></span>
                  </li>
                </template>
              </ul>
            </div>

            <!-- Applications -->
            <div x-show="product.applications && product.applications.length" class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-6">
              <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Einsatzbereich</h3>
              <ul class="space-y-1">
                <template x-for="a in product.applications" :key="a">
                  <li class="text-sm text-gray-700 flex items-start gap-2">
                    <svg class="w-4 h-4 text-lapp-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                    <span x-text="a"></span>
                  </li>
                </template>
              </ul>
            </div>

            <!-- Variant Filter -->
            <div class="flex items-center gap-4 mb-2">
              <h3 class="text-sm font-semibold text-gray-600">
                Varianten <span class="font-normal text-gray-400">(<span x-text="filteredVariants.length"></span> / <span x-text="product.variants.length"></span>)</span>
              </h3>
              <button @click="loadPrices()" :disabled="loadingPrices"
                class="ml-2 bg-lapp-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-lapp-700 transition-colors disabled:opacity-50 flex items-center gap-1.5">
                <svg x-show="!loadingPrices" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <svg x-show="loadingPrices" class="animate-spin h-3.5 w-3.5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"/></svg>
                <span x-text="pricesLoaded ? 'Preise aktualisieren' : 'Preise laden'"></span>
              </button>
              <span x-show="pricesLoaded" class="text-xs text-green-600 font-medium">✓ geladen</span>
              <input type="text" x-model="variantFilter" placeholder="Filtern (Name, Artikelnr.) ..."
                class="ml-auto w-64 border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-lapp-600 focus:border-lapp-600 outline-none">
            </div>

            <!-- Variants Table -->
            <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wide sticky top-0">
                    <tr>
                      <th class="px-4 py-3 text-left cursor-pointer hover:text-lapp-600" @click="sortBy('name')">
                        Name <span x-show="sortCol==='name'" x-text="sortDir==='asc'?'▲':'▼'"></span>
                      </th>
                      <th class="px-4 py-3 text-left cursor-pointer hover:text-lapp-600" @click="sortBy('article_number')">
                        Artikelnr. <span x-show="sortCol==='article_number'" x-text="sortDir==='asc'?'▲':'▼'"></span>
                      </th>
                      <th class="px-4 py-3 text-center">Adern</th>
                      <th class="px-4 py-3 text-center">Schutzleiter</th>
                      <th class="px-4 py-3 text-right cursor-pointer hover:text-lapp-600" @click="sortBy('cross_section_mm2')">
                        Querschnitt <span x-show="sortCol==='cross_section_mm2'" x-text="sortDir==='asc'?'▲':'▼'"></span>
                      </th>
                      <th class="px-4 py-3 text-right cursor-pointer hover:text-lapp-600" @click="sortBy('outer_diameter_mm')">
                        ⌀ mm <span x-show="sortCol==='outer_diameter_mm'" x-text="sortDir==='asc'?'▲':'▼'"></span>
                      </th>
                      <th class="px-4 py-3 text-right cursor-pointer hover:text-lapp-600" @click="sortBy('copper_index_kg_per_km')">
                        Cu kg/km <span x-show="sortCol==='copper_index_kg_per_km'" x-text="sortDir==='asc'?'▲':'▼'"></span>
                      </th>
                      <th class="px-4 py-3 text-right cursor-pointer hover:text-lapp-600" @click="sortBy('weight_kg_per_km')">
                        Gew. kg/km <span x-show="sortCol==='weight_kg_per_km'" x-text="sortDir==='asc'?'▲':'▼'"></span>
                      </th>
                      <th class="px-4 py-3 text-right cursor-pointer hover:text-lapp-600" @click="sortBy('price_value')">
                        Preis <span x-show="sortCol==='price_value'" x-text="sortDir==='asc'?'▲':'▼'"></span>
                      </th>
                      <th class="px-4 py-3 text-right cursor-pointer hover:text-lapp-600" @click="sortBy('price_per_meter')">
                        €/m <span x-show="sortCol==='price_per_meter'" x-text="sortDir==='asc'?'▲':'▼'"></span>
                      </th>
                      <th class="px-4 py-3 text-center">Status</th>
                      <th class="px-4 py-3 text-center">Link</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="v in sortedVariants" :key="v.article_number">
                      <tr class="border-t border-gray-100 hover:bg-gray-50 transition-colors">
                        <td class="px-4 py-2 text-sm font-medium text-gray-800" x-text="v.name"></td>
                        <td class="px-4 py-2 font-mono text-xs text-gray-600" x-text="v.article_number"></td>
                        <td class="px-4 py-2 text-center" x-text="v.num_cores || '-'"></td>
                        <td class="px-4 py-2 text-center">
                          <span x-show="v.protective_conductor === 'Ja'" class="inline-block px-1.5 py-0.5 rounded text-xs font-semibold bg-green-100 text-green-700">G</span>
                          <span x-show="v.protective_conductor === 'Nein'" class="inline-block px-1.5 py-0.5 rounded text-xs font-semibold bg-gray-100 text-gray-600">X</span>
                        </td>
                        <td class="px-4 py-2 text-right" x-text="v.cross_section || '-'"></td>
                        <td class="px-4 py-2 text-right text-gray-500" x-text="v.outer_diameter_mm != null ? fmtNum(v.outer_diameter_mm) : (v.outer_diameter || '-')"></td>
                        <td class="px-4 py-2 text-right" x-text="v.copper_index_kg_per_km != null ? fmtNum(v.copper_index_kg_per_km) : (v.copper_index || '-')"></td>
                        <td class="px-4 py-2 text-right" x-text="v.weight_kg_per_km != null ? fmtNum(v.weight_kg_per_km) : (v.weight || '-')"></td>
                        <td class="px-4 py-2 text-right">
                          <template x-if="v.price_formatted">
                            <span class="font-semibold text-gray-800" x-text="v.price_formatted"></span>
                          </template>
                          <template x-if="v.price_on_request && !v.price_formatted">
                            <span class="text-xs text-yellow-600">Auf Anfrage</span>
                          </template>
                          <template x-if="!v.price_formatted && !v.price_on_request && !pricesLoaded">
                            <span class="text-gray-300">—</span>
                          </template>
                          <template x-if="!v.price_formatted && !v.price_on_request && pricesLoaded">
                            <span class="text-gray-300">—</span>
                          </template>
                        </td>
                        <td class="px-4 py-2 text-right">
                          <template x-if="v.price_per_meter != null">
                            <span class="text-xs text-gray-600" x-text="fmtPrice(v.price_per_meter) + ' €/m'"></span>
                          </template>
                          <template x-if="v.price_per_meter == null">
                            <span class="text-gray-300">—</span>
                          </template>
                        </td>
                        <td class="px-4 py-2 text-center">
                          <span x-show="v.orderable && !v.end_of_sales" class="inline-block w-2 h-2 rounded-full bg-green-500" title="Bestellbar"></span>
                          <span x-show="v.end_of_sales" class="inline-block w-2 h-2 rounded-full bg-red-500" title="Auslaufartikel"></span>
                          <span x-show="!v.orderable && !v.end_of_sales" class="inline-block w-2 h-2 rounded-full bg-yellow-500" title="Nicht bestellbar"></span>
                        </td>
                        <td class="px-4 py-2 text-center">
                          <a :href="v.url" target="_blank" class="text-lapp-600 hover:text-lapp-700">
                            <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                          </a>
                        </td>
                      </tr>
                    </template>
                    <tr x-show="filteredVariants.length === 0">
                      <td colspan="12" class="px-4 py-8 text-center text-gray-400">Keine Varianten gefunden</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </template>
      </div>
    </main>
  </div>

  <script>
    const numFmt = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const priceFmt = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 4 });

    function shopViewer() {
      return {
        query: '',
        searching: false,
        searchResults: [],
        totalResults: null,

        selectedCode: '',
        loadingProduct: false,
        product: null,
        variantFilter: '',
        loadingPrices: false,
        pricesLoaded: false,

        sortCol: 'cross_section_mm2',
        sortDir: 'asc',

        fmtNum(v) { return numFmt.format(v); },
        fmtPrice(v) { return priceFmt.format(v); },

        async init() {
          const params = new URLSearchParams(window.location.search);
          const q = params.get('q');
          if (q) {
            this.query = q;
            await this.searchProducts();
          }
        },

        async searchProducts() {
          if (!this.query.trim()) return;
          this.searching = true;
          this.searchResults = [];
          this.totalResults = null;
          this.product = null;
          this.selectedCode = '';
          try {
            const resp = await fetch('/api/shop/search?q=' + encodeURIComponent(this.query) + '&page_size=50');
            const data = await resp.json();
            this.searchResults = data.products || [];
            this.totalResults = data.total_results || 0;
            // Auto-select if single result
            if (this.searchResults.length === 1) {
              this.loadProduct(this.searchResults[0].base_product_code);
            }
          } catch (e) {
            console.error('Search error:', e);
          } finally {
            this.searching = false;
          }
        },

        async loadProduct(code) {
          this.selectedCode = code;
          this.loadingProduct = true;
          this.product = null;
          this.variantFilter = '';
          this.pricesLoaded = false;
          try {
            const resp = await fetch('/api/shop/product/' + encodeURIComponent(code));
            this.product = await resp.json();
          } catch (e) {
            console.error('Product load error:', e);
          } finally {
            this.loadingProduct = false;
          }
          // Auto-load prices
          this.loadPrices();
        },

        async loadPrices() {
          if (!this.selectedCode || this.loadingPrices) return;
          this.loadingPrices = true;
          try {
            const resp = await fetch('/api/shop/product/' + encodeURIComponent(this.selectedCode) + '/prices');
            const data = await resp.json();
            const priceMap = {};
            for (const p of (data.prices || [])) {
              priceMap[p.article_number] = p;
            }
            // Merge prices into variants
            for (const v of this.product.variants) {
              const p = priceMap[v.article_number];
              if (p) {
                v.price_value = p.price_value;
                v.price_formatted = p.price_formatted;
                v.price_per_meter = p.price_per_meter;
                v.price_unit = p.price_unit;
                v.unit_price_formatted = p.unit_price_formatted;
                v.volume_prices = p.volume_prices;
                if (p.price_on_request) v.price_on_request = true;
              }
            }
            this.pricesLoaded = true;
          } catch (e) {
            console.error('Price load error:', e);
          } finally {
            this.loadingPrices = false;
          }
        },

        get filteredVariants() {
          if (!this.product || !this.product.variants) return [];
          if (!this.variantFilter.trim()) return this.product.variants;
          const q = this.variantFilter.toLowerCase();
          return this.product.variants.filter(v =>
            (v.name || '').toLowerCase().includes(q) ||
            (v.article_number || '').toLowerCase().includes(q) ||
            (v.cross_section || '').toLowerCase().includes(q) ||
            (v.num_cores || '').toLowerCase().includes(q)
          );
        },

        sortBy(col) {
          if (this.sortCol === col) {
            this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            this.sortCol = col;
            this.sortDir = 'asc';
          }
        },

        get sortedVariants() {
          const col = this.sortCol;
          const dir = this.sortDir === 'asc' ? 1 : -1;
          return [...this.filteredVariants].sort((a, b) => {
            let va = a[col], vb = b[col];
            if (va == null) return 1;
            if (vb == null) return -1;
            if (typeof va === 'string') return va.localeCompare(vb, 'de') * dir;
            return (va - vb) * dir;
          });
        },
      };
    }
  </script>
</body>
</html>
