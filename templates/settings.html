<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <title>Einstellungen – Leitungsquerschnitt-Optimierer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lapp: { 600: '#e95e0f', 700: '#c94e0a' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen antialiased transition-colors" x-data="settingsPage()" :class="{'ekanban-mode': ekanbanMode}">

  <!-- eKanban UI Skin -->
  {% include '_ekanban_skin.html' %}

  <!-- Header -->
  <div x-show="!ekanbanMode">
    {% include '_header.html' %}
  </div>

  <main class="max-w-xl mx-auto px-4 py-8">
    <section class="bg-white/90 backdrop-blur-sm border border-slate-200/70 rounded-2xl shadow-sm overflow-hidden">
      <div class="bg-gradient-to-br from-slate-50 to-slate-100 border-b border-slate-200 px-6 py-4">
        <h2 class="text-[0.95rem] font-bold text-slate-900 tracking-tight">Einstellungen</h2>
        <p class="text-sm text-gray-400 mt-0.5">Diese Werte werden lokal gespeichert und im Optimierer verwendet.</p>
      </div>
      <div class="px-6 py-6 space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Strompreis [€/kWh]</label>
          <input type="number" x-model.number="settings.energy_price_eur_per_kwh" step="0.01" min="0"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-lapp-600 focus:border-lapp-600 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Max. Spannungsfall [%]</label>
          <input type="number" x-model.number="settings.max_voltage_drop_percent" step="0.1" min="0"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-lapp-600 focus:border-lapp-600 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">CO2-Emissionsfaktor Strom [kg CO2/kWh]</label>
          <input type="number" x-model.number="settings.electricity_emission_factor_kg_per_kwh" step="0.001" min="0"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-lapp-600 focus:border-lapp-600 outline-none">
          <p class="text-xs text-gray-400 mt-1">Deutscher Strommix 2024: ca. 0,368 kg CO2/kWh</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">CO2-Emissionsfaktor Kupfer [kg CO2/kg Cu]</label>
          <input type="number" x-model.number="settings.copper_emission_factor_kg_per_kg" step="0.001" min="0"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-lapp-600 focus:border-lapp-600 outline-none">
          <p class="text-xs text-gray-400 mt-1">Primärkupfer: ca. 3,965 kg CO2/kg</p>
        </div>
      </div>
      <div class="px-6 pb-6 flex gap-3">
        <button @click="save()"
          class="flex-1 text-white font-bold py-2.5 px-6 rounded-xl transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0" style="background:linear-gradient(135deg,#e95e0f,#f97316 50%,#fb923c);box-shadow:0 4px 15px rgba(233,94,15,0.25)">
          Speichern
        </button>
        <button @click="reset()"
          class="px-6 py-2.5 border border-gray-300 text-gray-600 hover:bg-gray-50 font-medium rounded-xl transition-colors">
          Zurücksetzen
        </button>
      </div>
      <div x-show="saved" x-transition.opacity class="px-6 pb-4">
        <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-lg px-4 py-2">Einstellungen gespeichert.</div>
      </div>
    </section>
  </main>

  <div x-show="!ekanbanMode" x-transition.opacity>
    {% include '_footer.html' %}
  </div>

  <script id="defaults-data" type="application/json">{{ defaults | tojson }}</script>
  <script>
    const DEFAULTS = JSON.parse(document.getElementById('defaults-data').textContent);

    function settingsPage() {
      return {
        ekanbanMode: localStorage.getItem('ekanbanMode') === 'true' && window.innerWidth >= 768,
        toggleEkanban() {
          if (window.innerWidth < 768) return;
          this.ekanbanMode = !this.ekanbanMode;
          localStorage.setItem('ekanbanMode', this.ekanbanMode);
        },
        settings: { ...DEFAULTS },
        saved: false,

        init() {
          const stored = JSON.parse(localStorage.getItem('lapp_settings') || '{}');
          Object.assign(this.settings, stored);
        },

        save() {
          localStorage.setItem('lapp_settings', JSON.stringify(this.settings));
          this.saved = true;
          setTimeout(() => this.saved = false, 2000);
        },

        reset() {
          this.settings = { ...DEFAULTS };
          localStorage.removeItem('lapp_settings');
          this.saved = false;
        },
      };
    }
  </script>
</body>
</html>
