<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPP Snake - Easter Egg</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              lapp: {
                500: '#f97316', // fallback orange
                600: '#e95e0f', // LAPP orange
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #080d1a 0%, #0f1629 40%, #111827 100%);
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      canvas {
        background-color: #1e293b;
        border: 4px solid #e95e0f;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(233, 94, 15, 0.3);
      }
      #go-back {
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        text-decoration: none;
        color: white;
        transition: background-color 0.2s;
      }
      #go-back:hover {
        background-color: rgba(255, 255, 255, 0.2);
      }
    </style>
</head>
<body>
    <a id="go-back" href="/">&larr; Zurück</a>
    
    <div class="text-center mb-6">
        <h1 class="text-4xl font-bold text-lapp-600 mb-2 tracking-wide">LAPP Cable Snake</h1>
        <p class="text-gray-400">Sammle die LAPP Favicons, um das Kabel zu verlaengern!</p>
        <p class="text-xs text-gray-500 mt-1">Steuerung: Pfeiltasten</p>
    </div>

    <div class="relative">
        <div id="score-display" class="absolute top-4 right-4 text-xl font-bold text-white z-10 bg-black/50 px-3 py-1 rounded">0</div>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div id="game-over" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 hidden rounded-lg">
            <h2 class="text-4xl font-bold text-red-500 mb-4">GAME OVER</h2>
            <button onclick="resetGame()" class="px-6 py-2 bg-lapp-600 hover:bg-orange-500 text-white rounded font-bold transition-colors">Nochmal spielen</button>
        </div>
    </div>

    <!-- The food image (LAPP Favicon) to draw on canvas -->
    <img id="favicon-img" src="/static/favicon.svg" alt="Food" style="display: none;">

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const gameOverScreen = document.getElementById('game-over');
        const foodImg = document.getElementById('favicon-img');

        const gridSize = 20;
        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameLoop;
        let gameActive = false;

        function initGame() {
            snake = [
                {x: 300, y: 200},
                {x: 280, y: 200},
                {x: 260, y: 200}
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            updateScore();
            spawnFood();
            
            if (gameLoop) clearInterval(gameLoop);
            gameActive = true;
            gameOverScreen.classList.add('hidden');
            gameLoop = setInterval(update, 100);
        }

        function update() {
            if (!gameActive) return;

            // Move snake
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Check wall collision
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                endGame();
                return;
            }

            // Check self collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw food
            if (foodImg.complete) {
                ctx.drawImage(foodImg, food.x, food.y, gridSize, gridSize);
            } else {
                ctx.fillStyle = '#e95e0f';
                ctx.beginPath();
                ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw snake (cable style)
            snake.forEach((segment, index) => {
                // Main cable body
                ctx.fillStyle = '#e95e0f'; // LAPP Orange
                ctx.fillRect(segment.x + 1, segment.y + 1, gridSize - 2, gridSize - 2);

                // Add a little highlight to make it look like a cylindrical cable
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(segment.x + 2, segment.y + 2, gridSize - 4, 3);

                // Head rendering with eyes
                if (index === 0) {
                    ctx.fillStyle = 'black';
                    // Eyes adjust based on direction
                    if (dx > 0) {
                        ctx.fillRect(segment.x + 12, segment.y + 4, 4, 4);
                        ctx.fillRect(segment.x + 12, segment.y + 12, 4, 4);
                    } else if (dx < 0) {
                        ctx.fillRect(segment.x + 4, segment.y + 4, 4, 4);
                        ctx.fillRect(segment.x + 4, segment.y + 12, 4, 4);
                    } else if (dy < 0) {
                        ctx.fillRect(segment.x + 4, segment.y + 4, 4, 4);
                        ctx.fillRect(segment.x + 12, segment.y + 4, 4, 4);
                    } else if (dy > 0) {
                        ctx.fillRect(segment.x + 4, segment.y + 12, 4, 4);
                        ctx.fillRect(segment.x + 12, segment.y + 12, 4, 4);
                    }
                }
            });
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize,
                y: Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize
            };
            
            // Re-spawn if on snake
            for(let part of snake) {
                if(part.x === food.x && part.y === food.y) spawnFood();
            }
        }

        function updateScore() {
            scoreDisplay.textContent = score;
        }

        function endGame() {
            gameActive = false;
            clearInterval(gameLoop);
            gameOverScreen.classList.remove('hidden');
        }

        function resetGame() {
            initGame();
        }

        // Input handling
        let lastDx = gridSize;
        let lastDy = 0;
        
        document.addEventListener('keydown', (e) => {
            // Prevent default scrolling for arrows
            if([37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();

            // Prevent rapid reverse direction causing immediate death
            if (e.key === 'ArrowUp' && dy === 0) {
                dx = 0; dy = -gridSize;
            } else if (e.key === 'ArrowDown' && dy === 0) {
                dx = 0; dy = gridSize;
            } else if (e.key === 'ArrowLeft' && dx === 0) {
                dx = -gridSize; dy = 0;
            } else if (e.key === 'ArrowRight' && dx === 0) {
                dx = gridSize; dy = 0;
            }
        });

        // Ensure image loads before first draw if possible
        foodImg.onload = () => {
            if(!gameActive) {
                initGame();
            }
        };

        // Start game initially
        initGame();
    </script>
</body>
</html>
